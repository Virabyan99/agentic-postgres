# Repository contract enforcement.
#
# This workflow invokes bin/session-01-check.sh. It deliberately does not
# maintain a second, divergent definition of "passing" -- if the gate and CI
# could disagree, the gate would stop meaning anything locally.
#
# Third-party actions are pinned to full commit SHAs, with the intended release
# tag annotated. A tag is mutable; a SHA is not.
#
# No provider credential is required, and no dummy secret is added to make
# anything pass. Every check here is derivable from the repository itself.

name: contract

on:
  push:
    # `session-*` as well as main (D1057). Every session until now committed
    # straight to main, so a branch push registering NO runs never surfaced --
    # and when it did, it surfaced badly: `gh api .../runs?head_sha=<sha>`
    # exits 0 with an empty list, and an empty list reads identically as "not
    # registered yet" and "will never be triggered". A watcher polling it waits
    # out its whole budget and reports a timeout that looks like infrastructure
    # trouble rather than a workflow that was never going to fire.
    #
    # That is ADR 0195's class in the CI reader: an answer substituted for a
    # failure to determine one. Widening the trigger is the cheap half; the
    # other half is that an empty listing is not evidence until the workflow's
    # own triggers have been read.
    branches: [main, 'session-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Session 1 gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate records the tested commit, so it must see real history.
          fetch-depth: 0
          persist-credentials: false

      - name: Read the pinned interpreter
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Install the pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Must match the version bin/lock-dev-deps.sh pins, or --check fails.
          version: "0.12.1"

      # **shellcheck is pinned by version and checksum, not taken from apt.**
      # `apt-get install shellcheck` gave the runner 0.9.0 while this repository
      # is developed against 0.11.0, and the two disagree: 0.9.0 and 0.10.0 raise
      # SC2015 on two lines and exit 1, 0.11.0 exits 0. It is the first command
      # in the gate's step 2, so the gate died here on every run for a month.
      # The gate refuses any other version, so this and the constant it checks
      # against must move together -- `test_ci_installs_the_shellcheck_the_gate_
      # pins` asserts they do.
      - name: Install the pinned shellcheck and jq
        run: |
          version=0.11.0
          sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -sSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"
          echo "${sha256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq

      - name: Create the environment and install hash-locked dependencies
        run: |
          uv venv --seed --python "$(cat .python-version)" .venv
          . .venv/bin/activate
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Confirm the runner matches the pinned toolchain
        run: |
          . .venv/bin/activate
          bin/doctor.sh

      - name: Run the Session 1 gate
        run: |
          . .venv/bin/activate
          bin/session-01-check.sh

      # Session 22 (ADR 0202): the current session's OFFLINE evidence half,
      # written from the gate's own JUnit rather than from a second run -- the
      # two would be different measurements of different collections, and the
      # evidence model's whole rule is that a claim's verdict is computed from
      # the results of exactly the node ids the registry lists.
      #
      # The session is DERIVED and never typed (ADR 0014), which is the same
      # repair D719 made to the writer's own bounds. A claim this checkout
      # cannot prove makes this step red, and that is the point of putting it
      # here: an offline claim that stops being provable is a defect a push
      # should surface, not something a session close discovers.
      - name: Write the offline evidence half
        run: |
          . .venv/bin/activate
          session="$(PYTHONPATH=src python -c 'from agentic_postgres import CURRENT_SESSION as s; print(s)')"
          python bin/write-session-evidence.py --session "${session}" --mode offline \
            --junit .generated/session-01/contract-tests.xml \
            --output "evidence/session-$(printf '%02d' "${session}")-offline.json"

      # Short-lived, and safe to publish: the gate has already asserted that
      # generated output contains no credential, no secret-bearing key, and no
      # credential-carrying URL.
      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: session-01-evidence
          path: |
            .generated/session-01/
            evidence/session-01.json
            evidence/session-*-offline.json
          retention-days: 7
          if-no-files-found: warn

  session-2-contract:
    name: Session 2 offline contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # What this job can and cannot assert is worth stating plainly. It has
    # Docker and no credentials, so it proves everything that is a property of
    # the model: schemas, unit files, image builds, and the socket-proxy policy
    # against the runner's own daemon. It cannot reach the VPS, obtain an ACME
    # certificate, contact Infisical, or run ufw/iptables/sshd -T. Those are
    # release evidence, produced by bin/session-02-check.sh, not pull-request CI.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned interpreter
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Install hash-locked dependencies
        run: |
          uv venv --seed --python "$(cat .python-version)" .venv
          . .venv/bin/activate
          python -m pip install --require-hashes -r requirements-dev.txt

      # The session is derived, not passed: setting it here would let CI test a
      # different policy than the gate does, which is the whole failure ADR 0014
      # removed.
      #
      # **This step asserted the constant was equal to the literal two**, under
      # a comment saying the value must not be a literal, and has failed on every
      # push since the constant first moved. Question 5's shape in the one file
      # the guard against it does not read: `_operator_commands()` globs
      # `bin/*.py`, and a workflow is not a `.py`.
      #
      # What replaces it has content that cannot go stale -- the workflow must
      # not OVERRIDE the derivation. Whether the derivation is right is the
      # gate's job, and `test_the_derivation_actually_produces_the_current_session`
      # already runs the expression rather than grepping for it.
      - name: Confirm the acceptance session is derived, not passed
        run: |
          . .venv/bin/activate
          if [ -n "${APG_ACCEPTANCE_SESSION:-}" ]; then
            echo "CI exports APG_ACCEPTANCE_SESSION=${APG_ACCEPTANCE_SESSION}; the suite would test a policy the gate does not" >&2
            exit 1
          fi
          PYTHONPATH=src python -c 'from agentic_postgres import CURRENT_SESSION as s; assert isinstance(s, int) and s >= 1, s; print(f"acceptance session {s}, derived from the package")'

      # **Rendering comes BEFORE the suite, as it does in the gate** (D877).
      # Ninety proofs read `.generated/fixture-alpha-dev/outputs.json` -- 88 of
      # them through a module fixture that starts a cluster first -- and this job
      # rendered afterwards. On a developer machine `.generated/` survives from
      # the last gate run, so the ordering never showed; on a fresh runner it
      # produced 88 errors and two failures, all one FileNotFoundError.
      # `bin/session-01-check.sh` renders at its step 3 and runs the suite at
      # step 4, and this is the same order.
      - name: Edge and project Compose models resolve
        run: |
          . .venv/bin/activate
          ./deploy.sh --project project.example.yaml \
            --capabilities capabilities.example.yaml --render-only >/dev/null
          bin/compose.sh .generated/fixture-alpha-dev --profile contract config >/dev/null
          bin/compose.sh --edge --host host.example.yaml config >/dev/null

      # Session 22 (D1073, D1169): the product's own local environment is what
      # a pull request's environment is here. It runs after the render above
      # because `up` refuses a project this checkout has not rendered, which is
      # the same order `bin/session-01-check.sh` takes.
      #
      # Timed, because the capacity envelope reads these numbers (D1168). A
      # fresh runner has NOT cached the postgres image, and that is the case
      # the workstation cannot measure without evicting the image the whole
      # contract suite shares -- so the uncached first run is measured here and
      # nowhere else. Arithmetic in python rather than `bc`: the venv is
      # already active and one fewer assumption about the runner image.
      - name: The local environment stands up, seeds, resets and comes down
        run: |
          . .venv/bin/activate
          now() { python -c 'import time; print(f"{time.time():.3f}")'; }
          t0=$(now)
          bin/apg.sh dev up --project project.example.yaml
          t1=$(now)
          bin/apg.sh dev status --project project.example.yaml
          bin/apg.sh dev seed --project project.example.yaml example
          t2=$(now)
          bin/apg.sh dev reset --project project.example.yaml
          t3=$(now)
          bin/apg.sh dev down --project project.example.yaml
          python -c "print(f'dev up: {$t1 - $t0:.2f} s (image not cached)'); print(f'dev reset: {$t3 - $t2:.2f} s')"

      # Session 23 (ADR 0204): the committed example client is what the emitter
      # produces, it typechecks under --strict on the pinned toolchain, and
      # `generate --check` refuses a stale one. `--network none` is the runner's
      # own default, and it matters here: `npx tsc` resolves from the working
      # directory and would FETCH (D1225), inside a claim declared offline. The
      # runtime smoke against a real served surface runs in the suite below
      # (test_generated_client_runtime).
      - name: The generated example client is current and typechecks
        run: |
          . .venv/bin/activate
          bin/apg.sh generate --check --project project.example.yaml
          set -a; . ./versions.env; set +a
          docker build -q --build-arg "BASE_IMAGE=${NODE_RUNTIME_IMAGE}" \
            -t apg-client-typescript services/clients/typescript
          docker run --rm -v "$PWD/projects/example/clients/typescript:/work:ro" \
            apg-client-typescript

      - name: Offline Session 2 contract suite
        run: |
          . .venv/bin/activate
          python -m pytest -q -m "p0 and not future and not live_host and not external"

      # live_host and external tests must be importable and collectible with no
      # host and no network. A module that opened a socket at import time would
      # break collection for the whole suite, and this is where that surfaces.
      - name: Environment-gated tests collect and skip cleanly
        run: |
          . .venv/bin/activate
          python -m pytest -q -m "live_host or external" | tee /tmp/gated.txt
          grep -qE '[0-9]+ skipped' /tmp/gated.txt
          ! grep -qE '[0-9]+ (failed|error)' /tmp/gated.txt

      # BASE_IMAGE is passed explicitly because neither Dockerfile declares a
      # default: a FROM line naming a tag would be a second, unlocked version
      # declaration that bin/lock-versions.sh could not see. A bare
      # `docker build` here fails, and that is the intended behaviour.
      - name: Probe images build from the locked base
        run: |
          set -a; . ./versions.env; set +a
          docker build -q --build-arg "BASE_IMAGE=${PYTHON_RUNTIME_IMAGE}" services/edge-probe
          docker build -q --build-arg "BASE_IMAGE=${PYTHON_RUNTIME_IMAGE}" services/secret-check

      # **This step has never passed.** It arrived with the units in 78cc37b on
      # 2026-08-04, the day of CI's last green run, and `systemd-analyze verify`
      # resolves every `ExecStart` -- so it failed on
      # `/usr/local/libexec/agentic-postgres/*`, which nothing in a checkout
      # installs, from its first execution (D878). §7's second question, asked
      # of the check rather than of the code: has it run at all, in this
      # environment, since the thing it measures last changed?
      #
      # The launchers are installed the way a host installs them, through the
      # one command that owns the `agentic-postgres-<name>` -> `<name>` mapping.
      # Restating that mapping here would be a second authority over it, which
      # is ADR 0002, and it is the mapping most likely to be got subtly wrong.
      - name: Unit files are valid
        run: |
          sudo bin/provision-host.sh --install-launchers
          systemd-analyze verify systemd/*.service

  future-inventory:
    name: P0 inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned interpreter
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Install hash-locked dependencies
        run: |
          uv venv --seed --python "$(cat .python-version)" .venv
          . .venv/bin/activate
          python -m pip install --require-hashes -r requirements-dev.txt

      # Reported separately from the gate so the complete P0 inventory and the
      # future-work list are visible in the job log without reading artifacts.
      - name: Collect the full P0 inventory
        run: |
          . .venv/bin/activate
          python -m pytest --collect-only -q -m p0

      # D695: pytest returns 5 when a marker selects nothing, and there are no
      # `future` placeholders left -- an empty list is the finished state of this
      # repository, not a failure. D695's repair moved the test that assumed
      # otherwise and left this step, which makes the same assumption, running
      # the same command. Any OTHER non-zero code is still a failure: a step that
      # swallowed every code would report a broken suite as no outstanding work.
      - name: Show outstanding future work
        run: |
          . .venv/bin/activate
          set +e
          python -m pytest -q -m future
          status=$?
          set -e
          case "${status}" in
            0) ;;
            5) echo "no future-marked work remains" ;;
            *) exit "${status}" ;;
          esac
