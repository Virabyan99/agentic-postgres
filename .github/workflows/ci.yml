# Repository contract enforcement.
#
# This workflow invokes bin/session-01-check.sh. It deliberately does not
# maintain a second, divergent definition of "passing" -- if the gate and CI
# could disagree, the gate would stop meaning anything locally.
#
# Third-party actions are pinned to full commit SHAs, with the intended release
# tag annotated. A tag is mutable; a SHA is not.
#
# No provider credential is required, and no dummy secret is added to make
# anything pass. Every check here is derivable from the repository itself.

name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Session 1 gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate records the tested commit, so it must see real history.
          fetch-depth: 0
          persist-credentials: false

      - name: Read the pinned interpreter
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Install the pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Must match the version bin/lock-dev-deps.sh pins, or --check fails.
          version: "0.12.1"

      - name: Install shellcheck and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq

      - name: Create the environment and install hash-locked dependencies
        run: |
          uv venv --seed --python "$(cat .python-version)" .venv
          . .venv/bin/activate
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Confirm the runner matches the pinned toolchain
        run: |
          . .venv/bin/activate
          bin/doctor.sh

      - name: Run the Session 1 gate
        run: |
          . .venv/bin/activate
          bin/session-01-check.sh

      # Short-lived, and safe to publish: the gate has already asserted that
      # generated output contains no credential, no secret-bearing key, and no
      # credential-carrying URL.
      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: session-01-evidence
          path: |
            .generated/session-01/
            evidence/session-01.json
          retention-days: 7
          if-no-files-found: warn

  future-inventory:
    name: P0 inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned interpreter
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Install hash-locked dependencies
        run: |
          uv venv --seed --python "$(cat .python-version)" .venv
          . .venv/bin/activate
          python -m pip install --require-hashes -r requirements-dev.txt

      # Reported separately from the gate so the complete P0 inventory and the
      # future-work list are visible in the job log without reading artifacts.
      - name: Collect the full P0 inventory
        run: |
          . .venv/bin/activate
          python -m pytest --collect-only -q -m p0

      - name: Show outstanding future work
        run: |
          . .venv/bin/activate
          python -m pytest -q -m future
