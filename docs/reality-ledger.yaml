  - id: sleep
    concept: Sleep and wake
    status: beta
    customer_text: >-
      A member puts a project to sleep and wakes it; its data is kept, and while
      it sleeps its addresses and its database doors refuse connections and its
      backups stop, so its last restore point is the moment it went to sleep.
    today: >-
      POST /v1/projects/{key}/sleep and /wake (bin/project.sh sleep, wake)
      record project.sleep and project.wake operations; the reconciler stops and
      starts the slot's containers with their volumes kept, and the project's
      boot unit and backup timers with them. While it sleeps its customer
      poolers are stopped too, so both public names refuse the connection
      (D2336). Built in Session 38 and run end to end on 1.16.0; re-trialed in
      Session 39 on 1.17.0 (D2415) and in Session 40 on 1.18.0, where
      lifecycle_reearned_live did not pass (D2500: the instrument's pool probe
