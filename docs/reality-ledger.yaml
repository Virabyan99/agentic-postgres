# The Reality Ledger (ADR 0247, LEDGER-001).
#
# One row per product concept, saying what it is TODAY. A program reads this
# file: tests/contract/test_reality_ledger.py guards it, and
# bin/render-reality-ledger.py renders docs/reality-ledger.md from it (that
# page is generated -- edit this file, then `--write`).
#
# The fields are ADR 0247's. `customer_text` is the sentence a customer would
# read; `today` is what the appliance does now for its operator. `today_evidence`
# proves `today`; `evidence` proves a customer-facing `available` or `beta`
# status and is empty for every other status (D2009). A customer-facing row
# moves with its evidence: once every claim it names reads `passed` in the
# newest merged evidence document, which a session writes after its trip --
# so in practice at the session's close (ADR 0254, amending ADR 0247; D2021).
#
# Session 36 writes today's truth: no customer exists, so every concept a
# customer would use is `planned` (or `not_offered`, cut by decision), and the
# substrate the operator already runs is `planned` FOR A CUSTOMER with the
# claim that proves it for the operator.
#
# Session 38 (ADR 0261, D2170) moves the six managed-project concepts to
# `trial`: built in this session and reachable while their evidence is
# collected, each naming only claims this session introduced and saying "being
# verified" to the customer. The session's close moves each to `beta` if every
# claim it names passed, or back to `planned` with its operation types no longer
# accepted.

schema_version: 1
rows:
  # -------------------------------------------------------------------------
  # Accounts and the management surface (Session 37)
  # -------------------------------------------------------------------------
  - id: accounts
    concept: Accounts
    status: beta
    customer_text: >-
      By invitation only. A person who receives an invitation creates an account
      with a password and signs in to the management API; there is no public
      signup.
    today: >-
      Accounts live in the control project (control.agenticpostgresql.com),
      created only by accepting an invitation, and span the projects their
      organizations hold. Each project's own auth service still holds that
      project's people.
    today_evidence: null
    evidence: [control_invitations, control_invitations_live]
    stage5_reality: >-
      An account in the control project, created when a person accepts an
      invitation: an account invitation the registry administrator minted, or
      a membership invitation an owner or admin minted for a role at or below
      their own (D1951, ADR 0252). Built and walked in Session 37; offered by
      invitation.
    eventual: Self-service signup with verified email.
    controls: []
    since_session: 36
    target_session: 37

  - id: organizations
    concept: Organizations
    status: beta
    customer_text: >-
      An organization groups people and projects, with the roles owner, admin,
      member and viewer. Owners and admins sign in with a second factor (an
      authenticator app's six-digit codes).
    today: >-
      Organizations and memberships live in the control project; the operator
      adopts each deployed project into one with bin/control.sh adopt, and a
      member reads the projects of their organizations.
    today_evidence: null
    evidence: [control_roles, control_totp_live]
    stage5_reality: >-
      Organizations and memberships in the control project's own migration set;
      TOTP required for owners and admins.
    eventual: Organizations with single sign-on and audit export.
    controls: []
    since_session: 36
    target_session: 37

  - id: api_keys
    concept: Management API keys
    status: beta
    customer_text: >-
      A key reads your organizations and projects through the management API.
      It is shown once, never opens a database, and stops working when it is
      revoked or its owner leaves the organization.
    today: >-
      Keys are minted by a signed-in person with read scopes only; a key can
      create nothing (every write route refuses a key). An agent identity's
      secret still opens that project's agent plane and nothing else.
    today_evidence: null
    evidence: [control_keys, control_keys_live]
    stage5_reality: >-
      Keys shown once, stored as an id and a SHA-256 of 256 random bits, scoped
      from Session 37's four read scopes intersected with the owner's current
      role, minted only by a person, and refused on the next request once
      revoked or once the owner leaves (D1952, ADR 0253). Built and walked in
      Session 37; offered by invitation.
    eventual: Keys with expiry, rotation reminders and per-key usage.
    controls: []
    since_session: 36
    target_session: 37

