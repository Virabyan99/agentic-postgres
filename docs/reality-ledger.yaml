  - id: compute_profiles
    concept: Compute size
    status: trial
    customer_text: >-
      Being verified. A project runs at one of three sizes: small, standard or
      large. Changing the size restarts the project; when the server has no room
      for the new size the change is refused and nothing changes.
    today: >-
      Three named profiles -- small, standard (the release defaults) and large
      -- selected by a manifest's compute block (schema 10) and applied where
      the manifest is loaded, so every existing limit check bounds them. PUT
      /v1/projects/{key}/compute (bin/compute.sh set) records a project.resize
      operation the reconciler admits before it changes anything.
    today_evidence: null
    evidence:
      - compute_profiles
      - resize_message
      - lifecycle_operations_live
    stage5_reality: >-
      PUT /v1/projects/{key}/compute records a project.resize operation;
      admission refuses a profile the server has no room for with nothing
      changed, and the message says the restart has not been measured on this
      server until a measured window exists (D1955, D2157, ADR 0258).
    eventual: Compute scheduled independently of storage.
    controls: [project.resize, bin/compute.sh set, bin/compute.sh get]
    since_session: 38
    target_session: 38

  - id: sleep
    concept: Sleep and wake
    status: trial
    customer_text: >-
      Being verified. A project sleeps and wakes when someone asks. While it
      sleeps its addresses answer "not found" and no new restore point is
      taken; its data and its last restore point are kept.
    today: >-
      POST /v1/projects/{key}/sleep and /wake (bin/project.sh sleep, wake)
      record project.sleep and project.wake operations; the reconciler stops
      and starts the slot's containers with their volumes kept, and the
      project's boot unit and backup timers with them.
    today_evidence: null
    evidence:
      - sleep_wake
      - lifecycle_operations_live
      - lifecycle_project_door_live
    stage5_reality: >-
      project.sleep and project.wake, by request only, stop and start the
      project's containers with volumes kept; while it sleeps a caller gets the
      edge's 404, and its archiver is stopped, so its last restore point is the
      moment it went to sleep (D1956, D2155, ADR 0259). Idle sleep is its own
      row.
    eventual: Compute suspended and resumed independently of storage.
    controls: [project.sleep, project.wake, bin/project.sh sleep, bin/project.sh wake]
    since_session: 38
    target_session: 38

