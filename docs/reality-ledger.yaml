      moment it went to sleep (D1956, D2155, ADR 0259). Idle sleep is its own
      row.
    eventual: Compute suspended and resumed independently of storage.
    controls:
      - project.sleep
      - project.wake
      - bin/project.sh sleep
      - bin/project.sh wake
    since_session: 38
    target_session: 42

  - id: idle_sleep
    concept: Sleep when idle
    status: beta
    customer_text: >-
      A member may set a project to sleep after 15, 30 or 60 minutes with no
      request and no connection; it is off unless you turn it on. While it
      sleeps its backups stop, so its last restore point is the moment it went
      to sleep, and it wakes only when someone asks.
    today: >-
      PUT /v1/projects/{key}/idle-sleep (bin/project.sh idle-sleep) records the
      minutes, offered only while project.sleep is accepted (D2548). The
      reconciler samples every slot every 300 s (ADR 0275) and asks the control
      set whether an awake slot is idle; the control set inserts ONE
      project.sleep with origin idle, on behalf of the member who set the
      minutes, only over a window of samples all present, awake, read and quiet
      -- no request answered below 400 and no connection by the project's own
      roles (ADR 0276). A missing or unread sample keeps the project awake.
      Built in Session 41 and run on slot5-prod, where idle_sleep_live and
      idle_trigger passed on the tagged evidence; the setting acts through
      project.sleep, so it follows sleep's row (D2548, D2560). Re-earned in
      Session 42 on slot6-prod, set to 15 minutes with the probes stopped: the
      reconciler requested the sleep about 20 minutes later and
      idle_sleep_retrial_live passed on the tagged evidence (1.20.0 on 77303e4).
    today_evidence: null
    evidence:
      - idle_sleep_retrial_live
    stage5_reality: >-
      A per-project setting the reconciler acts on, built with Session 41's
      sampler of the counters it reads (D2147).
    eventual: Compute suspended automatically and resumed on demand.
    controls:
      - PUT /v1/projects/{key}/idle-sleep
      - bin/project.sh idle-sleep
    since_session: 38
    target_session: 42

  # -------------------------------------------------------------------------
  # Connection endpoints (Session 39)
  # -------------------------------------------------------------------------
  - id: pooled_endpoint
    concept: Pooled connection string
    status: beta
    customer_text: >-
      A project's pooled connection string -- pool.<project domain>, port 5432,
      TLS required (sslmode=verify-full) -- reaches the project's own
      transaction pooler as its application role. The password is one your CLI
      generated (apg endpoint credential); it never left your machine.
    today: >-
      Since Session 39 the edge's port 5432 routes TLS by name to a project's
      customer poolers: pool.<domain> reaches a transaction-mode PgBouncer that
      admits only the customer_app role, whose credential is a SCRAM verifier
      set from the customer's CLI. GET /v1/projects/{key}/connections (apg
      endpoint show) serves the address and a snippet per client measured
      through it. Only a slot has the facility; alpha, beta and the control
      project have none, and the platform's own pooler and the database are
      never routed (ADR 0268, ADR 0269). Built and deployed in Session 39
      (1.17.0); public_endpoints_live did not pass on its tagged evidence
      (D2416, repaired at that close); re-earned in Session 40 on 1.18.0 through
      a new slot's two names (endpoints_reearned_live, D2442).
    today_evidence: null
    evidence:
      - endpoints_reearned_live
    stage5_reality: >-
      A TLS endpoint per project on the edge's port 5432, routed by name to a
      customer-only transaction pooler, plaintext refused (ADR 0268).
    eventual: The same, behind a fleet-wide gateway.
    controls:
      - GET /v1/projects/{key}/connections
      - bin/endpoint.sh show
      - bin/endpoint.sh connect
    since_session: 36
    target_session: 40

  - id: direct_endpoint
    concept: Direct connection string
    status: beta
    customer_text: >-
      A project's direct connection string -- direct.<project domain>, port
