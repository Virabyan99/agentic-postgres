  - id: sleep
    concept: Sleep and wake
    status: trial
    customer_text: >-
      Being verified. A member puts a project to sleep and wakes it; its data is
      kept, and while it sleeps its addresses and its database doors refuse
      connections.
    today: >-
      POST /v1/projects/{key}/sleep and /wake (bin/project.sh sleep, wake)
      record project.sleep and project.wake operations; the reconciler stops and
      starts the slot's containers with their volumes kept, and the project's
      boot unit and backup timers with them. While it sleeps its customer
      poolers are stopped too, so both public names refuse the connection
      (D2336). Built in Session 38 and run end to end on 1.16.0, where its live
      proofs failed for reasons Session 38's close repaired (D2310,
      D2317-D2321); re-trialed in Session 39 on 1.17.0, its lifecycle run again
      on a second slot and read through /v1 and the slot's own door
      (lifecycle_retrial_live, D2343).
    today_evidence: null
    evidence:
      - lifecycle_retrial_live
    stage5_reality: >-
      project.sleep and project.wake, by request only, stop and start the
      project's containers with volumes kept; while it sleeps a caller gets the
      edge's 404, and its archiver is stopped, so its last restore point is the
      moment it went to sleep (D1956, D2155, ADR 0259). Idle sleep is its own
      row.
    eventual: Compute suspended and resumed independently of storage.
    controls:
      - project.sleep
      - project.wake
      - bin/project.sh sleep
      - bin/project.sh wake
    since_session: 38
    target_session: 39

