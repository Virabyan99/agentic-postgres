  - id: pooled_endpoint
    concept: Pooled connection string
    status: trial
    customer_text: >-
      Being verified. A project's pooled connection string -- pool.<project
      domain>, port 5432, TLS required (sslmode=verify-full) -- reaches the
      project's own transaction pooler as its application role. The password is
      one your CLI generated (apg endpoint credential); it never left your
      machine.
    today: >-
      Since Session 39 the edge's port 5432 routes TLS by name to a project's
      customer poolers: pool.<domain> reaches a transaction-mode PgBouncer that
      admits only the customer_app role, whose credential is a SCRAM verifier
      set from the customer's CLI. GET /v1/projects/{key}/connections (apg
      endpoint show) serves the address and a snippet per client measured
      through it. Only a slot has the facility; alpha, beta and the control
      project have none, and the platform's own pooler and the database are
      never routed (ADR 0268, ADR 0269).
    today_evidence: null
    evidence:
      - public_endpoints_live
      - public_port_scan
      - endpoint_routes
      - customer_poolers
      - connection_api
      - connection_snippets
    stage5_reality: >-
      A TLS endpoint per project on the edge's port 5432, routed by name to a
      customer-only transaction pooler, plaintext refused (ADR 0268).
    eventual: The same, behind a fleet-wide gateway.
    controls:
      - GET /v1/projects/{key}/connections
      - bin/endpoint.sh show
      - bin/endpoint.sh connect
    since_session: 36
    target_session: 39

  - id: direct_endpoint
    concept: Direct connection string
    status: trial
    customer_text: >-
      Being verified. A project's direct connection string -- direct.<project
      domain>, port 5432, TLS required -- reaches a session pooler as the
      project's administrator role, for migrations and tables in the public
      schema. Setting a role's password again (apg endpoint credential) replaces
      the previous one.
    today: >-
      direct.<domain> reaches a session-mode PgBouncer that admits only the
      customer_admin role, which may create in the public schema and nothing
      else -- no app, api or app_private; no schema, role or extension. POST
      /v1/projects/{key}/credentials (apg endpoint credential, a person, member
      and above) records a credential.rotate operation whose argument is the
      verifier, never a password; the reconciler sets it and rewrites both
      poolers' lists. A session, not a raw connection to the database (ADR
      0269).
    today_evidence: null
    evidence:
