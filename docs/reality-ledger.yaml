# The Reality Ledger (ADR 0247, LEDGER-001).
#
# One row per product concept, saying what it is TODAY. A program reads this
# file: tests/contract/test_reality_ledger.py guards it, and
# bin/render-reality-ledger.py renders docs/reality-ledger.md from it (that
# page is generated -- edit this file, then `--write`).
#
# The fields are ADR 0247's. `customer_text` is the sentence a customer would
# read; `today` is what the appliance does now for its operator. `today_evidence`
# proves `today`; `evidence` proves a customer-facing `available` or `beta`
# status and is empty for every other status (D2009). A customer-facing row
# moves with its evidence: once every claim it names reads `passed` in the
# newest merged evidence document, which a session writes after its trip --
# so in practice at the session's close (ADR 0254, amending ADR 0247; D2021).
#
# Session 36 writes today's truth: no customer exists, so every concept a
# customer would use is `planned` (or `not_offered`, cut by decision), and the
# substrate the operator already runs is `planned` FOR A CUSTOMER with the
# claim that proves it for the operator.
#
# Session 38 (ADR 0261, D2170) moves the six managed-project concepts to
# `trial`: built in this session and reachable while their evidence is
# collected, each naming only claims this session introduced and saying "being
# verified" to the customer. The session's close moves each to `beta` if every
# claim it names passed, or back to `planned` with its operation types no longer
# accepted.
#
# Session 38's close (Run 13, D2170 applied as written): all six named a claim
# that failed on evidence/session-38.json -- lifecycle_operations_live (D2310),
# lifecycle_project_door_live (D2321), reconciler_live (D2318), the last two
# proof defects -- so all six are `planned` again, target Session 39, and no
# operation type is accepted. Session 39 moves them back to `trial`.
#
# Session 39 (Run 9, D2343) moved the six and pooled_endpoint/direct_endpoint to
# `trial`. Its close (Run 12) read the TAGGED evidence, evidence/session-39.json
# (248/253): each of the eight names lifecycle_retrial_live (D2415) or
# public_endpoints_live (D2416), both `failed`, so all eight are `planned` again,
# target Session 40, and no operation type is accepted. management_api is beta
# again: control_plane_live passed (D2322).
#
# Session 40 (Run 8, D2442) moved the eight to `trial` again, with branches,
# restore_to_branch and backups_and_pitr. Its close (Run 11) read the TAGGED
# evidence, evidence/session-40.json (263/267): lifecycle_reearned_live (D2500),
# branch_live (D2501, D2506) and branch_host_live (D2504, D2505) failed, so the
# six managed-project rows and the three branch rows are `planned` again, target
# Session 41, and only credential.rotate is accepted; endpoints_reearned_live
# passed, so pooled_endpoint, direct_endpoint and postgresql are `beta`.
#
# Session 41 (Run 9, D2552) moved fourteen rows to `trial`: the six managed-project rows
# a third time on a new slot, slot5-prod; branches, restore_to_branch and backups_and_pitr
# with D2501 and D2504 repaired; and Session 41's own idle_sleep, usage, plan_free,
# plan_premium and notifications. Its close (Run 12) read the TAGGED evidence,
# evidence/session-41.json (280/284, 1.19.0 on 601a0ea): branch_retrial_live,
# branch_host_retrial_live, usage_live, plans_live and the offline claims passed, so
# branches, restore_to_branch, backups_and_pitr, usage, plan_free and plan_premium are
# `beta`; lifecycle_third_trial_live and notifications_live failed (D2557), so the six
# managed-project rows and notifications are `planned` again, target Session 42; and
# idle_sleep, whose claims passed, is `planned` with sleep -- it acts through
# project.sleep, offered only while that type is accepted (D2548, D2560). Accepted:
# credential.rotate and the four branch types.
#
# Session 42 (Run 9) moved ten rows to `trial`: the six managed-project rows a
# fourth time on a new slot, slot6-prod, their probe samples written as they are
# taken (D2581, D2583); idle_sleep and notifications re-trialed with them; and
# Session 42's own query_insights and monitoring. Its close (Run 12) read the
# TAGGED evidence, evidence/session-42.json (301/302, 1.20.0 on 77303e4): every
# claim the ten name passed -- lifecycle_fourth_trial_live, idle_sleep_retrial_live,
# notifications_retrial_live, insights_live (its proof's role name corrected,
# D2645), pgss_live, telemetry_live and their offline claims -- so all ten are
# `beta`. No trial row remains. Accepted: all eleven executed types.

