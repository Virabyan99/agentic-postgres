  - id: projects_self_service
    concept: Create a project
    status: trial
    customer_text: >-
      Being verified. A member of an organization creates a project on a slot
      the operator prepared, and claims its first administrator with a one-time
      token only they hold. When no slot is ready, or the server has no room,
      the request is refused with "capacity exhausted" and nothing is created.
    today: >-
      POST /v1/projects (bin/project.sh create) records a project.create
      operation; the reconciler, a root unit on the host, executes it into a
      prepared slot through admission and the deploy, and bin/project.sh claim
      sets the first administrator's password through the project's own reset
      route. The operator still creates every other project by hand.
    today_evidence: null
    evidence:
      - control_project_operations
      - reconciler_dispatch
      - admin_handoff
      - capacity_refusals
      - lifecycle_operations_live
      - lifecycle_project_door_live
    stage5_reality: >-
      POST /v1/projects records a project.create operation (member and above,
      a person only), refused "capacity exhausted" with no slot ready before
      anything is recorded; the reconciler (Session 38) executes it into a
      prepared slot through the same admission and deploy, and the first
      administrator claims the account with a token only its requester holds
      (ADR 0256, ADR 0260).
    eventual: Placement across a fleet of servers.
    controls: [project.create, bin/project.sh create, bin/project.sh claim]
    since_session: 38
    target_session: 38

  - id: project_deletion
    concept: Delete a project
    status: trial
    customer_text: >-
      Being verified. An admin or owner deletes a project with its data. The
      project's name is never given to another project, and its backups are
      kept by the operator: nothing removes them automatically.
    today: >-
      DELETE /v1/projects/{key} (bin/project.sh delete --confirm KEY) records a
      project.delete operation; the reconciler retires the slot's project with
      its data, leaves the provider's resources for the operator to revoke
      (bin/slot.sh revoke), and marks the slot consumed. The operator retires
      every other project with bin/project-retire.sh.
    today_evidence: null
    evidence:
      - deletion
      - slots
      - registry_after_operations
      - lifecycle_operations_live
      - reconciler_live
    stage5_reality: >-
      DELETE /v1/projects/{key} records a project.delete operation (admin and
      above, a person only); the reconciler retires the project with its data,
      the slot is consumed and never reissued, and the backups are kept by the
      operator -- this beta has no automatic removal (D2158, D2181).
    eventual: The same, with a grace period and recovery.
    controls: [project.delete, bin/project.sh delete]
    since_session: 38
    target_session: 38

