  - id: projects_self_service
    concept: Create a project
    status: beta
    customer_text: >-
      A member of an organization creates a project on a slot the operator
      prepared, and claims its first administrator with a one-time token only
      they hold. On the Free plan an organization holds one project; a second is
      refused with "plan limit reached", and when no slot is ready the request
      is refused with "capacity exhausted" -- in both cases nothing is created.
    today: >-
      POST /v1/projects (bin/project.sh create) records a project.create
      operation once the organisation's plan admits it (ADR 0274: Free's
      projects_active, read under the organisation's lock before the slot); the
      reconciler, a root unit on the host, executes it into a prepared slot
      through admission and the deploy, and bin/project.sh claim sets the first
      administrator's password through the project's own reset route. The
      operator still creates every other project by hand. Built in Session 38
      and run end to end on 1.16.0; re-trialed in Session 39 on 1.17.0 (D2415)
      and in Session 40 on 1.18.0, where lifecycle_reearned_live did not pass
      (D2500: the instrument's pool probe died). Re-trialed a third time in
      Session 41 on 1.19.0 on a new slot, slot5-prod, in a new organisation,
      where every operation of its lifecycle ran at the tagged commit but
      lifecycle_third_trial_live did not pass: the first export's upload was
      refused by a mis-entered storage credential, the run resumed at the
      export, and the four windows its probes had read (sleep, wake, both
      resizes) were lost with the first attempt (D2557). Re-earned a fourth time
      in Session 42 on 1.20.0 on a new slot, slot6-prod, in a new organisation,
      its probe samples written as they are taken: lifecycle_fourth_trial_live
      passed on the tagged evidence (1.20.0 on 77303e4, D2581).
    today_evidence: null
    evidence:
      - lifecycle_fourth_trial_live
    stage5_reality: >-
      POST /v1/projects records a project.create operation (member and above,
