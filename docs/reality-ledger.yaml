  # -------------------------------------------------------------------------
  - id: branches
    concept: Branches
    status: beta
    customer_text: >-
      A member makes a branch of a project: a full copy restored from the
      project's own backups, with its own two passwords and its own two names.
      One branch per project on the Free plan. A branch is not backed up:
      deleting it, or losing the server, loses what it holds. An expiry, if you
      set one, deletes it then.
    today: >-
      POST /v1/projects/{key}/branches (bin/branch.sh create) records a
      branch.create operation; the reconciler restores the parent's repository
      into the branch's own volume through a recovery instance with archiving
      off, starts its postgres with no repository and no backup network, re-keys
      it -- every platform role NOLOGIN, the branch's own two customer
      verifiers, generated on the customer's machine -- and only then opens
      <branch>.pool.<domain> and <branch>.direct.<domain>, writing ready once
      both answer (ADR 0271, D2503). Its image is resolved from the recorded tag
      and content digest at every start, so it comes back after a reboot by
      itself (D2504). Reset restores it again; delete removes exactly what its
      names derive. An expired branch's deletion is requested by the reconciler
      on behalf of the member who set the expiry (ADR 0272). Built in Session
      40; repaired and re-trialed in Session 41 on slot3-prod
      (branch_retrial_live, branch_host_retrial_live).
    today_evidence: null
    evidence:
      - branch_retrial_live
      - branch_host_retrial_live
      - branch_start_repaired
      - branch_door_ready
    stage5_reality: >-
      branch.create restores the parent's repository at a target time into the
      branch's own names, re-keyed before its endpoint opens (D1961).
    eventual: Storage-native copy-on-write branches.
    controls:
      - branch.create
      - branch.reset
      - branch.delete
      - bin/branch.sh create
      - bin/branch.sh reset
      - bin/branch.sh delete
      - bin/branch.sh list
      - bin/branch.sh show
    since_session: 36
    target_session: 41

