[pytest]
addopts = -ra --strict-markers
testpaths = tests
# src layout without an editable install: the hash-locked requirements file is
# the only thing that shapes the environment, so nothing is installed from this
# working tree.
pythonpath = src
markers =
    p0: release-blocking acceptance requirement
    p1: important non-release-blocking requirement
    p2: optional capability
    contract: repository, manifest, schema, or output contract
    security: authorization or secret-boundary test
    integration: service or client integration test
    recovery: backup or restore test
    deployment: deployment and isolation test
    database: needs a PostgreSQL cluster, or the locked database images
    destructive: mutates or removes its target; only ever the disposable project
    live_host: runs only on a provisioned deployment host
    external: runs only from a network outside the deployment host
    future(session, requirement): placeholder owned by a later session
    requires_environment(*names): skipped when a named environment variable is absent
