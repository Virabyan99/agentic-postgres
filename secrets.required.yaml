# Secret requirements — the declared grant surface.
#
# This file is committed. It contains identifiers only: names, provider keys,
# paths, target filenames and numeric ownership. It contains no secret value
# and no hash of one, and it never will -- adding either would make the
# committed repository a place where a credential can be recovered.
#
# What it buys: a service receives exactly the files listed for it here, and
# nothing else. Adding a grant is a reviewable diff rather than a runtime
# accident, and tests/contract/test_secret_contract.py proves the Compose model
# and this file agree in both directions.
#
# The source path is derived from the project key by the materializer and
# cannot be supplied from project.yaml. That is deliberate: a project manifest
# that could name its own secret directory could name another project's.
#
# Later sessions append to this list. They do not create separate dotenv files.

schema_version: 1

secrets:
  # Session 2 materializes exactly one secret, and it exists to be proved
  # rather than used. The sentinel is a random 32+ byte value created by
  # bootstrap; the live suite reads it through a root-only helper and searches
  # for the exact byte sequence in images, logs, docker inspect output,
  # rendered Compose output, evidence and the repository. Its whole job is to
  # be findable if the secret path leaks, so that "no secret leaked" is a
  # measurement rather than an assertion.
  - name: session2_sentinel
    provider_key: APG_SESSION2_SENTINEL
    provider_path: /runtime
    introduced_in_session: 2
    required: true
    origin: generated
    value_kind: random_hex
    consumers:
      # 65532 is the conventional distroless "nonroot" uid/gid and is the user
      # the secret-check container runs as. The host sets this ownership on the
      # file before Compose mounts it; Compose's own uid/gid/mode fields are
      # not relied upon. test_secret_contract.py cross-checks this number
      # against the service's `user:` in compose.yaml, because the two living
      # in two files is exactly how a secret silently becomes root-owned and
      # unreadable to the process that needs it.
      - plane: compose
        service: secret-check
        target_file: session2_sentinel
        uid: 65532
        gid: 65532
        mode: "0400"
        format: raw
    redaction: full
    rotate_by_replacement: true
    # False: the sentinel proves materialization, so a bounded last-known-good
    # start is legitimate for it. A real credential in a later session sets
    # this true when a stale value would fail closed at the provider anyway.
    must_refresh_on_start: false
    one_time_initialization: false

  # Session 3, and the one secret in this file whose replacement does NOT
  # rotate anything.
  #
  # The PostgreSQL image entrypoint reads POSTGRES_PASSWORD_FILE only when the
  # data directory is empty. Once a cluster has initialised, writing a new
  # generation of this file changes the file and nothing else -- the superuser
  # password in the running cluster is whatever initdb set. That is what
  # `one_time_initialization: true` records, so that rotation tooling
  # refuses to report a rotation it did not perform. Rotating it for real is a
  # coordinated ALTER ROLE through the privileged local path, which is a
  # different operation with a different name.
  #
  # uid/gid 999 is the image's own postgres user, measured against the locked
  # digest -- not the 65532 every Session 2 consumer uses. The postgres service
  # runs as `user: "999:999"` so it reads this file directly rather than as
  # root before dropping privilege, and test_secret_contract.py cross-checks
  # the two numbers.
  - name: postgres_init_superuser_password
    provider_key: APG_POSTGRES_INIT_SUPERUSER_PASSWORD
    provider_path: /database
    introduced_in_session: 3
    required: true
    origin: generated
    value_kind: random_hex
    consumers:
      - plane: compose
        service: postgres
        target_file: postgres_init_superuser_password
        uid: 999
        gid: 999
        mode: "0400"
        format: raw
    redaction: full
    rotate_by_replacement: false
    must_refresh_on_start: false
    one_time_initialization: true

  # The migration plane's credential (ADR 0026). `migration_user` is the only
  # non-bootstrap role Session 3 creates with LOGIN and a live credential;
  # every other service identity is a NOLOGIN stub with a null verifier until
  # its owning session activates it.
  #
  # A password, not a URL. Run 7 measured what a URL secret costs: the value
  # would carry a role name, a host and a database name that `naming.py` also
  # derives, so an operator entering it is a second derivation path for three
  # identifiers -- and the failure when they drift is "password authentication
  # failed", which sends the reader to the wrong file. The URL is assembled from
  # this password and three interpolated identifiers inside the dbmate
  # container, so it never exists outside it (D60, ADR 0034).
  #
  # One consumer, and one copy. The bootstrap plane also needs this value -- it
  # is what sets the role's verifier -- but it is root on the host, not a
  # container, so it reads dbmate's materialized file directly rather than
  # taking a grant. Declaring a second consumer would materialize a second copy
  # of one credential, and two copies is two things a rotation has to reach.
  # Every declared consumer here is a Compose service whose `user:` this file's
  # uid/gid is cross-checked against, and the bootstrap plane is neither.
  #
  # must_refresh_on_start is true: a stale credential here fails to authenticate
  # rather than degrading quietly, so a bounded last-known-good start would only
  # delay the same error until it was harder to attribute.
  - name: migration_user_password
    provider_key: APG_MIGRATION_USER_PASSWORD
    provider_path: /database
    introduced_in_session: 3
    required: true
    origin: generated
    value_kind: random_hex
    consumers:
      - plane: compose
        service: dbmate
        target_file: migration_user_password
        uid: 65532
        gid: 65532
        mode: "0400"
        format: raw
      # Session 4 Run 7, and the sentence above about one copy is now two. The
      # Prisma fixture needs this for exactly one claim -- DBX-001, that Prisma
      # Migrate runs through the direct transport -- and proving it requires the
      # configuration an application actually ships: `url` at the pooler and
      # `directUrl` at the direct endpoint, from one schema.prisma. That
      # configuration holds both credentials, so a fixture given only this one
      # would be testing a deployment nobody runs.
      #
      # A second copy is a real cost and is written down as one: it is a second
      # file a rotation has to reach. It is accepted because the alternative is
      # worse -- mounting dbmate's copy into another service would break the
      # property this file's per-consumer layout exists for, that one service
      # cannot read another's copy.
      - plane: compose
        service: client-prisma
        target_file: migration_user_password
        uid: 65532
        gid: 65532
        mode: "0400"
        format: raw
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: true
    one_time_initialization: false

  # Session 4. The application runtime credential -- the one an ordinary
  # application actually holds (ADR 0041).
  #
  # uid/gid 70 is a THIRD number in this file, after the cluster's 999 and
  # Session 2's 65532, and it was measured against the locked pooler digest
  # rather than assumed. The pooler image differs from the cluster image in a
  # way that matters here: it sets a default user, so the process is 70 from PID
  # 1 onward and there is never a root window in which to fix a file's
  # ownership. A file materialized 999 or 65532 is simply unreadable, and the
  # pooler's response to an unreadable auth file is the reason this is worth
  # spelling out -- see the entrypoint comment in compose.yaml.
  #
  # One consumer. The bootstrap plane also needs this value, because it is what
  # sets the role's verifier in Run 5, but it is root on the host rather than a
  # container and reads the pooler's materialized file directly. Declaring it as
  # a second consumer would materialize a second copy of one credential, and two
  # copies is two things a rotation has to reach.
  #
  # must_refresh_on_start is true for the same reason as the migration
  # credential: a stale value fails to authenticate rather than degrading
  # quietly, so a bounded last-known-good start would only delay the same error
  # until it was harder to attribute.
  - name: app_runtime_password
    provider_key: APG_APP_RUNTIME_PASSWORD
    provider_path: /database
    introduced_in_session: 4
    required: true
    origin: generated
    value_kind: random_hex
    consumers:
      - plane: compose
        service: pgbouncer
        target_file: app_runtime_password
        uid: 70
        gid: 70
        mode: "0400"
        format: raw
      # Session 4 Run 7. The four client compatibility fixtures, which are what
      # DBX-001..005 are proved by. They hold the application's credential
      # because they ARE the application, as far as the boundary is concerned:
      # a fixture handed a privileged credential, or a shared mount, would be
      # proving something about a deployment that does not exist.
      #
      # Four more copies of one credential is four more files a rotation has to
      # reach, and that cost is real. It is accepted for the same reason the
      # sentence above rejects a second copy for the bootstrap plane and this
      # one accepts four: the bootstrap plane is root on the host and can read
      # the pooler's file directly, and a container cannot. Making them share
      # one mount would dissolve the property this layout exists for.
      #
      # `client-psql` builds FROM the pooler image, because that is where a
      # measured psql 17.5 already lives -- but it runs as 65532 like every other
      # built service here, not as that image's own 70. The number is declared,
      # not inherited: `user:` in compose.yaml, `USER` in the Dockerfile and this
      # entry are cross-checked by tests/contract/test_secret_contract.py, and a
      # uid taken from whatever a base image happens to default to is a value
      # that changes when the base image does.
      - plane: compose
        service: client-psql
        target_file: app_runtime_password
        uid: 65532
        gid: 65532
        mode: "0400"
        format: raw
      - plane: compose
        service: client-node-pg
        target_file: app_runtime_password
        uid: 65532
        gid: 65532
        mode: "0400"
        format: raw
      - plane: compose
        service: client-psycopg
        target_file: app_runtime_password
        uid: 65532
        gid: 65532
        mode: "0400"
        format: raw
      - plane: compose
        service: client-prisma
        target_file: app_runtime_password
        uid: 65532
        gid: 65532
        mode: "0400"
        format: raw
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: true
    one_time_initialization: false

  # Session 4. The pooler's own admin identity, which is NOT a database role.
  #
  # PgBouncer's admin console is a virtual database served by the pooler itself.
  # `SHOW POOLS`, `SHOW CONFIG` and `RECONNECT` are answered by the daemon, not
  # forwarded, so this credential authenticates to a process rather than to the
  # cluster. It is separate from app_runtime_password because a credential that
  # can read every pool's statistics is not the credential an application holds,
  # and because a health check that proves the pool mode has to log in as
  # somebody -- doing that as the application would mean the application's
  # password appeared in a health command.
  - name: pgbouncer_admin_password
    provider_key: APG_PGBOUNCER_ADMIN_PASSWORD
    provider_path: /database
    introduced_in_session: 4
    required: true
    origin: generated
    value_kind: random_hex
    consumers:
      - plane: compose
        service: pgbouncer
        target_file: pgbouncer_admin_password
        uid: 70
        gid: 70
        mode: "0400"
        format: raw
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: true
    one_time_initialization: false

  # Session 5 Run 4. PostgREST's authenticator role -- the one identity it
  # holds, and the one it switches away from on every authenticated request.
  # It arrives in the same commit as its consumer, because
  # `test_every_consumer_names_a_real_compose_service` requires a compose-plane
  # consumer to name a service that exists: a grant to a service that does not
  # is a grant nobody can audit.
  #
  # uid/gid 65532 is DECLARED, not inherited. The PostgREST image is distroless
  # and declares no ENTRYPOINT and no USER (measured in Run 1, recorded in
  # tests/contract/test_image_contracts.py), so "whatever the base image
  # defaults to" is not even a well-defined answer here. compose.yaml sets
  # `user:` to this number and test_secret_contract.py cross-checks the two.
  #
  # `format: pgpass` is the one entry in this file that is not `raw`, and ADR
  # 0056 is why. Every other service assembles what it needs from the raw value
  # in a shell; this image has no shell, so the file has to arrive in the shape
  # libpq reads. The wildcards are deliberate -- naming the host, port, database
  # and role would put four derived identifiers into a materialized secret, and
  # the symptom when one of them drifted would be `fe_sendauth: no password
  # supplied`, which sends the reader to the wrong file.
  #
  # The value is a password and nothing else, as it is for every other database
  # credential here (D60): the conninfo lives in `PGRST_DB_URI`, assembled by
  # Compose interpolation from derived identifiers, and carries `?passfile=`
  # rather than a password. Measured: the password appears in no environment
  # variable, no argument, no label, no log line and nothing `docker inspect`
  # prints.
  - name: postgrest_authenticator_password
    provider_key: APG_POSTGREST_AUTHENTICATOR_PASSWORD
    provider_path: /database
    introduced_in_session: 5
    required: true
    origin: generated
    value_kind: random_hex
    consumers:
      - plane: compose
        service: postgrest
        target_file: postgrest_authenticator_pgpass
        uid: 65532
        gid: 65532
        mode: "0400"
        format: pgpass
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: true
    one_time_initialization: false

  # Session 5, and the first secret on the root plane (ADR 0054).
  #
  # The bootstrap issuer's private signing key. ADR 0051: exactly one active RSA
  # private key per project, held only by root-controlled tooling, mounted into
  # no service, printed by no command, passed as no argument. PostgREST receives
  # a verification-only JWKS DERIVED from this key, never the key -- so there is
  # one stored value and one derivation, rather than a public copy that can
  # drift from the private one it claims to describe.
  #
  # `plane: root` is what makes "no container holds this" a property of the
  # materialization rather than a rule somebody keeps: there is no service to
  # name, so there is no grant to render, so there is no mount to forget to
  # remove. It lands in `_root/` at 0400 owned 0:0.
  #
  # value_kind: rsa_private_pem, because the generator would otherwise write 32
  # bytes of hex here and everything downstream would pass until a JWKS was
  # derived from it (ADR 0055).
  #
  # must_refresh_on_start is false, and deliberately: a stale signing key is
  # still a valid signing key, and the verification set is what decides whether
  # its tokens are accepted. Failing a start on it would refuse to run over a
  # provider outage for a value that had not changed.
  - name: bootstrap_jwt_signing_key
    provider_key: APG_BOOTSTRAP_JWT_SIGNING_KEY
    provider_path: /auth
    introduced_in_session: 5
    required: true
    origin: generated
    value_kind: rsa_private_pem
    consumers:
      - plane: root
        target_file: bootstrap_jwt_signing_key.pem
        uid: 0
        gid: 0
        mode: "0400"
        format: raw
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: false
    one_time_initialization: false

  # Session 5. The documentation page's temporary Basic Auth credential, and the
  # secret D140 found had nowhere legal to live.
  #
  # The consumer that needs it is Traefik, which is not a project Compose
  # service -- it is the shared edge stack in infra/edge/compose.yaml -- and the
  # documentation container must never receive it, which is the entire point of
  # stripping the Authorization header before the request reaches it. So there
  # was no service to name, and naming the documentation service would have
  # materialized the cleartext into the one container the design keeps it away
  # from.
  #
  # Root plane: the deploy reads this file and writes a HASH into the edge's
  # dynamic configuration directory. The cleartext reaches the edge as a hash
  # and reaches the documentation container not at all.
  #
  # Temporary until Session 6 replaces it with real authentication, and the
  # deployed document's jwt.temporary is what records that this whole
  # arrangement is provisional (ADR 0051).
  - name: docs_basic_auth_password
    provider_key: APG_DOCS_BASIC_AUTH_PASSWORD
    provider_path: /runtime
    introduced_in_session: 5
    required: true
    origin: generated
    value_kind: random_hex
    consumers:
      - plane: root
        target_file: docs_basic_auth_password
        uid: 0
        gid: 0
        mode: "0400"
        format: raw
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: true
    one_time_initialization: false

  # ---------------------------------------------------------------------------
  # Session 6. Declared in Run 7, in the same commit as the `auth` service that
  # consumes them (D246) -- the contract test refuses a compose-plane grant to a
  # service that does not exist, and a grant nobody can audit is the shape this
  # session has already produced three times over (D235, D243, D204).
  #
  # The runbook (D227) asked for FOUR. Two of them are here. The other two were
  # written, measured against what the repository already does, and refused:
  #
  #   jwt_public_jwks -- a stored copy of PUBLIC material that ADR 0051 already
  #   DERIVES. bin/render-jwks.py builds the verification set from the private
  #   key at deploy time, on purpose: "one value, one derivation, and nothing
  #   that can drift from the key it claims to describe". Storing it beside the
  #   key would be a second authority for the same fact, and this contract would
  #   materialize it at 0400 -- a confidentiality the content does not have, and
  #   which render-jwks.py deliberately refuses to imply. (D258)
  #
  #   value_kind: rsa_private_jwk -- a JWK carries its own `kid`, and the `kid`
  #   this project uses is an RFC 7638 thumbprint DERIVED from the key by
  #   jwt_keys.py. Storing a JWK would store a kid that can disagree with the
  #   key it labels. A PEM cannot: it has no kid to be wrong. So the signing
  #   secrets below are `rsa_private_pem`, the same kind and the same generator
  #   as bootstrap_jwt_signing_key -- and the value_kind enum does not widen at
  #   all this session. (D257)
  #
  # Both refusals are ADR 0051 and ADR 0055 applied rather than new decisions.
  # D246 moved the widening here so it would arrive with its consumer; arriving
  # with its consumer is what showed it was not needed.

  # The auth service's own database credential. Compose plane, pgpass format,
  # for exactly the reasons postgrest_authenticator_password gives: the value is
  # a password and nothing else (D60), the conninfo is assembled from derived
  # identifiers inside the container, and libpq reads the file through
  # PGPASSFILE so the credential never becomes an environment variable, an
  # argument or a label.
  #
  # uid/gid 65532 matches the `user:` on the auth service, which
  # test_consumer_ownership_matches_the_service_runtime_user checks: the host
  # sets ownership before Compose mounts the file (ADR 0010), so a mismatch
  # here is a container that cannot read its own credential and an operator who
  # fixes it by widening 0400.
  #
  # must_refresh_on_start is true. Unlike a signing key, a stale database
  # password is not still valid: the bootstrap plane sets the role's verifier
  # from the newest generation, so a container starting from an older one
  # cannot connect at all. That is D253, measured on the host in Run 1's
  # window, and failing closed is what makes it a start failure rather than a
  # crash loop behind a 502.
  - name: auth_service_password
    provider_key: APG_AUTH_SERVICE_PASSWORD
    provider_path: /database
    introduced_in_session: 6
    required: true
    origin: generated
    value_kind: random_hex
    consumers:
      - plane: compose
        service: auth
        target_file: auth_service_pgpass
        uid: 65532
        gid: 65532
        mode: "0400"
        format: pgpass
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: true
    one_time_initialization: false

  # The auth service's ACTIVE signing key -- the one it issues tokens with.
  #
  # This is the first private key in this file with a compose-plane consumer,
  # and that is a deliberate departure from bootstrap_jwt_signing_key rather
  # than an inconsistency. ADR 0051 put the bootstrap issuer's key on the root
  # plane because the issuer was a root-owned command; the auth service IS the
  # issuer now, and a service that cannot reach its signing key cannot sign.
  # What does not change is the direction: exactly one service holds it, no
  # verifier ever does, and the JWKS every verifier reads is derived from it.
  #
  # must_refresh_on_start is false, for bootstrap_jwt_signing_key's reason: a
  # stale signing key is still a valid signing key, and the verification set is
  # what decides whether its tokens are accepted. Failing a start on it would
  # refuse to run over a provider outage for a value that had not changed.
  - name: auth_jwt_signing_key
    provider_key: APG_AUTH_JWT_SIGNING_KEY
    provider_path: /auth
    introduced_in_session: 6
    required: true
    origin: generated
    value_kind: rsa_private_pem
    consumers:
      - plane: compose
        service: auth
        target_file: auth_jwt_signing_key.pem
        uid: 65532
        gid: 65532
        mode: "0400"
        format: raw
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: false
    one_time_initialization: false

  # The PREPARED signing key: the next one, before it is promoted.
  #
  # Root plane, with no service named, and that is the whole safety property of
  # Run 10's cutover rather than a filing decision. Between prepare and promote
  # the new key's PUBLIC half is published so every verifier can acknowledge it,
  # while the private half must reach no running process -- because a key that a
  # signer could reach is a key it could sign with before the verifiers have
  # agreed to accept it, which is precisely the gap the acknowledgement step
  # exists to close.
  #
  # `plane: root` makes that a filesystem fact rather than a rule somebody
  # keeps: there is no service to name, so there is no grant to render, so there
  # is no mount to forget to remove. Promotion moves the value into
  # auth_jwt_signing_key; it does not move a mount.
  - name: auth_jwt_prepared_key
    provider_key: APG_AUTH_JWT_PREPARED_KEY
    provider_path: /auth
    introduced_in_session: 6
    required: false
    origin: generated
    value_kind: rsa_private_pem
    consumers:
      - plane: root
        target_file: auth_jwt_prepared_key.pem
        uid: 0
        gid: 0
        mode: "0400"
        format: raw
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: false
    one_time_initialization: false

  # ---------------------------------------------------------------------------
  # Session 7. Declared in Run 2, in the same commit as the `storage` service
  # that consumes them -- D246's rule, and the contract test that enforces it
  # refuses a compose-plane grant to a service `compose.yaml` does not have.
  #
  # That is why the service entry arrives with this run rather than with its
  # route: `postgres-bootstrap.py` recovers the storage role's password from the
  # consumer below when it activates `storage_service`, so the consumer has to
  # exist several runs before anything is published. Measured before it was
  # written -- a probe adding this service and these three secrets left the
  # whole offline suite green but for one test, which exists to be answered:
  # the names below are in `managed_resources` because that list is the licence
  # to destroy them.
  #
  # Two of the three carry `origin: operator_supplied`, which is new in this run
  # and is ADR 0103. The field exists because `value_kind` was being asked two
  # questions at once and could only answer one of them.

  # The storage runtime's database credential. Compose plane, pgpass format, for
  # exactly the reasons auth_service_password gives: the value is a password and
  # nothing else (D60), the conninfo is assembled from derived identifiers
  # inside the container, and libpq reads the file through PGPASSFILE so the
  # credential never becomes an environment variable, an argument or a label.
  #
  # `origin: generated` -- this one the bootstrap creates, like every credential
  # before it. It is declared here rather than in a later run because the
  # bootstrap plane reads it back through this consumer to activate the role,
  # and a consumer that disagreed with the contract would look for a file that
  # is not there, report the credential absent, and leave `storage_service`
  # NOLOGIN with no error at all.
  - name: storage_service_password
    provider_key: APG_STORAGE_SERVICE_PASSWORD
    provider_path: /database
    introduced_in_session: 7
    required: true
    origin: generated
    value_kind: random_hex
    consumers:
      - plane: compose
        service: storage
        target_file: storage_service_pgpass
        uid: 65532
        gid: 65532
        mode: "0400"
        format: pgpass
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: true
    one_time_initialization: false

  # The R2 credential, and the first pair in this file the bootstrap must not
  # create (ADR 0103).
  #
  # Cloudflare issues these as one act: the Access Key ID is the API token's
  # `id`, and the Secret Access Key is the SHA-256 of the token's value, shown
  # exactly once and never retrievable afterwards. So `origin: operator_supplied`
  # is not a scheduling note -- it is why `--apply` has to stop here rather than
  # converge, and why `--plan` names both and says where they come from.
  #
  # `value_kind: random_hex` is TRUE, and that is the trap. A Secret Access Key
  # is a 64-character hex string, byte-indistinguishable from what
  # `secrets.token_hex(32)` produces -- so a generator that ran here would write
  # a perfectly-shaped credential Cloudflare has never issued, every check in
  # this repository would pass, and the failure would surface as a signature
  # rejection from a bucket several runs away from its cause. That is ADR 0055's
  # own paragraph about the signing key, arriving for a different field, and it
  # is why `origin` is a second field rather than a widened `value_kind`.
  #
  # must_refresh_on_start is true. A revoked or rotated R2 token fails closed at
  # the provider, so a bounded last-known-good start would only delay the same
  # error until it was harder to attribute -- auth_service_password's reasoning,
  # applied to a third party's credential.
  - name: r2_access_key_id
    provider_key: APG_R2_ACCESS_KEY_ID
    provider_path: /storage
    introduced_in_session: 7
    required: true
    origin: operator_supplied
    value_kind: random_hex
    consumers:
      - plane: compose
        service: storage
        target_file: r2_access_key_id
        uid: 65532
        gid: 65532
        mode: "0400"
        format: raw
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: true
    one_time_initialization: false

  # The other half, and the half Cloudflare shows once.
  #
  # Two declarations rather than one, though the pair is issued together and is
  # useless apart: this contract materializes one value per file, and a consumer
  # that had to split a compound value would be a second parser of a format
  # nothing here writes. Per-consumer files are also what make "the auth service
  # cannot read the R2 credential" a filesystem property rather than a rule
  # somebody keeps -- `auth` is granted neither of these, and `storage` is
  # granted no signing key.
  - name: r2_secret_access_key
    provider_key: APG_R2_SECRET_ACCESS_KEY
    provider_path: /storage
    introduced_in_session: 7
    required: true
    origin: operator_supplied
    value_kind: random_hex
    consumers:
      - plane: compose
        service: storage
        target_file: r2_secret_access_key
        uid: 65532
        gid: 65532
        mode: "0400"
        format: raw
    redaction: full
    rotate_by_replacement: true
    must_refresh_on_start: true
    one_time_initialization: false
