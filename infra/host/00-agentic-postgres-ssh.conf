# Managed by bin/provision-host.sh. Installed at
# /etc/ssh/sshd_config.d/00-agentic-postgres.conf.
#
# The 00- prefix is the whole point and is not cosmetic. OpenSSH takes the
# FIRST obtained value for most keywords and processes Include'd files in
# lexicographic order, so a file named 60-... cannot reliably override an
# earlier cloud-init snippet -- it loses to whatever was read first. Sorting
# ahead of everything is the only way to be the first obtained value.
#
# provision-host.sh still inspects every other sshd_config snippet before
# writing this, because a `Match` block earlier in the file set can reintroduce
# what this turns off, and being first does not protect against that.
#
# Substituted by provision-host.sh:
#   __SSH_PORT__   from host.yaml ssh.port
#
# Deliberately absent:
#
#   Ciphers / MACs / KexAlgorithms -- the supported Ubuntu OpenSSH defaults are
#   maintained by people who track cryptographic weakening; a hand-pinned list
#   in this file would be frozen at the day it was written.
#
#   AllowUsers -- added only when the complete set of legitimate host operators
#   is known. Getting it wrong removes provider recovery users, and the way you
#   discover that is by needing one.

Port __SSH_PORT__

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no

X11Forwarding no
AllowAgentForwarding no

# `local` rather than `no`: Session 4 tunnels the direct PostgreSQL endpoint
# over SSH local forwarding, and that endpoint is deliberately never published.
# Remote forwarding stays off -- it would let a client open a listener on this
# host, which is the opposite of what the firewall policy is for.
AllowTcpForwarding local
GatewayPorts no

MaxAuthTries 3
LoginGraceTime 30
