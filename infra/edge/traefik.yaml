# Traefik static configuration template (runbook Phase 10).
#
# This is the STAGING form, and staging is not a default anyone can drift away
# from: `host.schema.json` pins `edge.initial_acme_environment` to the constant
# "staging". `bin/edge.sh` renders this template into the root-owned
# /var/lib/agentic-postgres/edge/traefik.yaml, substituting the ACME email and
# resolver name from host.yaml. Promotion to production rewrites `caServer` and
# `storage` from root-owned edge state -- it is never reached by editing source.
#
# Two placeholders are substituted by edge.sh and by nothing else:
#   __ACME_EMAIL__          from host.yaml edge.acme_email
#   __ACME_RESOLVER_NAME__  from host.yaml edge.acme_resolver_name
#
# Entry point ports are the container-side ones. Traefik runs unprivileged with
# every capability dropped, so it binds 8080/8443 and Docker maps 80/443.

api:
  # No dashboard and no insecure API in Session 2. There is no dashboard router
  # either, so there is nothing to reach even from inside the edge network.
  dashboard: false
  insecure: false

ping:
  # A dedicated entry point, not published to the host. `traefik healthcheck`
  # talks to it from inside the container, which is why the health check works
  # with a read-only root filesystem and no shell utilities.
  entryPoint: ping

entryPoints:
  ping:
    address: ":8082"
  web:
    address: ":8080"
    http:
      redirections:
        entryPoint:
          # `:443`, not `websecure`. `to` takes an entry point name or a port,
          # and naming the entry point makes Traefik redirect to that entry
          # point's own address -- :8443. The container ports are unprivileged
          # on purpose so no capability is needed to bind them, and Docker
          # publishes them as 80 and 443; a visitor sent to :8443 reaches
          # nothing.
          #
          # Naming the public port emits https://host/path with no port at all,
          # since 443 is the scheme's default.
          #
          # There is no `port` field in a redirection. Adding one is rejected
          # and Traefik refuses to start, which is how the first attempt at this
          # fix took the edge plane down -- the mistake ADR 0019 records, made
          # again while fixing something else. Verified against the image this
          # time, by following the redirect it actually emits.
          to: ":443"
          scheme: https
          permanent: true
  websecure:
    address: ":8443"
    transport:
      respondingTimeouts:
        readTimeout: 30s
        writeTimeout: 30s
        idleTimeout: 60s

providers:
  docker:
    # The socket proxy, over the internal control network. Never a socket mount.
    endpoint: tcp://docker-socket-proxy:2375
    # Nothing is routed unless it asks to be...
    exposedByDefault: false
    watch: true
    # ...and asking is not enough: the container must also carry the project
    # management label. Two independent conditions, so a stray `traefik.enable`
    # on some unrelated container on this host still routes nothing.
    constraints: "Label(`apg.traefik.scope`,`managed`)"
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  __ACME_RESOLVER_NAME__:
    acme:
      email: __ACME_EMAIL__
      # Staging state, kept in a separate file from production. Separate files
      # are what make promotion reversible and what stop an iteration loop from
      # touching production issuance at all.
      storage: /var/lib/traefik/acme/staging.json
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      # Drop by default, keep two by name. Authorization, Cookie and every
      # other credential-bearing header are dropped because they are not named
      # here, rather than because they appear on a denylist someone has to
      # keep complete.
      defaultMode: drop
      names:
        X-Request-ID: keep
        User-Agent: keep
    names:
      # A query string is the easiest place for a token to end up in a log, and
      # Traefik cannot drop one. `accessLog.fields.queryParameters` was
      # specified here and does not exist: the locked v3.5 rejects it with
      # "field not found, node: queryParameters" and refuses to start. Only
      # defaultMode, headers and names are real (ADR 0019).
      #
      # RequestPath carries the query string, so dropping that field is the only
      # way to keep query strings out of the log. It costs the path, which is a
      # genuine loss -- but RouterName and ServiceName remain, so which route
      # matched is still answerable, and "no secret reaches a log" is the
      # stronger of the two claims.
      #
      # Verified rather than assumed: a request carrying a random sentinel in
      # its query string produces a log line with no RequestPath and no sentinel
      # anywhere in it.
      RequestPath: drop
