# Validation-only Compose model (runbook §7).
#
# Session 1 starts nothing. This file exists so that the resource names in
# outputs.json can be proven to match what Docker would actually create, and so
# that later sessions extend a model that already interpolates from the lock
# rather than from whatever happens to be in the operator's environment.
#
# Every value is `${VAR:?required}`. That is deliberate: an unset variable
# fails `docker compose config` loudly instead of silently rendering an empty
# name, which would collapse two projects onto one resource.
#
# Resource names are set explicitly rather than left to Compose's
# `{project}_{name}` convention, so the names here are byte-identical to the
# ones in outputs.json.
#
# Do not use `container_name`: it is not project-scoped and would collide
# across two deployments on the same host.
#
# Invoke only through bin/compose.sh. Calling `docker compose` directly lets
# inherited environment variables win over --env-file, which is the exact
# override this repository is built to prevent.

name: ${COMPOSE_PROJECT_NAME:?required}

services:
  # Profile-gated so it is never part of the default set. It exists to give the
  # model a service to validate; the Session 1 gate renders the model and never
  # starts this container.
  contract-probe:
    image: ${PYTHON_RUNTIME_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [contract]
    command: ["python", "--version"]
    restart: "no"
    # The probe attaches to both networks and mounts the volume purely so that
    # all four resource names appear in `docker compose config` output.
    # Compose prunes top-level networks and volumes that no service
    # references, so a probe attached only to `internal` would leave the edge
    # network and the volume unrenderable -- and runbook §12's "Compose has
    # explicit actual resource names matching outputs" would be unverifiable.
    # This container is never started; see bin/compose.sh.
    networks:
      - edge
      - internal
    # Mounted where `postgres` mounts it, not at the pre-18 `/data` path. The
    # probe never starts, so nothing here breaks either way -- but this is the
    # only other mount target in the repository, and a wrong example is how the
    # wrong path gets copied into the service that does start. See D53.
    volumes:
      - postgres-data:/var/lib/postgresql

  # Session 2's public HTTPS target. Deliberately trivial: it exists so that
  # "Traefik routes this project, with a trusted certificate, and returns this
  # project's identity" is a measurable claim before any application service.
  #
  # It carries the identity labels and the network hint, but NOT
  # `traefik.enable`, and NOT the router or service labels. Two reasons:
  #
  #   1. The router labels' *keys* contain the router name
  #      (traefik.http.routers.<name>.rule). Interpolation inside a label key is
  #      not portable to the Compose version floor, so the renderer emits fully
  #      formed keys into the root-owned runtime override instead (ADR 0013).
  #   2. Without `traefik.enable`, this model on its own is inert to Traefik.
  #      Exposure becomes a deliberate act of deployment rather than a property
  #      of a file in the repository.
  edge-probe:
    build:
      context: ./services/edge-probe
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [session2]
    restart: "on-failure:5"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    environment:
      PROJECT_KEY: ${PROJECT_KEY:?required}
    # No `ports`. Only Traefik publishes a host port, and the acceptance suite
    # asserts that against the resolved model, not against this comment.
    networks:
      - edge
    labels:
      apg.traefik.scope: managed
      apg.project.key: ${PROJECT_KEY:?required}
      apg.environment: ${PROJECT_ENVIRONMENT:?required}
      traefik.docker.network: ${EDGE_NETWORK_NAME:?required}

  # The control for DEP-EDGE-002. Same network, same project, no labels at all.
  # If the public route can reach this, discovery is not actually constrained
  # and `exposedByDefault=false` is not doing what it claims.
  unlabeled-probe:
    build:
      context: ./services/edge-probe
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [isolation-test]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    environment:
      PROJECT_KEY: ${PROJECT_KEY:?required}
    networks:
      - edge

  # One-shot proof that secret materialization reached this container, and only
  # this container. The `secrets:` grant and the top-level secrets block are NOT
  # here: the source path is an immutable generation directory whose identifier
  # does not exist until materialization runs, so the runtime override supplies
  # them. What lives here is the `user:` the secret files must be owned by, so
  # that secrets.required.yaml and the service contract can be cross-checked
  # from source (tests/contract/test_secret_contract.py).
  secret-check:
    build:
      context: ./services/secret-check
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [session2-verify]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    networks:
      - internal

  # Session 3's cluster. Everything here that looks like hardening is a
  # requirement with a test behind it, not a precaution:
  #
  #   * `internal` only, no `ports`, no Traefik label of any kind -- DBX-PG-002.
  #     The internal network is `internal: true`, so this has no route off the
  #     host at all; SEC-NET-001's external scan of 5432 measures a firewall
  #     from Session 3 on rather than measuring an absence.
  #   * the volume mounts at `/var/lib/postgresql`, which is what the image
  #     declares as its VOLUME -- NOT at PGDATA (`/var/lib/postgresql/18/docker`)
  #     and not at the pre-18 `/var/lib/postgresql/data`. All three were
  #     measured: the pre-18 path makes the image refuse to start, and mounting
  #     at PGDATA works while silently leaving an anonymous volume on the
  #     parent. Two of the three persist data, so "the row survived" is not the
  #     property that distinguishes them. See D53.
  #   * `user: "999:999"` is the image's own postgres uid/gid, measured rather
  #     than assumed -- it is not the 65532 the Session 2 services use. Running
  #     as that user directly rather than letting the entrypoint gosu down from
  #     root also leaves PGDATA owned `999:999` instead of `999:0`.
  #     secrets.required.yaml must name the same numbers, and
  #     tests/contract/test_secret_contract.py cross-checks the two.
  #   * `shm_size` exceeds `shared_buffers`. PostgreSQL's dynamic shared memory
  #     for parallel query lands in /dev/shm, and Docker's default is 64 MiB.
  #   * `mem_limit` is deliberately larger than the manifest's unreclaimable
  #     budget. A container limit caps page cache too; set at the budget, the
  #     cluster runs in permanent reclaim and never says why it is slow.
  #
  # No `container_name`. The model's standing rule holds and the name Compose
  # derives is recorded in outputs.json instead; Run 8 compares that against the
  # container actually running.
  postgres:
    image: ${POSTGRES_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [session3]
    restart: "on-failure:5"
    user: "999:999"
    stop_grace_period: 1m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:?required}
    shm_size: ${POSTGRES_SHM_SIZE:?required}
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME:?required}
      POSTGRES_USER: postgres
      # The value never appears here, in compose.env, or in any process
      # argument. The entrypoint's own file_env reads the path.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_init_superuser_password
      # Locale and checksums are initdb-time and cannot be changed afterwards
      # without a dump and reload, which is why they are pinned at the model
      # rather than left to whatever the image defaults to this year.
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:?required}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:?required}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:?required}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:?required}
      # Listening on every interface inside a network with no route off the
      # host. The boundary is the network and the absence of a published port,
      # not a bind address -- binding to localhost would also make the cluster
      # unreachable from its own project's services.
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DATABASE_NAME:?required} -q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal
    volumes:
      - postgres-data:/var/lib/postgresql

  # The migration plane (ADR 0026). A separate service from `postgres` because
  # it is a separate authority: dbmate connects as `migration_user`, which holds
  # LOGIN and NOINHERIT and none of SUPERUSER, CREATEDB, CREATEROLE, REPLICATION
  # or BYPASSRLS, and reaches owner authority only by an explicit membership it
  # must SET into.
  #
  # The flag positions below are measured, not guessed. In dbmate 2.34.1
  # `--migrations-dir`, `--migrations-table`, `--no-dump-schema` and `--env-file`
  # are GLOBAL and must precede the subcommand, while `--strict` is
  # subcommand-only and exists on `up` and `migrate` but not on `status`. A flag
  # in the wrong position exits 2 with "flag provided but not defined"; a global
  # flag silently omitted writes the ledger somewhere else entirely.
  #
  # No connection string here, and none anywhere a process can be listed. The
  # URL is assembled inside the container, by the entrypoint below, from three
  # derived identifiers Compose interpolates and one password read out of a
  # mounted file. Nothing that carries the password appears in compose.env, in
  # the resolved model, in `docker inspect`, or in argv on either side of the
  # daemon -- which is what `--env NAME` was always for, and what nothing was
  # supplying until Session 3's Run 7 (D60).
  #
  # The URL is assembled rather than stored whole. A stored URL embeds a role
  # name, a host and a database name that `naming.py` also derives; when the two
  # drift, the cluster answers "password authentication failed", which is the
  # one error nobody debugs by re-reading a manifest.
  #
  # `exec` matters: without it dbmate runs as a child of the shell and the
  # container's exit status is the shell's. `"$@"` carries the subcommand
  # bin/migrate.sh appends, so this list is the whole of what can be run here.
  dbmate:
    image: ${DBMATE_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [migration]
    restart: "no"
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Identifiers, all three. `sslmode=disable` is honest rather than lax: this
    # connection crosses a Docker network declared `internal: true`, which has
    # no route off the host, and the cluster serves no TLS certificate for any
    # peer to verify. A `require` that cannot be satisfied would either fail or
    # be silently downgraded, and neither is better than saying what this is.
    environment:
      APG_MIGRATION_ROLE: ${MIGRATION_ROLE_NAME:?required}
      APG_DATABASE_NAME: ${POSTGRES_DATABASE_NAME:?required}
      APG_MIGRATIONS_TABLE: ${MIGRATIONS_TABLE:?required}
    # Unbraced shell references throughout, and not for style. The braced
    # escaped form is a literal Compose never interpolates, but it is
    # indistinguishable from a real required interpolation to anything reading
    # this file with a regex -- including test_every_interpolation_is_required,
    # which exists to catch a bare one that would render empty. A form that
    # cannot be confused for the thing being forbidden is worth the braces.
    # Every byte of the password percent-encoded, not just the ones that look
    # dangerous. Measured: a base64 credential containing `/` parsed as a path
    # separator and dbmate reported `invalid port` -- a message that names
    # neither the password nor the file it came from. Encoding the whole value
    # is total: it cannot be wrong for an input nobody thought of, and the
    # provider chooses this value, not this repository.
    #
    # `$(cat ...)` strips trailing newlines and nothing else, which is exactly
    # what bin/postgres-bootstrap.py's `.rstrip("\n")` does to the same file.
    # The two readings must agree byte for byte or the role is set to one value
    # and dbmate presents another.
    entrypoint:
      - /bin/sh
      - -c
      - >
        set -eu;
        raw="$$(cat /run/secrets/migration_user_password)";
        password="$$(printf %s "$$raw" | od -An -tx1 -v | tr -d ' \n' | sed 's/../%&/g')";
        APG_MIGRATION_DATABASE_URL="postgres://$$APG_MIGRATION_ROLE:$$password@postgres:5432/$$APG_DATABASE_NAME?sslmode=disable"
        exec /usr/local/bin/dbmate
        --env APG_MIGRATION_DATABASE_URL
        --migrations-dir /migrations
        --migrations-table "$$APG_MIGRATIONS_TABLE"
        --no-dump-schema
        "$$@"
      - dbmate
    command: [status]
    networks:
      - internal

  # Session 4's transaction pooler. Everything below that looks like hardening
  # is a requirement with a test behind it.
  #
  # `user: "70:70"` is the pooler image's own uid/gid, measured against the
  # locked digest in Run 1 -- a third number after the cluster's 999 and Session
  # 2's 65532. Unlike the cluster image this one sets a default user, so the
  # process never runs as root and there is no window in which it could fix up a
  # file's ownership. secrets.required.yaml names the same two numbers and
  # tests/contract/test_secret_contract.py cross-checks them.
  #
  # No `ports` here. Session 4 publishes a host-loopback port, but a publication
  # is written only into the root-owned runtime override, never into this file:
  # a repository that could publish a database port would be one clone away from
  # publishing one (ADR 0040).
  #
  # `/etc/pgbouncer` is a tmpfs, and that is load-bearing rather than tidy. The
  # user list contains a plaintext credential, and this is the mount that keeps
  # it off every persistent path -- the image ships a world-readable
  # `userlist.txt` in that directory, so without the tmpfs the entrypoint would
  # be writing a secret into an image layer's directory on the container
  # filesystem.
  #
  # WHAT WAS MEASURED, because two plausible answers here are wrong:
  #
  #   * A plaintext user list under `auth_type = scram-sha-256` authenticates
  #     the client AND lets the pooler log in upstream: the cluster records
  #     `method=scram-sha-256` for the pooler's own connection. Storing the
  #     server's SCRAM verifier instead also works, and is unavailable to us --
  #     it can only be read from the cluster, which means the role must already
  #     exist, and this file has to work on the run that creates it.
  #   * The pooler logs `could not open auth_file ... Permission denied` as an
  #     ERROR and then GOES ON LISTENING. It comes up, it accepts connections,
  #     and it refuses every one of them. Nothing about a listening port
  #     distinguishes a working pooler from that one, which is why the health
  #     check in Run 4 authenticates rather than connects.
  #
  # The entrypoint follows dbmate's pattern for the same reason: the credential
  # is read from a mounted file inside the container and never becomes an
  # environment variable, a Compose interpolation, or an argument. `docker
  # inspect` on this container shows identifiers and nothing else.
  #
  # `umask 077` before anything is written, rather than a chmod afterwards: a
  # chmod leaves a window in which the file exists at the default mode, and the
  # window is only short, not absent.
  #
  # THE RESET QUERY IS TWO MEASURED FINDINGS, and the second is why it is not
  # simply `DISCARD ALL`.
  #
  # `server_reset_query_always = 1` is load-bearing (D116). PgBouncer runs the
  # reset query only in SESSION pooling unless this is set; in transaction mode
  # it assumes an application leaves no session state behind. A client that ran
  # `set_config('apg.leak_probe', ..., false)` and disconnected left that GUC on
  # the server connection, and the NEXT CLIENT read it back. A transaction-local
  # claim vanishes at commit on its own, so the dangerous half is exactly the
  # half nothing was cleaning up -- and `SET ROLE`, `search_path` and a session
  # GUC all travel the same way.
  #
  # `DISCARD ALL` then broke the other requirement (D117), because it includes
  # `DEALLOCATE ALL`: every prepared statement on the connection went with the
  # session state, and DBX-POOL-003 -- a named statement surviving a backend
  # change -- cannot hold against a pooler that deallocates after every
  # transaction. The four statements here are `DISCARD ALL` minus that one,
  # which is the whole difference. `RESET ALL` is what actually clears a custom
  # GUC set through `set_config`.
  #
  # Both requirements are real and neither was weakened to satisfy the other:
  # SEC-DBX-003 and DBX-POOL-003 are proved against this one configuration.
  pgbouncer:
    image: ${PGBOUNCER_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [session4]
    restart: "on-failure:5"
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    tmpfs:
      - /etc/pgbouncer:rw,mode=0700,uid=70,gid=70
      - /tmp:rw,mode=0700,uid=70,gid=70
    environment:
      APG_POOL_LISTEN_PORT: ${PGBOUNCER_LISTEN_PORT:?required}
      APG_CLUSTER_HOST: ${POSTGRES_SERVICE_HOST:?required}
      APG_DATABASE_NAME: ${POSTGRES_DATABASE_NAME:?required}
      APG_APP_RUNTIME_ROLE: ${APP_RUNTIME_ROLE_NAME:?required}
      APG_POOL_ADMIN_USER: ${PGBOUNCER_ADMIN_USER:?required}
      APG_POOL_MODE: ${PGBOUNCER_POOL_MODE:?required}
      APG_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:?required}
      APG_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:?required}
      APG_MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS:?required}
      APG_QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:?required}
      APG_IDLE_TRANSACTION_TIMEOUT: ${PGBOUNCER_IDLE_TRANSACTION_TIMEOUT:?required}
      APG_SERVER_LIFETIME: ${PGBOUNCER_SERVER_LIFETIME:?required}
    # Unbraced `$$` throughout, matching dbmate: the braced escaped form is a
    # literal Compose never interpolates, but it is indistinguishable from a
    # real required interpolation to anything reading this file with a regex.
    entrypoint:
      - /bin/sh
      - -c
      - >
        set -eu;
        umask 077;
        app_password="$$(cat /run/secrets/app_runtime_password)";
        admin_password="$$(cat /run/secrets/pgbouncer_admin_password)";
        printf '"%s" "%s"\n"%s" "%s"\n'
        "$$APG_APP_RUNTIME_ROLE" "$$app_password"
        "$$APG_POOL_ADMIN_USER" "$$admin_password"
        > /etc/pgbouncer/userlist.txt;
        printf '127.0.0.1:%s:pgbouncer:%s:%s\n'
        "$$APG_POOL_LISTEN_PORT" "$$APG_POOL_ADMIN_USER" "$$admin_password"
        > /etc/pgbouncer/.pgpass;
        unset app_password admin_password;
        printf '%s\n'
        "[databases]"
        "$$APG_DATABASE_NAME = host=$$APG_CLUSTER_HOST port=5432 dbname=$$APG_DATABASE_NAME"
        ""
        "[pgbouncer]"
        "listen_addr = 0.0.0.0"
        "listen_port = $$APG_POOL_LISTEN_PORT"
        "auth_type = scram-sha-256"
        "auth_file = /etc/pgbouncer/userlist.txt"
        "admin_users = $$APG_POOL_ADMIN_USER"
        "pool_mode = $$APG_POOL_MODE"
        "default_pool_size = $$APG_POOL_SIZE"
        "max_client_conn = $$APG_MAX_CLIENT_CONN"
        "max_prepared_statements = $$APG_MAX_PREPARED_STATEMENTS"
        "query_wait_timeout = $$APG_QUERY_WAIT_TIMEOUT"
        "idle_transaction_timeout = $$APG_IDLE_TRANSACTION_TIMEOUT"
        "server_lifetime = $$APG_SERVER_LIFETIME"
        "server_reset_query = DISCARD PLANS; DISCARD SEQUENCES; DISCARD TEMP; RESET ALL"
        "server_reset_query_always = 1"
        "ignore_startup_parameters = extra_float_digits"
        "log_connections = 1"
        "log_disconnections = 1"
        > /etc/pgbouncer/pgbouncer.ini;
        exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    # WHAT THIS CHECK CAN AND CANNOT PROVE, because the ordering decides it.
    #
    # `project-runtime.sh up` runs `compose up --wait` and THEN the deploy runs
    # postgres-bootstrap, which is what creates the application role. So at the
    # moment this check first runs, on a first deploy, that role does not exist.
    # A check that connected as it would fail `--wait` and take the deploy down
    # with it -- so the backend round-trip belongs to the client proofs, which
    # run after bootstrap, and not here.
    #
    # What it does prove is the failure Run 3 measured, which nothing else
    # catches: the pooler logs `could not open auth_file ... Permission denied`
    # as an ERROR and then GOES ON LISTENING. It comes up, accepts connections,
    # and refuses every one. A port check calls that healthy. Authenticating to
    # the admin console proves the user list was assembled AND is readable by
    # uid 70, which is the whole of that failure.
    #
    # Then it reads the pool mode and the prepared-statement setting back out of
    # the running daemon rather than out of the file that was meant to produce
    # them -- a rendered ini nobody loaded is exactly the kind of value that
    # looks measured and is not.
    #
    # The credential reaches psql through PGPASSFILE -- a 0600 file the
    # entrypoint wrote into the same tmpfs -- rather than through the password
    # environment variable libpq also accepts. Two reasons, and the first is not
    # the obvious one:
    #
    #   * a password passed in a process's environment is readable at
    #     /proc/<pid>/environ by the same user, and every process in this
    #     container is the same user;
    #   * Session 3 banned that variable's name from this model outright, on the
    #     grounds that nothing here had a use for one. Narrowing that ban to
    #     "only when read from a file" would have been a weakening dressed as a
    #     refinement, and `test_no_database_credential_appears_in_the_model_or_the_env`
    #     would have had to be edited to allow it. A pgpass file needs no
    #     exception at all, which is why it is the better answer and not merely
    #     the permitted one.
    #
    # `docker inspect` stores this check's OUTPUT as well as its command, so the
    # awk prints nothing and the whole verdict is its exit status.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          PGPASSFILE=/etc/pgbouncer/.pgpass
          psql -h 127.0.0.1 -p "$$APG_POOL_LISTEN_PORT" -U "$$APG_POOL_ADMIN_USER"
          -d pgbouncer -w -X -qtA -c 'SHOW CONFIG' 2>/dev/null
          | awk -F'|' '
              $$1 == "pool_mode" && $$2 == "transaction" { mode = 1 }
              $$1 == "max_prepared_statements" && $$2 + 0 > 0 { prepared = 1 }
              END { exit !(mode && prepared) }'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # `internal` only, no Traefik label of any kind. The pooler is reached from
    # this project's own services and, once the runtime override publishes one,
    # from a host-loopback port -- never across the edge network.
    networks:
      - internal

  # Session 5. The REST surface.
  #
  # NO ENTRYPOINT, NO CONFIG FILE, AND NO SHELL -- and that is measured rather
  # than stylistic. The image is distroless (Run 1): no shell, no wget, no curl,
  # and no declared ENTRYPOINT. Every other credential-holding service here
  # assembles what it needs from its mounted secret in a few lines of `sh`;
  # there is nothing in this container that can read one file and write another.
  #
  # So the whole configuration is `PGRST_*` in the environment, interpolated by
  # Compose from the rendered compose.env -- every value a derived, non-secret
  # identifier -- and the password is reached through `?passfile=` in the
  # conninfo. Run 4 measured all four ways a password could arrive, with a
  # control that put it inline to prove the rig was real. This is the one that
  # keeps it out of the environment, the argument vector, the labels and
  # `docker inspect`, all four of which were then checked on a running
  # container. `.Args` is literally empty.
  #
  # The mounted file is `*:*:*:*:<password>`, written in that shape by the
  # materializer because nothing here can wrap it (ADR 0056). Wildcards on
  # purpose: naming the host, port, database and role would put four derived
  # identifiers inside a secret file, and the symptom when one drifted would be
  # `fe_sendauth: no password supplied` -- which sends the reader to the wrong
  # file entirely.
  postgrest:
    image: ${POSTGREST_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [session5]
    restart: "on-failure:5"
    # The identity labels, and the two that make this container routable at all.
    #
    # `apg.traefik.scope` is not decoration: `infra/edge/traefik.yaml` sets
    # `constraints: Label(apg.traefik.scope, managed)`, so a container without it
    # is **invisible to the edge**. The router labels the runtime override writes
    # are then attached to something Traefik never looks at, no router is
    # created, and the edge answers 404 for the published URL -- which is what
    # the first live capture got, from a service that was serving the document
    # correctly to its own network the whole time (D186).
    #
    # `traefik.docker.network` because this service is on **two** networks. With
    # one, Traefik infers it; with two it has no way to choose, and the one it
    # must not choose is `internal`, which the proxy is not attached to.
    labels:
      apg.traefik.scope: managed
      apg.project.key: ${PROJECT_KEY:?required}
      apg.environment: ${PROJECT_ENVIRONMENT:?required}
      traefik.docker.network: ${EDGE_NETWORK_NAME:?required}
    # Declared, not inherited. The image sets no USER, so "whatever the base
    # image defaults to" is not even a well-defined answer here; 65532 is
    # cross-checked against secrets.required.yaml by test_secret_contract.py.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    # No command and no entrypoint override. The image declares no ENTRYPOINT,
    # so the binary is the image's own CMD and the argument vector stays empty
    # -- which is one of the four places a password must not be, and the
    # easiest to keep empty by having nothing to put there.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The conninfo, password-free. `?passfile=` names a file rather than
      # carrying a value, so this whole string is safe in `docker inspect`.
      PGRST_DB_URI: postgres://${POSTGREST_AUTHENTICATOR_ROLE:?required}@${POSTGRES_SERVICE_HOST:?required}:5432/${POSTGRES_DATABASE_NAME:?required}?passfile=/run/secrets/postgrest_authenticator_pgpass
      PGRST_DB_SCHEMAS: ${POSTGREST_EXPOSED_SCHEMA:?required}
      PGRST_DB_ANON_ROLE: ${ANON_ROLE_NAME:?required}
      # Two dangerous defaults set explicitly, and one that cannot be (Run 1,
      # corrected in Run 9). `db-config` true would let the database override
      # this reviewed configuration; `db-extra-search-path` defaults to
      # `public`, which is the whole of what ADR 0052 is about.
      #
      # `db-hoisted-tx-settings` was believed to be the third. It is not:
      # measured on the locked image, `--dump-config` reports the full default
      # `statement_timeout,plan_filter.statement_cost_limit,default_transaction_isolation`
      # for an **empty** value exactly as it does for an unset one, so this line
      # does not disable hoisting and never did (D199). It is inert regardless,
      # because hoisting reads nothing with `db-config` false -- measured: with
      # `db-config` false a request role's `statement_timeout` stays `0` whether
      # the hoist list names it or not. The line stays as a declaration of
      # intent, and ADR 0068 is why intent is enough: the pre-request hook
      # carries the timeout, so nothing here needs `db-config` turned on.
      PGRST_DB_CONFIG: "false"
      PGRST_DB_EXTRA_SEARCH_PATH: ""
      PGRST_DB_HOISTED_TX_SETTINGS: ""
      # The identity plane. Migration 0008 creates this function and migration
      # 0009 replaces it; without this line PostgREST never calls it, and the
      # function sits in the database doing nothing. `db-config` is false above,
      # so an `ALTER ROLE ... SET pgrst.db_pre_request` cannot supply it either:
      # the environment is the only path, and this is it.
      #
      # Not schema-qualified by accident -- `app_private` is not on any request
      # role's search_path (ADR 0052), so the qualification is load-bearing.
      #
      # Measured on the locked image with a control, both arms carrying the same
      # nine migrations and the same token: with this set, `POST /rpc/create_note`
      # returns 200 and the row's `owner_id` is the token's `sub`; with it unset,
      # the same request returns `401 AP401: no request identity for this
      # transaction` and `GET /notes` returns `[]`. The unset arm reproduced the
      # deployed failure exactly (ADR 0066, D192).
      PGRST_DB_PRE_REQUEST: app_private.postgrest_pre_request
      # The schema cache reload channel. This is what makes a migration's
      # NOTIFY reach a running service instead of requiring a restart.
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_DB_CHANNEL: pgrst
      # Both off. An aggregate over rows a caller may read is still a way to
      # learn about rows it may not; an execution plan discloses statistics,
      # index names and row estimates for the same query.
      PGRST_DB_AGGREGATES_ENABLED: "false"
      PGRST_DB_PLAN_ENABLED: "false"
      PGRST_DB_MAX_ROWS: ${POSTGREST_MAX_ROWS:?required}
      PGRST_DB_POOL: ${POSTGREST_POOL_SIZE:?required}
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: ${POSTGREST_POOL_ACQUISITION_TIMEOUT:?required}
      PGRST_DB_POOL_MAX_IDLETIME: ${POSTGREST_POOL_MAX_IDLE:?required}
      PGRST_DB_POOL_MAX_LIFETIME: ${POSTGREST_POOL_MAX_LIFETIME:?required}
      PGRST_DB_PREPARED_STATEMENTS: "true"
      # `follow-privileges`, so the published document describes what the
      # reading role may actually reach. It is not a security boundary -- an
      # object hidden from OpenAPI is still there -- which is why the surface
      # contract is compared against the catalog and not only against this
      # (ADR 0050).
      PGRST_OPENAPI_MODE: follow-privileges
      PGRST_OPENAPI_SECURITY_ACTIVE: "true"
      # The address the document describes, which is not the address it is
      # served from. Without this the generated document carries
      # `"host": "0.0.0.0:3000"` and `"basePath": "/"` -- the container's own
      # bind, published to every consumer of the API. Measured on the deployed
      # service before this was set.
      #
      # `openapi_normalize` compares both fields against the published address
      # and refuses a document that disagrees, so the snapshot capture fails
      # rather than approving a document naming a private address. Run 7's
      # committed fixture was captured *with* this set, against a configuration
      # the product did not yet produce (D186).
      PGRST_OPENAPI_SERVER_PROXY_URI: https://${PROJECT_DOMAIN:?required}${API_REST_PATH:?required}
      PGRST_JWT_AUD: ${JWT_AUDIENCE:?required}
      PGRST_JWT_ROLE_CLAIM_KEY: .role
      # `?` and NOT `:?`, and this is the only variable in this file spelled
      # that way. Measured against Compose 29.5.2, both spellings against both
      # inputs: `${VAR:?err}` fails on an **empty** value as well as an unset
      # one; `${VAR?err}` fails only when the variable is absent. Every other
      # required interpolation here names something never legally empty — an
      # identifier, a port, a secret reference — so `:?` is right for those and
      # wrong for exactly this one.
      #
      # An empty list is the correct rendering for a project that declares no
      # REST service (D150), and `build_compose_env` emits it as an empty
      # string. Under `:?` such a project could not render at all, which is what
      # it did on the first live deploy (D178). Unset still fails, so a
      # `compose.env` missing the key remains an error rather than a silently
      # permissive default.
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: ${POSTGREST_CORS_ORIGINS?required}
      # 0.0.0.0 because the service answers its peers on the project network.
      # The admin surface would follow this bind if left alone -- measured in
      # Run 3, where /live and /ready answered a peer container -- so it is
      # pinned to loopback below, and a peer being refused is a test.
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: "3000"
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_LOG_LEVEL: error
      # Off. It logs the query, and a query carries its parameters.
      PGRST_LOG_QUERY: disabled
      # The verification-only JWKS, added by the run that renders it (Run 9), as
      # the note that stood here said it would be. `@` is PostgREST's spelling
      # for "read this from a file"; the container path is fixed and therefore
      # project-neutral, while the host side of the mount is per-project and
      # lives in the runtime override -- `bin/compose.sh` passes `--file` with no
      # `--project-directory`, so a relative source here would resolve against
      # the release and every project would mount one key set.
      #
      # `bin/render-jwks.py` derives it from the bootstrap signing key at deploy
      # time and writes it before the service starts. Nothing in it can sign: a
      # modulus, an exponent, an algorithm and an RFC 7638 thumbprint (ADR 0051).
      #
      # Until this existed every request was `anon` -- a token was not rejected,
      # it was not considered at all -- which was the honest state for a session
      # with no activated role and is not a state to return to.
      PGRST_JWT_SECRET: "@/etc/postgrest/jwks.json"
    # `postgrest --ready` is a CLIENT that reads its own configuration, not the
    # running process's (D153) -- bare, it exits 1 with "Admin server is not
    # running" against a service answering 200. It works here for a reason
    # specific to this design: the configuration lives in the environment, so
    # the probe's own configuration IS the service's. Measured exit 0 against a
    # service answering 200, and it is why there is no config file to name.
    #
    # What it proves is the pool and the schema cache, which a port check does
    # not. What it does NOT prove is the request path: D145 measured `--ready`
    # returning 0 while every request 404'd, because a pre-request hook that
    # cannot resolve does not stop the service starting. That half cannot be
    # proved from inside a container with no HTTP client, so it belongs to the
    # deploy's own verification and to API-REST-001 -- not here, where it would
    # have to be faked.
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Both networks. `edge` because Traefik reaches it there; `internal`
    # because that is where the cluster is. It is the second service to
    # straddle them, and the only one that serves a public route.
    networks:
      - edge
      - internal

  # Session 5's documentation page (ADR 0069, D128).
  #
  # A first-party build, and the reason is the Content-Security-Policy: the
  # Scalar bundle is not self-contained at any published version -- measured,
  # `dist/browser/standalone.js` names `fonts.scalar.com` fourteen times and
  # `proxy.scalar.com` beside it, with `withDefaultFonts` defaulting to true
  # (D202). `index.html` turns those off, which is a promise about a third
  # party's code honouring its own flag; the header `serve.py` sends is a rule
  # the visitor's browser enforces. Only a build we own can send it, which is
  # what ruled out the upstream image -- that, and its publishing `latest` only,
  # so the lock would have recorded a digest with no version identity.
  docs:
    build:
      context: ./services/docs
      args:
        NODE_BASE_IMAGE: ${NODE_RUNTIME_IMAGE:?required}
        PYTHON_BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [session5]
    restart: "on-failure:5"
    # `apg.traefik.scope` because `infra/edge/traefik.yaml` constrains on it and
    # a container without it is invisible to the edge -- a correct router
    # attached to nothing, answering 404 (D186).
    #
    # `traefik.docker.network` is here although this service is on `edge` ONLY,
    # and the comment that used to be here said it was on two networks, which it
    # has never been. It is kept because it is correct rather than because the
    # reason was: naming the network a router's backend is reached on cannot be
    # wrong when there is one, and it stops being right by accident if a later
    # session gives the page a second attachment.
    labels:
      apg.traefik.scope: managed
      apg.project.key: ${PROJECT_KEY:?required}
      apg.environment: ${PROJECT_ENVIRONMENT:?required}
      traefik.docker.network: ${EDGE_NETWORK_NAME:?required}
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 5s
    # No environment beyond the paths the server reads, and none is a secret.
    # This service holds no credential of any kind: the documentation password
    # is a Traefik concern (a bcrypt hash inline in the middleware document the
    # file provider parses, ADR 0086), and `secrets.required.yaml` declares it
    # with a **root-plane consumer only**, which is what SEC-DOCS-001 asserts. A
    # compose consumer here would be a container holding the password to its own
    # front door.
    #
    # `APG_DOCS_APP_SNAPSHOT` is Run 10's second surface (D226): a second file
    # in the directory already mounted, served under `/app` by the same process
    # under the same CSP behind the same credential.
    environment:
      APG_DOCS_PORT: "8080"
      APG_DOCS_SNAPSHOT: /app/snapshot/openapi.json
      APG_DOCS_APP_SNAPSHOT: /app/snapshot/app-openapi.json
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/__apg/healthz', timeout=2).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # `edge` only. The page reads a file and serves it; it has no reason to
    # reach the cluster, and the isolation proofs are cheaper to make true than
    # to argue about. It is the first routed service that is NOT on `internal`.
    networks:
      - edge

  # Session 6's auth service. Run 7 built the process; **Run 10 publishes it.**
  #
  # On `edge` as well as `internal` since Run 10, which is why
  # `traefik.docker.network` is here: a container on two networks gives Traefik
  # two addresses and no way to choose, and the one it picks is not necessarily
  # the one the edge can reach.
  #
  # `apg.traefik.scope: managed` is what makes a container visible to the edge
  # at all -- `infra/edge/traefik.yaml` constrains on it, so a container without
  # it carries no route however correct its router is (D186). The router and
  # service labels themselves are NOT here: their keys contain the derived
  # router name and Compose cannot interpolate inside a label key (ADR 0013), so
  # `runtime_override.py` renders them.
  #
  # **Publishing the container is not publishing the route.** `routes.app.status`
  # stays `unavailable` until an active project administrator exists (D230): the
  # deployed document does not name a URL, the operator is told to run the local
  # bootstrap, and the deploy exits 0 -- a project awaiting its first
  # administrator is not a failed deploy. What the route does *serve* before
  # then is refusals, which is the same thing it serves to an unauthenticated
  # caller afterwards; there is no endpoint that creates an administrator over
  # HTTP, and `SEC-BOOT-001` asserts its absence rather than trusting it.
  auth:
    build:
      context: ./services/auth-api
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
        # Every dependency version from the lock, so versions.env stays the
        # single authority (ADR 0077). A version written into the Dockerfile
        # would be a second declaration bin/lock-versions.sh cannot see, which
        # is how SCALAR_VERSION named a release that never existed for four
        # sessions (D201).
        ARGON2_CFFI_VERSION: ${ARGON2_CFFI_VERSION:?required}
        BOTO3_VERSION: ${BOTO3_VERSION:?required}
        BOTOCORE_VERSION: ${BOTOCORE_VERSION:?required}
        CRYPTOGRAPHY_VERSION: ${CRYPTOGRAPHY_VERSION:?required}
        FASTAPI_VERSION: ${FASTAPI_VERSION:?required}
        FASTMCP_VERSION: ${FASTMCP_VERSION:?required}
        PSYCOPG_VERSION: ${PSYCOPG_VERSION:?required}
        PSYCOPG_POOL_VERSION: ${PSYCOPG_POOL_VERSION:?required}
        PYDANTIC_VERSION: ${PYDANTIC_VERSION:?required}
        PYDANTIC_SETTINGS_VERSION: ${PYDANTIC_SETTINGS_VERSION:?required}
        PYJWT_VERSION: ${PYJWT_VERSION:?required}
        UVICORN_VERSION: ${UVICORN_VERSION:?required}
    profiles: [session6]
    restart: "on-failure:5"
    labels:
      apg.traefik.scope: managed
      apg.project.key: ${PROJECT_KEY:?required}
      apg.environment: ${PROJECT_ENVIRONMENT:?required}
      traefik.docker.network: ${EDGE_NETWORK_NAME:?required}
    # Matches the uid/gid secrets.required.yaml declares for both of this
    # service's consumers. The host sets ownership before Compose mounts the
    # file (ADR 0010), so a mismatch is a container that cannot read its own
    # credential -- and the usual fix for that is to widen 0400.
    user: "65532:65532"
    read_only: true
    # uid/gid on the tmpfs because a read-only root filesystem gives the
    # process nowhere else to write, and a tmpfs owned by root would be one the
    # dropped-privilege process cannot use.
    tmpfs:
      - /tmp:rw,mode=0700,uid=65532,gid=65532
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Longer than the docs page's 5s: the lifespan closes the pool on the way
    # out, and a container killed before that returns its connections leaves
    # the cluster short until the backends time out.
    stop_grace_period: 15s
    mem_limit: ${AUTH_MEMORY_LIMIT:?required}
    depends_on:
      postgres:
        condition: service_healthy
    # Thirteen variables, every one required, and not one of them a secret.
    # `app/settings.py` declares the same set in REQUIRED_VARIABLES and
    # test_the_compose_service_supplies_every_setting_the_service_requires
    # compares the two lists -- because a renderer emitting a variable the
    # compose file does not read, or the reverse, is D178.
    #
    # The credential is a MOUNTED FILE that libpq reads through the conninfo's
    # `passfile=`, and the signing key is a mounted file read once at startup.
    # Neither becomes an environment variable, an argument or a log line.
    environment:
      # The mode, and it is required here for the same reason it is required on
      # the `storage` service (ADR 0101). The entrypoint is
      # `--factory app.main:create_app`, which is called with no arguments, so
      # this variable is the only thing that decides which router is mounted.
      # Omitting it does not default to auth -- `create_app` refuses to build,
      # because an image that picked a mode by omission would start the wrong
      # service with a correct-looking configuration.
      APP_MODE: auth
      APG_PROJECT_KEY: ${PROJECT_KEY:?required}
      APG_PROJECT_ENVIRONMENT: ${PROJECT_ENVIRONMENT:?required}
      # The project's JWT identity, and the same two variables PostgREST's
      # verification reads. Not `AUTH_`-prefixed: an issuer and an audience are
      # properties of the PROJECT, derived once in naming.py, and a second name
      # for one derived value is ADR 0002 broken at the smallest scale. The
      # signer and the verifier have to agree on both strings, and the only way
      # to guarantee that is for both to read one authority.
      APG_JWT_ISSUER: ${JWT_ISSUER:?required}
      APG_JWT_AUDIENCE: ${JWT_AUDIENCE:?required}
      # The cluster directly, on 5432, exactly as PostgREST does (ADR 0092).
      #
      # This said "PgBouncer, not the cluster directly" until the first host
      # deploy, and the reasoning was sound in itself -- short transactional
      # queries are what transaction pooling is for. What it did not survive is
      # that PgBouncer authenticates its clients against a userlist holding two
      # roles, `app_runtime` and the pool admin, and `auth_service` is neither.
      # The service failed with `FATAL: SASL authentication failed` before
      # postgres was ever consulted (D289).
      #
      # Closing that gap the other way would have put the auth service's
      # database password into PgBouncer's userlist -- a credential reaching the
      # identity registry, held by a second container, to gain a pooling layer
      # under a service that already runs its own psycopg pool. PostgREST is the
      # precedent and it connects directly: `PGRST_DB_URI` names
      # `POSTGRES_SERVICE_HOST:5432`.
      #
      # ADR 0070's arithmetic is unchanged. The budget is a division of one
      # `max_connections`, and `AUTH_POOL_SIZE` (4) sits inside the role's
      # CONNECTION LIMIT (6) whichever side of a pooler it is counted on.
      APG_DATABASE_HOST: ${POSTGRES_SERVICE_HOST:?required}
      APG_DATABASE_PORT: "5432"
      APG_DATABASE_NAME: ${POSTGRES_DATABASE_NAME:?required}
      APG_DATABASE_ROLE: ${AUTH_SERVICE_ROLE_NAME:?required}
      APG_DATABASE_PASSFILE: /run/secrets/auth_service_pgpass
      APG_POOL_SIZE: ${AUTH_POOL_SIZE:?required}
      APG_SIGNING_KEY_FILE: /run/secrets/auth_jwt_signing_key.pem
      APG_LISTEN_PORT: "8080"
      # Compact JSON: suffix -> derived role name, for the roles a token may
      # name. Derivation stays in naming.py (ADR 0002); the container is
      # handed the answer rather than computing a second one.
      APG_ROLE_NAMES: ${AUTH_ROLE_NAMES:?required}
    # Container-local, and the only health surface this service has (D231).
    # `/health/ready` opens a connection from the pool and runs one statement,
    # so an unhealthy container is one that could not serve a request -- not one
    # whose port happens to be open.
    #
    # start_period is 20s rather than 5: the lifespan opens the pool to
    # min_size before it yields, and it will not yield at all if the cluster is
    # not there.
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Both, and the order is the order Traefik would guess wrong in. `internal`
    # is where the pooler and the cluster are; `edge` is where the request
    # arrives from. `traefik.docker.network` above is what removes the guess.
    networks:
      - internal
      - edge

  # Session 4's client compatibility fixtures (DBX-001..005).
  #
  # `session4-verify`, not `session4`, and the distinction is the same one
  # `secret-check` draws: `bin/project-runtime.sh::session_profiles` selects
  # `session2..N`, so nothing here starts with a deploy. These are one-shot
  # proofs that are run deliberately, `restart: "no"`, and a project running
  # them continuously would be a project holding four extra connections against
  # a budget the cluster computed for services that do work.
  #
  # Each is a declared consumer of app_runtime_password, so each gets its own
  # materialized copy at its own uid. That is four more files a rotation has to
  # reach, and secrets.required.yaml records why it is still the right shape:
  # a shared mount would break the property the per-consumer layout exists for.
  #
  # THE CREDENTIAL NEVER BECOMES AN ENVIRONMENT VARIABLE. Three of the four read
  # the mounted file and write a 0600 pgpass into their own tmpfs, which libpq
  # and node-postgres both honour through PGPASSFILE. Prisma is the exception
  # and is handled the way dbmate was (ADR 0034): it builds a URL at run time,
  # inside the container, from the same file.
  client-psql:
    build:
      context: ./services/clients/psql
      args:
        BASE_IMAGE: ${PGBOUNCER_IMAGE:?required}
    profiles: [session4-verify]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,mode=0700,uid=65532,gid=65532
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    # Both transports, in one container. DBX-003 is a claim about the same role
    # over two ports, and running it twice from one process tree is what makes
    # a difference between them attributable to the transport.
    environment:
      APG_POOLED_HOST: ${PGBOUNCER_SERVICE_HOST:?required}
      APG_POOLED_PORT: ${PGBOUNCER_LISTEN_PORT:?required}
      APG_DIRECT_HOST: ${POSTGRES_SERVICE_HOST:?required}
      APG_DIRECT_PORT: "5432"
      PGUSER: ${APP_RUNTIME_ROLE_NAME:?required}
      PGDATABASE: ${POSTGRES_DATABASE_NAME:?required}
      PGSSLMODE: disable
      APG_USER_A: ${APG_FIXTURE_USER_A:?required}
      APG_USER_B: ${APG_FIXTURE_USER_B:?required}
    networks:
      - internal

  client-node-pg:
    build:
      context: ./services/clients/node-pg
      args:
        BASE_IMAGE: ${NODE_RUNTIME_IMAGE:?required}
    profiles: [session4-verify]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,mode=0700,uid=65532,gid=65532
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    environment:
      PGHOST: ${PGBOUNCER_SERVICE_HOST:?required}
      PGPORT: ${PGBOUNCER_LISTEN_PORT:?required}
      PGUSER: ${APP_RUNTIME_ROLE_NAME:?required}
      PGDATABASE: ${POSTGRES_DATABASE_NAME:?required}
      PGSSLMODE: disable
      APG_TRANSPORT: pooled
      APG_USER_A: ${APG_FIXTURE_USER_A:?required}
      APG_USER_B: ${APG_FIXTURE_USER_B:?required}
    networks:
      - internal

  client-psycopg:
    build:
      context: ./services/clients/psycopg
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [session4-verify]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,mode=0700,uid=65532,gid=65532
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    environment:
      PGHOST: ${PGBOUNCER_SERVICE_HOST:?required}
      PGPORT: ${PGBOUNCER_LISTEN_PORT:?required}
      PGUSER: ${APP_RUNTIME_ROLE_NAME:?required}
      PGDATABASE: ${POSTGRES_DATABASE_NAME:?required}
      PGSSLMODE: disable
      APG_TRANSPORT: pooled
      APG_USER_A: ${APG_FIXTURE_USER_A:?required}
      APG_USER_B: ${APG_FIXTURE_USER_B:?required}
    networks:
      - internal

  # One image, two modes. `client` is the default because it is the claim this
  # service can make without any privileged setup; `migrate` needs the
  # disposable schema to exist and is run by the Session 4 gate after the
  # privileged half has created and recorded it (plan §4.4).
  client-prisma:
    build:
      context: ./services/clients/prisma
      args:
        BASE_IMAGE: ${NODE_RUNTIME_IMAGE:?required}
    profiles: [session4-verify]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,mode=0700,uid=65532,gid=65532
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    command: [client]
    environment:
      PGHOST: ${PGBOUNCER_SERVICE_HOST:?required}
      PGPORT: ${PGBOUNCER_LISTEN_PORT:?required}
      PGUSER: ${APP_RUNTIME_ROLE_NAME:?required}
      PGDATABASE: ${POSTGRES_DATABASE_NAME:?required}
      PGSSLMODE: disable
      APG_TRANSPORT: pooled
      APG_USER_A: ${APG_FIXTURE_USER_A:?required}
      APG_USER_B: ${APG_FIXTURE_USER_B:?required}
      # Only the migrate mode reads these three. Present unconditionally
      # because a service whose environment depended on its command would be
      # two services wearing one name, and `docker inspect` would show a
      # different answer depending on when it was asked.
      APG_MIGRATION_ROLE: ${MIGRATION_ROLE_NAME:?required}
      APG_POOLED_HOST: ${PGBOUNCER_SERVICE_HOST:?required}
      APG_POOLED_PORT: ${PGBOUNCER_LISTEN_PORT:?required}
      APG_DIRECT_HOST: ${POSTGRES_SERVICE_HOST:?required}
      APG_DIRECT_PORT: "5432"
      APG_DISPOSABLE_SCHEMA: ${APG_DISPOSABLE_SCHEMA:?required}
    networks:
      - internal


  # Session 7's object-storage runtime. The SAME IMAGE as `auth`, in a second
  # mode selected by `APP_MODE` (ADR 0101) -- one build context, because a
  # second service directory could not import the JWT verifier, the strict
  # request parser or the error vocabulary any more than either can reach
  # `src/`. The least-privilege boundary the two need is not the image: it is
  # the secret contract's per-consumer materialization, which is what makes
  # "storage holds no signing key, auth holds no R2 credential" a property of
  # the filesystem rather than a rule somebody keeps.
  #
  # No Traefik router labels. `apg.traefik.scope: managed` is what the edge
  # filters on and the identity labels are here, but the router itself is Run
  # 7's: a label set that published `/api/app/storage` before anything answered
  # it would route to a container that 404s, and Traefik's own 404 and a routed
  # one are indistinguishable from outside (D186, D187).
  #
  # `profiles: [session7]` and CURRENT_SESSION is 6, so nothing starts this yet:
  # `project-runtime.sh` selects `--profile session${n}` for n up to
  # --through-session. Measured before the entry was written -- adding it left
  # the whole offline suite green but for the one test that exists to be
  # answered when a secret name is added.
  storage:
    build:
      context: ./services/auth-api
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
        ARGON2_CFFI_VERSION: ${ARGON2_CFFI_VERSION:?required}
        BOTO3_VERSION: ${BOTO3_VERSION:?required}
        BOTOCORE_VERSION: ${BOTOCORE_VERSION:?required}
        CRYPTOGRAPHY_VERSION: ${CRYPTOGRAPHY_VERSION:?required}
        FASTAPI_VERSION: ${FASTAPI_VERSION:?required}
        FASTMCP_VERSION: ${FASTMCP_VERSION:?required}
        PSYCOPG_VERSION: ${PSYCOPG_VERSION:?required}
        PSYCOPG_POOL_VERSION: ${PSYCOPG_POOL_VERSION:?required}
        PYDANTIC_VERSION: ${PYDANTIC_VERSION:?required}
        PYDANTIC_SETTINGS_VERSION: ${PYDANTIC_SETTINGS_VERSION:?required}
        PYJWT_VERSION: ${PYJWT_VERSION:?required}
        UVICORN_VERSION: ${UVICORN_VERSION:?required}
    profiles:
      - session7
    restart: on-failure:5
    labels:
      apg.traefik.scope: managed
      apg.project.key: ${PROJECT_KEY:?required}
      apg.environment: ${PROJECT_ENVIRONMENT:?required}
      traefik.docker.network: ${EDGE_NETWORK_NAME:?required}
    user: 65532:65532
    read_only: true
    # A block sequence, not a flow sequence. `[/tmp:rw,mode=0700,...]` is valid
    # YAML and parses as FOUR mount paths, which `compose config` cannot catch
    # because four strings are as valid as one (D287).
    tmpfs:
      - /tmp:rw,mode=0700,uid=65532,gid=65532
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    mem_limit: ${STORAGE_MEMORY_LIMIT:?required}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The mode, and it is required rather than defaulted for ADR 0055's
      # reason applied to behaviour: an image that picked a mode by omission
      # would start the wrong service with a correct-looking configuration.
      APP_MODE: storage
      APG_PROJECT_KEY: ${PROJECT_KEY:?required}
      APG_PROJECT_ENVIRONMENT: ${PROJECT_ENVIRONMENT:?required}
      # Storage is a second surface of the application API and shares its
      # issuer and audience, so it verifies the same tokens `auth` issues. It
      # is a THIRD verifier (ADR 0098, D320) and holds no signing key: there is
      # no APG_SIGNING_KEY_FILE here and there must not be.
      APG_JWT_ISSUER: ${JWT_ISSUER:?required}
      APG_JWT_AUDIENCE: ${JWT_AUDIENCE:?required}
      # What it verifies WITH, and the thing D381 found missing: being told it
      # is a verifier is not the same as being given a key set. The rendered
      # JWKS -- the same file `postgrest` reads -- is mounted read-only by
      # `runtime_override.py` and loaded through `LocalKeySet.from_path`
      # (ADR 0113). The container path is fixed so this model stays
      # project-neutral; the per-project host side lives in the override.
      APG_JWKS_FILE: /etc/storage/jwks.json
      APG_DATABASE_HOST: ${POSTGRES_SERVICE_HOST:?required}
      APG_DATABASE_PORT: '5432'
      APG_DATABASE_NAME: ${POSTGRES_DATABASE_NAME:?required}
      APG_DATABASE_ROLE: ${STORAGE_SERVICE_ROLE_NAME:?required}
      APG_DATABASE_PASSFILE: /run/secrets/storage_service_pgpass
      APG_POOL_SIZE: ${STORAGE_POOL_SIZE:?required}
      APG_LISTEN_PORT: '8080'
      APG_ROLE_NAMES: ${AUTH_ROLE_NAMES:?required}
      # The bucket and the key prefix, derived by naming.py and handed in --
      # never re-derived here (ADR 0002). The R2 credential is NOT here and
      # never will be: both halves are mounted files, which is what keeps them
      # out of the environment, the argument vector and `docker inspect` (D60).
      APG_STORAGE_BUCKET: ${STORAGE_BUCKET:?required}
      APG_STORAGE_PREFIX: ${STORAGE_PREFIX:?required}
      # Where the bucket is. Derived from the manifest's account id and
      # jurisdiction by naming.storage_endpoint_url and handed over finished --
      # the image never assembles a URL (ADR 0106). The account id is an
      # IDENTIFIER, not a credential: it is in the hostname of every request, so
      # it travels as an environment variable, unlike the two halves below.
      APG_STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?required}
      APG_STORAGE_ACCESS_KEY_ID_FILE: /run/secrets/r2_access_key_id
      APG_STORAGE_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_secret_access_key
      APG_STORAGE_UPLOAD_URL_TTL_SECONDS: ${STORAGE_UPLOAD_URL_TTL_SECONDS:?required}
      APG_STORAGE_DOWNLOAD_URL_TTL_SECONDS: ${STORAGE_DOWNLOAD_URL_TTL_SECONDS:?required}
      APG_STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:?required}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/ready',
          timeout=2).status==200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
      - edge


  # Session 8's agent plane. The SAME IMAGE again, in a third mode selected by
  # `APP_MODE` (ADR 0101, extended by ADR 0121) -- one build context, because a
  # second service directory could not import `LocalKeySet`, and the FOURTH
  # verifier acquiring a second key-set parser is precisely how D381 happened to
  # the third.
  #
  # **This container holds no credential of any kind, and that is the entry's
  # most important property.** No `APG_SIGNING_KEY_FILE`: it is a verifier and
  # never an issuer (ADR 0098). No `APG_DATABASE_*`, no `APG_POOL_SIZE`, no
  # passfile and no `secrets:` block at all -- so it takes **no share of ADR
  # 0099's connection budget**, and that zero is a decision rather than an
  # oversight (D407). `settings.load_mcp` refuses to start if any of them is
  # present, which is what makes the paragraph above a property instead of a
  # comment. D309 was the opposite mistake and the discipline is the same one.
  #
  # No `depends_on: postgres` either, for the same reason: nothing here opens a
  # connection. It is also absent from `POST_BOOTSTRAP_SERVICES`, because it
  # authenticates as no role the bootstrap plane must activate (D410).
  #
  # No Traefik router labels. The route at `/mcp` is Run 7's -- publishing it
  # before the four tools answer would route to a surface that has none, and
  # `PathPrefix(/mcp)` is a STRING prefix that also matches `/mcpx` (D162,
  # D408). The identity labels are here so the edge's scope filter and the
  # project's own tooling can see the container.
  #
  # `profiles: [session8]` and CURRENT_SESSION is 7, so nothing starts this yet.
  # Moving that constant arms this profile on the next deploy of any project and
  # is therefore a deliberate step in Run 7, not a tidy-up (D410, D414).
  mcp:
    build:
      context: ./services/auth-api
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
        ARGON2_CFFI_VERSION: ${ARGON2_CFFI_VERSION:?required}
        BOTO3_VERSION: ${BOTO3_VERSION:?required}
        BOTOCORE_VERSION: ${BOTOCORE_VERSION:?required}
        CRYPTOGRAPHY_VERSION: ${CRYPTOGRAPHY_VERSION:?required}
        FASTAPI_VERSION: ${FASTAPI_VERSION:?required}
        FASTMCP_VERSION: ${FASTMCP_VERSION:?required}
        PSYCOPG_VERSION: ${PSYCOPG_VERSION:?required}
        PSYCOPG_POOL_VERSION: ${PSYCOPG_POOL_VERSION:?required}
        PYDANTIC_VERSION: ${PYDANTIC_VERSION:?required}
        PYDANTIC_SETTINGS_VERSION: ${PYDANTIC_SETTINGS_VERSION:?required}
        PYJWT_VERSION: ${PYJWT_VERSION:?required}
        UVICORN_VERSION: ${UVICORN_VERSION:?required}
    profiles:
      - session8
    restart: on-failure:5
    labels:
      apg.traefik.scope: managed
      apg.project.key: ${PROJECT_KEY:?required}
      apg.environment: ${PROJECT_ENVIRONMENT:?required}
      traefik.docker.network: ${EDGE_NETWORK_NAME:?required}
    user: 65532:65532
    read_only: true
    # A block sequence, not a flow sequence: `[/tmp:rw,mode=0700,...]` is valid
    # YAML and parses as FOUR mount paths, which `compose config` cannot catch
    # because four strings are as valid as one (D287).
    tmpfs:
      - /tmp:rw,mode=0700,uid=65532,gid=65532
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    mem_limit: ${MCP_MEMORY_LIMIT:?required}
    environment:
      APP_MODE: mcp
      APG_PROJECT_KEY: ${PROJECT_KEY:?required}
      APG_PROJECT_ENVIRONMENT: ${PROJECT_ENVIRONMENT:?required}
      # It verifies the tokens `auth` issues, so it shares the issuer and the
      # audience -- and accepts only `token_use: "agent"` (ADR 0115), which is
      # the runtime's rule rather than a variable, because a surface whose
      # accepted token use could be changed by an environment variable is a
      # surface whose boundary is an operator's typo away.
      APG_JWT_ISSUER: ${JWT_ISSUER:?required}
      APG_JWT_AUDIENCE: ${JWT_AUDIENCE:?required}
      # What it verifies WITH (ADR 0113), and the line D381 is about. The
      # rendered JWKS -- the SAME file postgrest and storage read, not a copy --
      # is mounted read-only by `runtime_override.py`. The container path is
      # fixed here so this model stays project-neutral; the per-project host
      # side lives in the override.
      APG_JWKS_FILE: /etc/mcp/jwks.json
      APG_LISTEN_PORT: '8080'
      # Where the agent plane asks who its caller is (ADR 0125). **An HTTP
      # address, and it is not a credential of any kind** -- compare
      # `PGRST_DB_URI` in the `postgrest` service above, which is a
      # `postgres://` URL naming the authenticator role. The two spellings sit
      # in one file and mean opposite things, so `settings.load_mcp` parses this
      # one and refuses anything carrying userinfo.
      #
      # The request that goes to it carries the CALLER's own bearer token and
      # nothing of this runtime's, because this runtime has nothing: no signing
      # key, no database credential, no service identity. That absence is what
      # makes a confused deputy unconstructible here rather than merely
      # unwritten.
      #
      # Derived by `naming`/`rendering` and handed over finished (ADR 0002,
      # ADR 0106's rule for the storage endpoint applied here): the image never
      # assembles an address.
      APG_POSTGREST_URL: ${MCP_POSTGREST_URL:?required}
      # The compiled capability lock for THIS project (ADR 0127), mounted
      # read-only by `runtime_override.py` from the rendered directory -- the
      # same mechanism the key set uses, and for the same reason: the host side
      # is a per-project absolute path and this model stays project-neutral.
      #
      # `bin/deploy-project.py` writes it with `bin/mcp-contract.sh lock`. A
      # mount whose file nothing produces is D381 exactly, so the producer and
      # the consumer arrive in the same run.
      APG_MCP_LOCK_FILE: /etc/mcp/capability-lock.json
    # Run 7's, and the module Run 4 deferred (D429) now exists: ADR 0124's
    # allowlist gave the probe a row with a reason, which is what it was waiting
    # for.
    #
    # It asks `/health/ready`, which reports only what STARTUP established --
    # the key set and the capability lock are both loaded -- and calls nothing
    # (ADR 0128). This runtime holds no credential and opens no connection, so
    # it has no dependency of its own to probe, and a readiness answer that
    # reached PostgREST would take this container out of service for a fault
    # that is not its own.
    #
    # Neither health route is published. No Traefik router names them, so they
    # are private by the absence of a route rather than by a guard, and the
    # public health answer stays `__apg/healthz` (D231).
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - app.mcp_health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
      - edge

networks:
  edge:
    name: ${EDGE_NETWORK_NAME:?required}
  internal:
    name: ${INTERNAL_NETWORK_NAME:?required}
    # No route off the host. Product services attach here; only Traefik will
    # ever straddle both networks.
    internal: true

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:?required}
