# Validation-only Compose model (runbook §7).
#
# Session 1 starts nothing. This file exists so that the resource names in
# outputs.json can be proven to match what Docker would actually create, and so
# that later sessions extend a model that already interpolates from the lock
# rather than from whatever happens to be in the operator's environment.
#
# Every value is `${VAR:?required}`. That is deliberate: an unset variable
# fails `docker compose config` loudly instead of silently rendering an empty
# name, which would collapse two projects onto one resource.
#
# Resource names are set explicitly rather than left to Compose's
# `{project}_{name}` convention, so the names here are byte-identical to the
# ones in outputs.json.
#
# Do not use `container_name`: it is not project-scoped and would collide
# across two deployments on the same host.
#
# Invoke only through bin/compose.sh. Calling `docker compose` directly lets
# inherited environment variables win over --env-file, which is the exact
# override this repository is built to prevent.

name: ${COMPOSE_PROJECT_NAME:?required}

services:
  # Profile-gated so it is never part of the default set. It exists to give the
  # model a service to validate; the Session 1 gate renders the model and never
  # starts this container.
  contract-probe:
    image: ${PYTHON_RUNTIME_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [contract]
    command: ["python", "--version"]
    restart: "no"
    # The probe attaches to both networks and mounts the volume purely so that
    # all four resource names appear in `docker compose config` output.
    # Compose prunes top-level networks and volumes that no service
    # references, so a probe attached only to `internal` would leave the edge
    # network and the volume unrenderable -- and runbook §12's "Compose has
    # explicit actual resource names matching outputs" would be unverifiable.
    # This container is never started; see bin/compose.sh.
    networks:
      - edge
      - internal
    # Mounted where `postgres` mounts it, not at the pre-18 `/data` path. The
    # probe never starts, so nothing here breaks either way -- but this is the
    # only other mount target in the repository, and a wrong example is how the
    # wrong path gets copied into the service that does start. See D53.
    volumes:
      - postgres-data:/var/lib/postgresql

  # Session 2's public HTTPS target. Deliberately trivial: it exists so that
  # "Traefik routes this project, with a trusted certificate, and returns this
  # project's identity" is a measurable claim before any application service.
  #
  # It carries the identity labels and the network hint, but NOT
  # `traefik.enable`, and NOT the router or service labels. Two reasons:
  #
  #   1. The router labels' *keys* contain the router name
  #      (traefik.http.routers.<name>.rule). Interpolation inside a label key is
  #      not portable to the Compose version floor, so the renderer emits fully
  #      formed keys into the root-owned runtime override instead (ADR 0013).
  #   2. Without `traefik.enable`, this model on its own is inert to Traefik.
  #      Exposure becomes a deliberate act of deployment rather than a property
  #      of a file in the repository.
  edge-probe:
    build:
      context: ./services/edge-probe
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [session2]
    restart: "on-failure:5"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    environment:
      PROJECT_KEY: ${PROJECT_KEY:?required}
    # No `ports`. Only Traefik publishes a host port, and the acceptance suite
    # asserts that against the resolved model, not against this comment.
    networks:
      - edge
    labels:
      apg.traefik.scope: managed
      apg.project.key: ${PROJECT_KEY:?required}
      apg.environment: ${PROJECT_ENVIRONMENT:?required}
      traefik.docker.network: ${EDGE_NETWORK_NAME:?required}

  # The control for DEP-EDGE-002. Same network, same project, no labels at all.
  # If the public route can reach this, discovery is not actually constrained
  # and `exposedByDefault=false` is not doing what it claims.
  unlabeled-probe:
    build:
      context: ./services/edge-probe
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [isolation-test]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    environment:
      PROJECT_KEY: ${PROJECT_KEY:?required}
    networks:
      - edge

  # One-shot proof that secret materialization reached this container, and only
  # this container. The `secrets:` grant and the top-level secrets block are NOT
  # here: the source path is an immutable generation directory whose identifier
  # does not exist until materialization runs, so the runtime override supplies
  # them. What lives here is the `user:` the secret files must be owned by, so
  # that secrets.required.yaml and the service contract can be cross-checked
  # from source (tests/contract/test_secret_contract.py).
  secret-check:
    build:
      context: ./services/secret-check
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [session2-verify]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    networks:
      - internal

  # Session 3's cluster. Everything here that looks like hardening is a
  # requirement with a test behind it, not a precaution:
  #
  #   * `internal` only, no `ports`, no Traefik label of any kind -- DBX-PG-002.
  #     The internal network is `internal: true`, so this has no route off the
  #     host at all; SEC-NET-001's external scan of 5432 measures a firewall
  #     from Session 3 on rather than measuring an absence.
  #   * the volume mounts at `/var/lib/postgresql`, which is what the image
  #     declares as its VOLUME -- NOT at PGDATA (`/var/lib/postgresql/18/docker`)
  #     and not at the pre-18 `/var/lib/postgresql/data`. All three were
  #     measured: the pre-18 path makes the image refuse to start, and mounting
  #     at PGDATA works while silently leaving an anonymous volume on the
  #     parent. Two of the three persist data, so "the row survived" is not the
  #     property that distinguishes them. See D53.
  #   * `user: "999:999"` is the image's own postgres uid/gid, measured rather
  #     than assumed -- it is not the 65532 the Session 2 services use. Running
  #     as that user directly rather than letting the entrypoint gosu down from
  #     root also leaves PGDATA owned `999:999` instead of `999:0`.
  #     secrets.required.yaml must name the same numbers, and
  #     tests/contract/test_secret_contract.py cross-checks the two.
  #   * `shm_size` exceeds `shared_buffers`. PostgreSQL's dynamic shared memory
  #     for parallel query lands in /dev/shm, and Docker's default is 64 MiB.
  #   * `mem_limit` is deliberately larger than the manifest's unreclaimable
  #     budget. A container limit caps page cache too; set at the budget, the
  #     cluster runs in permanent reclaim and never says why it is slow.
  #
  # No `container_name`. The model's standing rule holds and the name Compose
  # derives is recorded in outputs.json instead; Run 8 compares that against the
  # container actually running.
  postgres:
    image: ${POSTGRES_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [session3]
    restart: "on-failure:5"
    user: "999:999"
    stop_grace_period: 1m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:?required}
    shm_size: ${POSTGRES_SHM_SIZE:?required}
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME:?required}
      POSTGRES_USER: postgres
      # The value never appears here, in compose.env, or in any process
      # argument. The entrypoint's own file_env reads the path.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_init_superuser_password
      # Locale and checksums are initdb-time and cannot be changed afterwards
      # without a dump and reload, which is why they are pinned at the model
      # rather than left to whatever the image defaults to this year.
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:?required}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:?required}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:?required}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:?required}
      # Listening on every interface inside a network with no route off the
      # host. The boundary is the network and the absence of a published port,
      # not a bind address -- binding to localhost would also make the cluster
      # unreachable from its own project's services.
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DATABASE_NAME:?required} -q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal
    volumes:
      - postgres-data:/var/lib/postgresql

  # The migration plane (ADR 0026). A separate service from `postgres` because
  # it is a separate authority: dbmate connects as `migration_user`, which holds
  # LOGIN and NOINHERIT and none of SUPERUSER, CREATEDB, CREATEROLE, REPLICATION
  # or BYPASSRLS, and reaches owner authority only by an explicit membership it
  # must SET into.
  #
  # The flag positions below are measured, not guessed. In dbmate 2.34.1
  # `--migrations-dir`, `--migrations-table`, `--no-dump-schema` and `--env-file`
  # are GLOBAL and must precede the subcommand, while `--strict` is
  # subcommand-only and exists on `up` and `migrate` but not on `status`. A flag
  # in the wrong position exits 2 with "flag provided but not defined"; a global
  # flag silently omitted writes the ledger somewhere else entirely.
  #
  # No connection string here, and none anywhere a process can be listed. The
  # URL is assembled inside the container, by the entrypoint below, from three
  # derived identifiers Compose interpolates and one password read out of a
  # mounted file. Nothing that carries the password appears in compose.env, in
  # the resolved model, in `docker inspect`, or in argv on either side of the
  # daemon -- which is what `--env NAME` was always for, and what nothing was
  # supplying until Session 3's Run 7 (D60).
  #
  # The URL is assembled rather than stored whole. A stored URL embeds a role
  # name, a host and a database name that `naming.py` also derives; when the two
  # drift, the cluster answers "password authentication failed", which is the
  # one error nobody debugs by re-reading a manifest.
  #
  # `exec` matters: without it dbmate runs as a child of the shell and the
  # container's exit status is the shell's. `"$@"` carries the subcommand
  # bin/migrate.sh appends, so this list is the whole of what can be run here.
  dbmate:
    image: ${DBMATE_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [migration]
    restart: "no"
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Identifiers, all three. `sslmode=disable` is honest rather than lax: this
    # connection crosses a Docker network declared `internal: true`, which has
    # no route off the host, and the cluster serves no TLS certificate for any
    # peer to verify. A `require` that cannot be satisfied would either fail or
    # be silently downgraded, and neither is better than saying what this is.
    environment:
      APG_MIGRATION_ROLE: ${MIGRATION_ROLE_NAME:?required}
      APG_DATABASE_NAME: ${POSTGRES_DATABASE_NAME:?required}
      APG_MIGRATIONS_TABLE: ${MIGRATIONS_TABLE:?required}
    # Unbraced shell references throughout, and not for style. The braced
    # escaped form is a literal Compose never interpolates, but it is
    # indistinguishable from a real required interpolation to anything reading
    # this file with a regex -- including test_every_interpolation_is_required,
    # which exists to catch a bare one that would render empty. A form that
    # cannot be confused for the thing being forbidden is worth the braces.
    # Every byte of the password percent-encoded, not just the ones that look
    # dangerous. Measured: a base64 credential containing `/` parsed as a path
    # separator and dbmate reported `invalid port` -- a message that names
    # neither the password nor the file it came from. Encoding the whole value
    # is total: it cannot be wrong for an input nobody thought of, and the
    # provider chooses this value, not this repository.
    #
    # `$(cat ...)` strips trailing newlines and nothing else, which is exactly
    # what bin/postgres-bootstrap.py's `.rstrip("\n")` does to the same file.
    # The two readings must agree byte for byte or the role is set to one value
    # and dbmate presents another.
    entrypoint:
      - /bin/sh
      - -c
      - >
        set -eu;
        raw="$$(cat /run/secrets/migration_user_password)";
        password="$$(printf %s "$$raw" | od -An -tx1 -v | tr -d ' \n' | sed 's/../%&/g')";
        APG_MIGRATION_DATABASE_URL="postgres://$$APG_MIGRATION_ROLE:$$password@postgres:5432/$$APG_DATABASE_NAME?sslmode=disable"
        exec /usr/local/bin/dbmate
        --env APG_MIGRATION_DATABASE_URL
        --migrations-dir /migrations
        --migrations-table "$$APG_MIGRATIONS_TABLE"
        --no-dump-schema
        "$$@"
      - dbmate
    command: [status]
    networks:
      - internal

  # Session 4's transaction pooler. Everything below that looks like hardening
  # is a requirement with a test behind it.
  #
  # `user: "70:70"` is the pooler image's own uid/gid, measured against the
  # locked digest in Run 1 -- a third number after the cluster's 999 and Session
  # 2's 65532. Unlike the cluster image this one sets a default user, so the
  # process never runs as root and there is no window in which it could fix up a
  # file's ownership. secrets.required.yaml names the same two numbers and
  # tests/contract/test_secret_contract.py cross-checks them.
  #
  # No `ports` here. Session 4 publishes a host-loopback port, but a publication
  # is written only into the root-owned runtime override, never into this file:
  # a repository that could publish a database port would be one clone away from
  # publishing one (ADR 0040).
  #
  # `/etc/pgbouncer` is a tmpfs, and that is load-bearing rather than tidy. The
  # user list contains a plaintext credential, and this is the mount that keeps
  # it off every persistent path -- the image ships a world-readable
  # `userlist.txt` in that directory, so without the tmpfs the entrypoint would
  # be writing a secret into an image layer's directory on the container
  # filesystem.
  #
  # WHAT WAS MEASURED, because two plausible answers here are wrong:
  #
  #   * A plaintext user list under `auth_type = scram-sha-256` authenticates
  #     the client AND lets the pooler log in upstream: the cluster records
  #     `method=scram-sha-256` for the pooler's own connection. Storing the
  #     server's SCRAM verifier instead also works, and is unavailable to us --
  #     it can only be read from the cluster, which means the role must already
  #     exist, and this file has to work on the run that creates it.
  #   * The pooler logs `could not open auth_file ... Permission denied` as an
  #     ERROR and then GOES ON LISTENING. It comes up, it accepts connections,
  #     and it refuses every one of them. Nothing about a listening port
  #     distinguishes a working pooler from that one, which is why the health
  #     check in Run 4 authenticates rather than connects.
  #
  # The entrypoint follows dbmate's pattern for the same reason: the credential
  # is read from a mounted file inside the container and never becomes an
  # environment variable, a Compose interpolation, or an argument. `docker
  # inspect` on this container shows identifiers and nothing else.
  #
  # `umask 077` before anything is written, rather than a chmod afterwards: a
  # chmod leaves a window in which the file exists at the default mode, and the
  # window is only short, not absent.
  #
  # `server_reset_query_always = 1` IS LOAD-BEARING, and Run 9 measured what its
  # absence costs. PgBouncer runs `server_reset_query` only in SESSION pooling
  # unless this is set: in transaction mode it assumes an application leaves no
  # session state behind. A client that ran `set_config('apg.leak_probe', ...,
  # false)` and disconnected left that GUC on the server connection, and the
  # NEXT CLIENT read it back (D116). A transaction-local claim vanishes at
  # commit on its own, so the dangerous half is exactly the half nothing was
  # cleaning up -- and `SET ROLE`, `search_path` and a session GUC all travel
  # the same way. SEC-DBX-003 is the proof, and it went red here before it went
  # green.
  pgbouncer:
    image: ${PGBOUNCER_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [session4]
    restart: "on-failure:5"
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    tmpfs:
      - /etc/pgbouncer:rw,mode=0700,uid=70,gid=70
      - /tmp:rw,mode=0700,uid=70,gid=70
    environment:
      APG_POOL_LISTEN_PORT: ${PGBOUNCER_LISTEN_PORT:?required}
      APG_CLUSTER_HOST: ${POSTGRES_SERVICE_HOST:?required}
      APG_DATABASE_NAME: ${POSTGRES_DATABASE_NAME:?required}
      APG_APP_RUNTIME_ROLE: ${APP_RUNTIME_ROLE_NAME:?required}
      APG_POOL_ADMIN_USER: ${PGBOUNCER_ADMIN_USER:?required}
      APG_POOL_MODE: ${PGBOUNCER_POOL_MODE:?required}
      APG_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:?required}
      APG_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:?required}
      APG_MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS:?required}
      APG_QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:?required}
      APG_IDLE_TRANSACTION_TIMEOUT: ${PGBOUNCER_IDLE_TRANSACTION_TIMEOUT:?required}
      APG_SERVER_LIFETIME: ${PGBOUNCER_SERVER_LIFETIME:?required}
    # Unbraced `$$` throughout, matching dbmate: the braced escaped form is a
    # literal Compose never interpolates, but it is indistinguishable from a
    # real required interpolation to anything reading this file with a regex.
    entrypoint:
      - /bin/sh
      - -c
      - >
        set -eu;
        umask 077;
        app_password="$$(cat /run/secrets/app_runtime_password)";
        admin_password="$$(cat /run/secrets/pgbouncer_admin_password)";
        printf '"%s" "%s"\n"%s" "%s"\n'
        "$$APG_APP_RUNTIME_ROLE" "$$app_password"
        "$$APG_POOL_ADMIN_USER" "$$admin_password"
        > /etc/pgbouncer/userlist.txt;
        printf '127.0.0.1:%s:pgbouncer:%s:%s\n'
        "$$APG_POOL_LISTEN_PORT" "$$APG_POOL_ADMIN_USER" "$$admin_password"
        > /etc/pgbouncer/.pgpass;
        unset app_password admin_password;
        printf '%s\n'
        "[databases]"
        "$$APG_DATABASE_NAME = host=$$APG_CLUSTER_HOST port=5432 dbname=$$APG_DATABASE_NAME"
        ""
        "[pgbouncer]"
        "listen_addr = 0.0.0.0"
        "listen_port = $$APG_POOL_LISTEN_PORT"
        "auth_type = scram-sha-256"
        "auth_file = /etc/pgbouncer/userlist.txt"
        "admin_users = $$APG_POOL_ADMIN_USER"
        "pool_mode = $$APG_POOL_MODE"
        "default_pool_size = $$APG_POOL_SIZE"
        "max_client_conn = $$APG_MAX_CLIENT_CONN"
        "max_prepared_statements = $$APG_MAX_PREPARED_STATEMENTS"
        "query_wait_timeout = $$APG_QUERY_WAIT_TIMEOUT"
        "idle_transaction_timeout = $$APG_IDLE_TRANSACTION_TIMEOUT"
        "server_lifetime = $$APG_SERVER_LIFETIME"
        "server_reset_query = DISCARD ALL"
        "server_reset_query_always = 1"
        "ignore_startup_parameters = extra_float_digits"
        "log_connections = 1"
        "log_disconnections = 1"
        > /etc/pgbouncer/pgbouncer.ini;
        exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini
    # WHAT THIS CHECK CAN AND CANNOT PROVE, because the ordering decides it.
    #
    # `project-runtime.sh up` runs `compose up --wait` and THEN the deploy runs
    # postgres-bootstrap, which is what creates the application role. So at the
    # moment this check first runs, on a first deploy, that role does not exist.
    # A check that connected as it would fail `--wait` and take the deploy down
    # with it -- so the backend round-trip belongs to the client proofs, which
    # run after bootstrap, and not here.
    #
    # What it does prove is the failure Run 3 measured, which nothing else
    # catches: the pooler logs `could not open auth_file ... Permission denied`
    # as an ERROR and then GOES ON LISTENING. It comes up, accepts connections,
    # and refuses every one. A port check calls that healthy. Authenticating to
    # the admin console proves the user list was assembled AND is readable by
    # uid 70, which is the whole of that failure.
    #
    # Then it reads the pool mode and the prepared-statement setting back out of
    # the running daemon rather than out of the file that was meant to produce
    # them -- a rendered ini nobody loaded is exactly the kind of value that
    # looks measured and is not.
    #
    # The credential reaches psql through PGPASSFILE -- a 0600 file the
    # entrypoint wrote into the same tmpfs -- rather than through the password
    # environment variable libpq also accepts. Two reasons, and the first is not
    # the obvious one:
    #
    #   * a password passed in a process's environment is readable at
    #     /proc/<pid>/environ by the same user, and every process in this
    #     container is the same user;
    #   * Session 3 banned that variable's name from this model outright, on the
    #     grounds that nothing here had a use for one. Narrowing that ban to
    #     "only when read from a file" would have been a weakening dressed as a
    #     refinement, and `test_no_database_credential_appears_in_the_model_or_the_env`
    #     would have had to be edited to allow it. A pgpass file needs no
    #     exception at all, which is why it is the better answer and not merely
    #     the permitted one.
    #
    # `docker inspect` stores this check's OUTPUT as well as its command, so the
    # awk prints nothing and the whole verdict is its exit status.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          PGPASSFILE=/etc/pgbouncer/.pgpass
          psql -h 127.0.0.1 -p "$$APG_POOL_LISTEN_PORT" -U "$$APG_POOL_ADMIN_USER"
          -d pgbouncer -w -X -qtA -c 'SHOW CONFIG' 2>/dev/null
          | awk -F'|' '
              $$1 == "pool_mode" && $$2 == "transaction" { mode = 1 }
              $$1 == "max_prepared_statements" && $$2 + 0 > 0 { prepared = 1 }
              END { exit !(mode && prepared) }'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # `internal` only, no Traefik label of any kind. The pooler is reached from
    # this project's own services and, once the runtime override publishes one,
    # from a host-loopback port -- never across the edge network.
    networks:
      - internal

  # Session 4's client compatibility fixtures (DBX-001..005).
  #
  # `session4-verify`, not `session4`, and the distinction is the same one
  # `secret-check` draws: `bin/project-runtime.sh::session_profiles` selects
  # `session2..N`, so nothing here starts with a deploy. These are one-shot
  # proofs that are run deliberately, `restart: "no"`, and a project running
  # them continuously would be a project holding four extra connections against
  # a budget the cluster computed for services that do work.
  #
  # Each is a declared consumer of app_runtime_password, so each gets its own
  # materialized copy at its own uid. That is four more files a rotation has to
  # reach, and secrets.required.yaml records why it is still the right shape:
  # a shared mount would break the property the per-consumer layout exists for.
  #
  # THE CREDENTIAL NEVER BECOMES AN ENVIRONMENT VARIABLE. Three of the four read
  # the mounted file and write a 0600 pgpass into their own tmpfs, which libpq
  # and node-postgres both honour through PGPASSFILE. Prisma is the exception
  # and is handled the way dbmate was (ADR 0034): it builds a URL at run time,
  # inside the container, from the same file.
  client-psql:
    build:
      context: ./services/clients/psql
      args:
        BASE_IMAGE: ${PGBOUNCER_IMAGE:?required}
    profiles: [session4-verify]
    restart: "no"
    read_only: true
    tmpfs: [/tmp:rw,mode=0700,uid=65532,gid=65532]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    # Both transports, in one container. DBX-003 is a claim about the same role
    # over two ports, and running it twice from one process tree is what makes
    # a difference between them attributable to the transport.
    environment:
      APG_POOLED_HOST: ${PGBOUNCER_SERVICE_HOST:?required}
      APG_POOLED_PORT: ${PGBOUNCER_LISTEN_PORT:?required}
      APG_DIRECT_HOST: ${POSTGRES_SERVICE_HOST:?required}
      APG_DIRECT_PORT: "5432"
      PGUSER: ${APP_RUNTIME_ROLE_NAME:?required}
      PGDATABASE: ${POSTGRES_DATABASE_NAME:?required}
      PGSSLMODE: disable
      APG_USER_A: ${APG_FIXTURE_USER_A:?required}
      APG_USER_B: ${APG_FIXTURE_USER_B:?required}
    networks:
      - internal

  client-node-pg:
    build:
      context: ./services/clients/node-pg
      args:
        BASE_IMAGE: ${NODE_RUNTIME_IMAGE:?required}
    profiles: [session4-verify]
    restart: "no"
    read_only: true
    tmpfs: [/tmp:rw,mode=0700,uid=65532,gid=65532]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    environment:
      PGHOST: ${PGBOUNCER_SERVICE_HOST:?required}
      PGPORT: ${PGBOUNCER_LISTEN_PORT:?required}
      PGUSER: ${APP_RUNTIME_ROLE_NAME:?required}
      PGDATABASE: ${POSTGRES_DATABASE_NAME:?required}
      PGSSLMODE: disable
      APG_TRANSPORT: pooled
      APG_USER_A: ${APG_FIXTURE_USER_A:?required}
      APG_USER_B: ${APG_FIXTURE_USER_B:?required}
    networks:
      - internal

  client-psycopg:
    build:
      context: ./services/clients/psycopg
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [session4-verify]
    restart: "no"
    read_only: true
    tmpfs: [/tmp:rw,mode=0700,uid=65532,gid=65532]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    environment:
      PGHOST: ${PGBOUNCER_SERVICE_HOST:?required}
      PGPORT: ${PGBOUNCER_LISTEN_PORT:?required}
      PGUSER: ${APP_RUNTIME_ROLE_NAME:?required}
      PGDATABASE: ${POSTGRES_DATABASE_NAME:?required}
      PGSSLMODE: disable
      APG_TRANSPORT: pooled
      APG_USER_A: ${APG_FIXTURE_USER_A:?required}
      APG_USER_B: ${APG_FIXTURE_USER_B:?required}
    networks:
      - internal

  # One image, two modes. `client` is the default because it is the claim this
  # service can make without any privileged setup; `migrate` needs the
  # disposable schema to exist and is run by the Session 4 gate after the
  # privileged half has created and recorded it (plan §4.4).
  client-prisma:
    build:
      context: ./services/clients/prisma
      args:
        BASE_IMAGE: ${NODE_RUNTIME_IMAGE:?required}
    profiles: [session4-verify]
    restart: "no"
    read_only: true
    tmpfs: [/tmp:rw,mode=0700,uid=65532,gid=65532]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    command: [client]
    environment:
      PGHOST: ${PGBOUNCER_SERVICE_HOST:?required}
      PGPORT: ${PGBOUNCER_LISTEN_PORT:?required}
      PGUSER: ${APP_RUNTIME_ROLE_NAME:?required}
      PGDATABASE: ${POSTGRES_DATABASE_NAME:?required}
      PGSSLMODE: disable
      APG_TRANSPORT: pooled
      APG_USER_A: ${APG_FIXTURE_USER_A:?required}
      APG_USER_B: ${APG_FIXTURE_USER_B:?required}
      # Only the migrate mode reads these three. Present unconditionally
      # because a service whose environment depended on its command would be
      # two services wearing one name, and `docker inspect` would show a
      # different answer depending on when it was asked.
      APG_MIGRATION_ROLE: ${MIGRATION_ROLE_NAME:?required}
      APG_POOLED_HOST: ${PGBOUNCER_SERVICE_HOST:?required}
      APG_POOLED_PORT: ${PGBOUNCER_LISTEN_PORT:?required}
      APG_DIRECT_HOST: ${POSTGRES_SERVICE_HOST:?required}
      APG_DIRECT_PORT: "5432"
      APG_DISPOSABLE_SCHEMA: ${APG_DISPOSABLE_SCHEMA:?required}
    networks:
      - internal

networks:
  edge:
    name: ${EDGE_NETWORK_NAME:?required}
  internal:
    name: ${INTERNAL_NETWORK_NAME:?required}
    # No route off the host. Product services attach here; only Traefik will
    # ever straddle both networks.
    internal: true

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:?required}
