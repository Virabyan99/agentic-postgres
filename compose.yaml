# Validation-only Compose model (runbook §7).
#
# Session 1 starts nothing. This file exists so that the resource names in
# outputs.json can be proven to match what Docker would actually create, and so
# that later sessions extend a model that already interpolates from the lock
# rather than from whatever happens to be in the operator's environment.
#
# Every value is `${VAR:?required}`. That is deliberate: an unset variable
# fails `docker compose config` loudly instead of silently rendering an empty
# name, which would collapse two projects onto one resource.
#
# Resource names are set explicitly rather than left to Compose's
# `{project}_{name}` convention, so the names here are byte-identical to the
# ones in outputs.json.
#
# Do not use `container_name`: it is not project-scoped and would collide
# across two deployments on the same host.
#
# Invoke only through bin/compose.sh. Calling `docker compose` directly lets
# inherited environment variables win over --env-file, which is the exact
# override this repository is built to prevent.

name: ${COMPOSE_PROJECT_NAME:?required}

services:
  # Profile-gated so it is never part of the default set. It exists to give the
  # model a service to validate; the Session 1 gate renders the model and never
  # starts this container.
  contract-probe:
    image: ${PYTHON_RUNTIME_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [contract]
    command: ["python", "--version"]
    restart: "no"
    # The probe attaches to both networks and mounts the volume purely so that
    # all four resource names appear in `docker compose config` output.
    # Compose prunes top-level networks and volumes that no service
    # references, so a probe attached only to `internal` would leave the edge
    # network and the volume unrenderable -- and runbook §12's "Compose has
    # explicit actual resource names matching outputs" would be unverifiable.
    # This container is never started; see bin/compose.sh.
    networks:
      - edge
      - internal
    # Mounted where `postgres` mounts it, not at the pre-18 `/data` path. The
    # probe never starts, so nothing here breaks either way -- but this is the
    # only other mount target in the repository, and a wrong example is how the
    # wrong path gets copied into the service that does start. See D53.
    volumes:
      - postgres-data:/var/lib/postgresql

  # Session 2's public HTTPS target. Deliberately trivial: it exists so that
  # "Traefik routes this project, with a trusted certificate, and returns this
  # project's identity" is a measurable claim before any application service.
  #
  # It carries the identity labels and the network hint, but NOT
  # `traefik.enable`, and NOT the router or service labels. Two reasons:
  #
  #   1. The router labels' *keys* contain the router name
  #      (traefik.http.routers.<name>.rule). Interpolation inside a label key is
  #      not portable to the Compose version floor, so the renderer emits fully
  #      formed keys into the root-owned runtime override instead (ADR 0013).
  #   2. Without `traefik.enable`, this model on its own is inert to Traefik.
  #      Exposure becomes a deliberate act of deployment rather than a property
  #      of a file in the repository.
  edge-probe:
    build:
      context: ./services/edge-probe
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [session2]
    restart: "on-failure:5"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    environment:
      PROJECT_KEY: ${PROJECT_KEY:?required}
    # No `ports`. Only Traefik publishes a host port, and the acceptance suite
    # asserts that against the resolved model, not against this comment.
    networks:
      - edge
    labels:
      apg.traefik.scope: managed
      apg.project.key: ${PROJECT_KEY:?required}
      apg.environment: ${PROJECT_ENVIRONMENT:?required}
      traefik.docker.network: ${EDGE_NETWORK_NAME:?required}

  # The control for DEP-EDGE-002. Same network, same project, no labels at all.
  # If the public route can reach this, discovery is not actually constrained
  # and `exposedByDefault=false` is not doing what it claims.
  unlabeled-probe:
    build:
      context: ./services/edge-probe
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [isolation-test]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    environment:
      PROJECT_KEY: ${PROJECT_KEY:?required}
    networks:
      - edge

  # One-shot proof that secret materialization reached this container, and only
  # this container. The `secrets:` grant and the top-level secrets block are NOT
  # here: the source path is an immutable generation directory whose identifier
  # does not exist until materialization runs, so the runtime override supplies
  # them. What lives here is the `user:` the secret files must be owned by, so
  # that secrets.required.yaml and the service contract can be cross-checked
  # from source (tests/contract/test_secret_contract.py).
  secret-check:
    build:
      context: ./services/secret-check
      args:
        BASE_IMAGE: ${PYTHON_RUNTIME_IMAGE:?required}
    profiles: [session2-verify]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    networks:
      - internal

  # Session 3's cluster. Everything here that looks like hardening is a
  # requirement with a test behind it, not a precaution:
  #
  #   * `internal` only, no `ports`, no Traefik label of any kind -- DBX-PG-002.
  #     The internal network is `internal: true`, so this has no route off the
  #     host at all; SEC-NET-001's external scan of 5432 measures a firewall
  #     from Session 3 on rather than measuring an absence.
  #   * the volume mounts at `/var/lib/postgresql`, which is what the image
  #     declares as its VOLUME -- NOT at PGDATA (`/var/lib/postgresql/18/docker`)
  #     and not at the pre-18 `/var/lib/postgresql/data`. All three were
  #     measured: the pre-18 path makes the image refuse to start, and mounting
  #     at PGDATA works while silently leaving an anonymous volume on the
  #     parent. Two of the three persist data, so "the row survived" is not the
  #     property that distinguishes them. See D53.
  #   * `user: "999:999"` is the image's own postgres uid/gid, measured rather
  #     than assumed -- it is not the 65532 the Session 2 services use. Running
  #     as that user directly rather than letting the entrypoint gosu down from
  #     root also leaves PGDATA owned `999:999` instead of `999:0`.
  #     secrets.required.yaml must name the same numbers, and
  #     tests/contract/test_secret_contract.py cross-checks the two.
  #   * `shm_size` exceeds `shared_buffers`. PostgreSQL's dynamic shared memory
  #     for parallel query lands in /dev/shm, and Docker's default is 64 MiB.
  #   * `mem_limit` is deliberately larger than the manifest's unreclaimable
  #     budget. A container limit caps page cache too; set at the budget, the
  #     cluster runs in permanent reclaim and never says why it is slow.
  #
  # No `container_name`. The model's standing rule holds and the name Compose
  # derives is recorded in outputs.json instead; Run 8 compares that against the
  # container actually running.
  postgres:
    image: ${POSTGRES_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [session3]
    restart: "on-failure:5"
    user: "999:999"
    stop_grace_period: 1m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:?required}
    shm_size: ${POSTGRES_SHM_SIZE:?required}
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME:?required}
      POSTGRES_USER: postgres
      # The value never appears here, in compose.env, or in any process
      # argument. The entrypoint's own file_env reads the path.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_init_superuser_password
      # Locale and checksums are initdb-time and cannot be changed afterwards
      # without a dump and reload, which is why they are pinned at the model
      # rather than left to whatever the image defaults to this year.
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:?required}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:?required}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:?required}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:?required}
      # Listening on every interface inside a network with no route off the
      # host. The boundary is the network and the absence of a published port,
      # not a bind address -- binding to localhost would also make the cluster
      # unreachable from its own project's services.
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DATABASE_NAME:?required} -q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal
    volumes:
      - postgres-data:/var/lib/postgresql

  # The migration plane (ADR 0026). A separate service from `postgres` because
  # it is a separate authority: dbmate connects as `migration_user`, which holds
  # LOGIN and NOINHERIT and none of SUPERUSER, CREATEDB, CREATEROLE, REPLICATION
  # or BYPASSRLS, and reaches owner authority only by an explicit membership it
  # must SET into.
  #
  # The flag positions below are measured, not guessed. In dbmate 2.34.1
  # `--migrations-dir`, `--migrations-table`, `--no-dump-schema` and `--env-file`
  # are GLOBAL and must precede the subcommand, while `--strict` is
  # subcommand-only and exists on `up` and `migrate` but not on `status`. A flag
  # in the wrong position exits 2 with "flag provided but not defined"; a global
  # flag silently omitted writes the ledger somewhere else entirely.
  #
  # No connection string here. `--env` names an environment variable that the
  # runtime override supplies from a secret file, so the URL -- which carries a
  # password -- never enters compose.env, the model, or a process argument.
  dbmate:
    image: ${DBMATE_IMAGE:?required}
    platform: ${TARGET_PLATFORM:?required}
    profiles: [migration]
    restart: "no"
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["/usr/local/bin/dbmate"]
    command:
      - --env
      - APG_MIGRATION_DATABASE_URL
      - --migrations-dir
      - /migrations
      - --migrations-table
      - ${MIGRATIONS_TABLE:?required}
      - --no-dump-schema
      - status
    networks:
      - internal

networks:
  edge:
    name: ${EDGE_NETWORK_NAME:?required}
  internal:
    name: ${INTERNAL_NETWORK_NAME:?required}
    # No route off the host. Product services attach here; only Traefik will
    # ever straddle both networks.
    internal: true

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:?required}
