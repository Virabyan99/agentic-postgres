# Human-selected version candidates.
#
# This file is edited by people. `versions.env` is generated from it by
# `bin/lock-versions.sh --update`, which resolves each image reference to an
# immutable digest for the declared target platform. Never edit versions.env
# by hand.
#
# Repositories are fully qualified (docker.io/...) on purpose. An unqualified
# name resolves through the client's configured registry list, which is not a
# property of this repository, so the same lock file could mean different
# images on different machines.

lock_format: 2

# Every image is resolved for exactly this platform. If a digest cannot be
# resolved for it, the session is blocked; a floating tag is not a substitute.
target_platform: linux/amd64

python:
  # Must match .python-version. `--update` copies this through verbatim; it
  # involves no registry call.
  version: "3.12.13"

compose:
  # Expressed as a floor, not an equality. The runbook says "Compose v2"; the
  # development machine runs v5.1.3, and a literal v2 check would reject it.
  minimum_version: "2.24.0"

# First-party application images do not exist yet. Session 1 locks the base
# images and package inputs they will be built from. Their own digests become
# mandatory when those images are built, before release.
images:
  POSTGRES_IMAGE: docker.io/pgvector/pgvector:pg18
  TRAEFIK_IMAGE: docker.io/library/traefik:v3.7
  # Session 2. Traefik never mounts the Docker socket; it reads the Docker
  # provider through this proxy over the host-scoped control network, with every
  # write-capable API section explicitly disabled (ADR 0009).
  #
  # This narrows Traefik's Docker API authority. It is not an absolute host
  # boundary -- the proxy process itself still has the socket mounted -- and the
  # threat model says so rather than implying otherwise.
  DOCKER_SOCKET_PROXY_IMAGE: docker.io/tecnativa/docker-socket-proxy:0.3.0
  # Session 4 kept this candidate rather than bumping it (D85). The runbook
  # called 1.25.2 "the minimum accepted security baseline" on the strength of a
  # changelog; ADR 0019 is the standing lesson about version claims read from
  # documentation. What was measured against this digest instead:
  #
  #   PgBouncer 1.24.1, psql and pg_isready present (17.5), uid/gid 70, and a
  #   protocol-level named prepared statement reusable after an *observed*
  #   backend change with max_prepared_statements = 100 -- and unusable across
  #   the same change with 0, which is what proves the first result is the
  #   pooler working rather than the client landing on the same backend.
  #
  # Every behaviour Session 4 needs is present. Bump this when a measurement
  # asks for it, and re-measure the same three things when you do. The values
  # live in tests/contract/test_image_contracts.py, which is executable; no
  # PGBOUNCER_MINIMUM_VERSION floor is written here (D98).
  PGBOUNCER_IMAGE: docker.io/edoburu/pgbouncer:v1.24.1-p1
  # Session 5 bumped this from v13.0.4, and the reason is a measurement rather
  # than the runbook's assertion that 14.16 is required (D127). Measured against
  # both digests, on Docker 29.5.2:
  #
  #   * The image is DISTROLESS. No shell, no wget, no curl -- `docker run
  #     --entrypoint sh` fails with "executable file not found". So a Compose
  #     healthcheck can be neither CMD-SHELL nor an HTTP probe; the only thing
  #     that can look from inside the container is the postgrest binary.
  #   * `postgrest --ready` exists in 14.16 and NOT in 13.0.4, whose CLI offers
  #     only --version, --example, --dump-config and --dump-schema. On 13.0.4
  #     there is no in-container probe at all, and every alternative is worse:
  #     add a shell to the image, or publish the admin port that is bound to
  #     container loopback precisely so nothing can reach it.
  #   * The rest of the delta is ONE key: `jwt-cache-max-lifetime` becomes
  #     `jwt-cache-max-entries`. Both versions dump exactly 40 keys.
  #   * `client-error-verbosity` -- which the runbook's own required baseline
  #     sets, and which its gate asserts -- exists in NEITHER version. It
  #     arrives in 16.0. The runbook asked the version it pins for a key that
  #     version does not have, which is ADR 0019's defect exactly (D144).
  #
  # And the thing to know before trusting the bump: `--ready` returned exit 0
  # while every request to the API returned 404, because it asks the admin
  # server about the pool and the schema cache and about nothing else. It is a
  # necessary probe and not a sufficient one (D145).
  #
  # `latest` is 16.0 today. Not adopted: two majors of unmeasured configuration
  # change, bought for one key this session mitigates in the error wrapper.
  POSTGREST_IMAGE: docker.io/postgrest/postgrest:v14.16
  # PGBACKREST_IMAGE was here from Session 1 to Session 10 and was referenced by
  # nothing -- no service, no script, no test. It is retired rather than wired
  # up, because the archiver has to live where `archive_command` runs and that
  # is the Postgres container (ADR 0144, D513). What replaces it is
  # `PGBACKREST_APT_VERSION` under `packages:`.
  #
  # It could not have been kept as a second reference either: PGDG does not
  # carry 2.55.1, so the pin and the installable version cannot be made equal,
  # and two pgBackRest versions in one lock is D201's shape -- the inert one is
  # what a reader quotes (D532).
  PYTHON_RUNTIME_IMAGE: docker.io/library/python:3.12-slim
  NODE_RUNTIME_IMAGE: docker.io/library/node:22-alpine
  INFISICAL_IMAGE: docker.io/infisical/cli:0.41.89
  DBMATE_IMAGE: docker.io/amacneil/dbmate:2.34.1
  # Session 14. The per-project metrics surface's backend (ADR 0164).
  #
  # **contrib, not the core distribution, and that is not a preference.** Both
  # the `prometheus` receiver and the `prometheus` exporter are contrib-only;
  # core carries the OTLP receiver and a debug exporter and neither can scrape
  # an upstream nor serve exposition. Measured cost of choosing contrib:
  # 31.1 MB anon against core's 14.3 MB, and a 103.6 MB image against 35.0 MB.
  #
  # What was measured against THIS digest, on the locked platform, before it was
  # written here -- and the explicit tag was confirmed to resolve to the same
  # digest as `latest` at the time, so the measurements are about the pin rather
  # than about whatever `latest` meant that afternoon:
  #
  #   * the `prometheus` exporter serves Prometheus exposition at `/metrics`
  #     with NO query parameters. That is the whole reason this is the route's
  #     backend rather than the store: Prometheus's and VictoriaMetrics'
  #     federation endpoints both require `match[]`, and Traefik has no
  #     middleware that can add a query string to a request.
  #   * `/` on the same port answers **404**, so the route needs no strip
  #     prefix and ADR 0087's rewrite has no counterpart here.
  #   * scraping a real Traefik it served 20,513 bytes carrying the project's
  #     `traefik_*` series; an otherwise identical collector whose scrape target
  #     does not resolve served 1,896 bytes carrying **none**. The control is
  #     what makes the first number mean "the project's metrics" rather than
  #     "something answered".
  #   * under a 128 MB container limit it held 31.1 MB anon and was not
  #     OOM-killed, while `memory.current` sat at exactly the cap because
  #     reclaimable cache expands to fill whatever it is given (ADR 0165).
  #
  # Re-measure those four when this version moves. The first two are the ones
  # that would silently take the route away.
  OTEL_COLLECTOR_IMAGE: docker.io/otel/opentelemetry-collector-contrib:0.159.0

  # Session 14 Run 5's store, and the thing that EVALUATES a rule. The collector
  # serves exposition and cannot evaluate anything -- an alert needs a range over
  # time, so `OPS-ALERT-001` needs a store or it needs nothing.
  #
  # **Prometheus rather than VictoriaMetrics, on Run 1's measured numbers rather
  # than on reputation** (D770). Bounded against a real scrape target with
  # ingestion confirmed at both ends: Prometheus **21.2 MB anon** (peak 37.4),
  # VictoriaMetrics **45.6** (48.2). The reputation inverts under measurement --
  # VictoriaMetrics has the far smaller image (17.5 MB against 104.3) and twice
  # the resident set, and on a swapless host the resident set is the number that
  # decides an OOM. It also evaluates rules natively, where VictoriaMetrics needs
  # `vmalert` as a second container: half the memory and one fewer component.
  #
  # An explicit container memory limit is not optional here (ADR 0165) and the
  # figure above is what it is sized against.
  #
  # Measured at this version, with a control in each case:
  #   * a rule set is SILENT on a healthy deployment -- and the store was proved
  #     to be ingesting before that silence was read, because a quiet rule set
  #     over an empty store is the false quiet half;
  #   * `up` goes to **0, not absent**, when a configured target stops. So
  #     `up == 0` and `absent(up)` answer different questions and both are
  #     needed -- measured, not assumed, and the assumption was backwards.
  #
  # Re-measure both when this version moves. A store that silently stopped
  # evaluating would leave every rule quiet, which is what a healthy deployment
  # looks like.
  PROMETHEUS_IMAGE: docker.io/prom/prometheus:v3.7.3

# Minimum versions required for a *feature*, not for an image.
#
# Each key `X_MINIMUM_VERSION` pairs with the image `X_IMAGE`: `--update`
# records the resolved semantic version as `X_VERSION`, and the offline
# `--check` asserts `X_VERSION >= X_MINIMUM_VERSION`.
#
# This is a floor, not a proof. A digest cannot tell you what a configuration
# key does -- and the previous floor here is what that costs when it goes
# unchecked: it claimed to guarantee `accessLog.fields.queryParameters`, a key
# that does not exist in any Traefik version (ADR 0019). The floor was real, the
# feature was not, and nothing offline could tell the difference.
#
# A floor is therefore only written here for behaviour that has been observed
# against the image, never for behaviour read from documentation.
feature_floors:
  # Traefik 3.5 and earlier ask the Docker daemon for API v1.24. Docker 29
  # reports minAPI 1.40 and answers 400 to anything older, so the Docker
  # provider never loads and no project route is ever discovered -- the edge
  # comes up healthy and routes nothing.
  #
  # Measured, not read: v3.5 fails and v3.6 works against a Docker 29 daemon,
  # over the socket proxy and over the raw socket alike.
  TRAEFIK_MINIMUM_VERSION: "3.6"

# Package versions. Each entry names its registry and the package as that
# registry spells it, so `--update` can dereference it the way it dereferences
# an image -- and record the digest of the artifact it found (ADR 0077).
#
# Before Session 6 this was `NAME: "version"`, a string nothing resolved. That
# is how `SCALAR_VERSION: "1.36.4"` sat here for four sessions naming a release
# that has never existed (D201): a lock verifies what it can dereference, and
# everything else in it is a comment with a colon in it.
#
# `--check` stays offline. What it verifies is that every entry carries a digest
# `--update` could only have obtained by finding a real artifact.
packages:
  # Session 1, and Run 7 is where D239 said the decision would be made: the run
  # where the service exists and can be RUN against a version rather than
  # assigned one. It stays at 0.121.2, and now for a measured reason rather
  # than for D37's default.
  #
  # Measured in Run 7: the nine pinned versions co-resolve -- which is not what
  # Run 2 established, since Run 2 asked each registry "does this release
  # exist" one package at a time, and nine individually real versions can still
  # have no solution together. Installed as a set they resolve to starlette
  # 0.49.3 and pydantic 2.13.4, and the whole set imports. The control is Run
  # 7's own: pyjwt==2.13.999 fails the same resolver with "your requirements are
  # unsatisfiable".
  #
  # 0.141.1 is not adopted. Twenty minor releases is a real counter-argument and
  # it is recorded rather than dismissed -- but nothing this session needs is in
  # them, and the version that has now been built and run is this one.
  FASTAPI_VERSION:
    registry: pypi
    package: fastapi
    version: "0.121.2"
  # Session 8, Run 4, and the first version here that has ever been RUN. It sat
  # at 2.14.1 from Session 1 to Session 8 because nothing built from it -- which
  # is D201's condition exactly, and D201's outcome arrived too: measured
  # against the locked python:3.12-slim digest, `pip install fastmcp==2.14.1`
  # SUCCEEDS and `import fastmcp` then raises `ModuleNotFoundError: No module
  # named 'pydantic_settings'`. That is ADR 0083's distinction a second time --
  # "it installs" and "it imports" are two claims -- and the cause is worth the
  # sentence: fastmcp 2.14.1 declares `mcp>=1.24.0` with no ceiling, pip
  # resolves mcp 2.0.0, and mcp 2.0.0 no longer carries pydantic-settings, which
  # fastmcp 2.14.1 imports directly and never declared. Constrained to `mcp<2`
  # it imports fine. So the locked entry did not rot through anybody's change
  # here; it rotted because an upstream floor had no ceiling.
  #
  # 3.4.0 rather than 3.4.7 (`latest`) or 3.4.5 (the runbook's number), and the
  # boundary was bisected rather than assumed. fastmcp 3.4.1 moved
  # `fastmcp-slim[server]` to `starlette>=1.0.1`; fastapi 0.121.2 requires
  # `starlette<0.50.0,>=0.40.0`. Measured, one arm per patch release, with two
  # controls that discriminate (`3.4.7 + pydantic==1.10.0` -> CONFLICT,
  # `3.4.5` alone -> OK):
  #
  #   3.4.0 + fastapi 0.121.2 -> resolves      3.4.4 + fastapi 0.121.2 -> CONFLICT
  #   3.4.1 + fastapi 0.121.2 -> CONFLICT      3.4.5 + fastapi 0.121.2 -> CONFLICT
  #   3.4.2 + fastapi 0.121.2 -> CONFLICT      3.4.6 + fastapi 0.121.2 -> CONFLICT
  #   3.4.3 + fastapi 0.121.2 -> CONFLICT      3.4.7 + fastapi 0.121.2 -> CONFLICT
  #
  # and 3.4.0 installed for real -- not `--dry-run` -- alongside the entire
  # pinned set (fastapi, pydantic, pydantic-settings, uvicorn, pyjwt,
  # cryptography, psycopg[binary], psycopg-pool, argon2-cffi, boto3, botocore)
  # imports every one of them with `pip check` clean, resolving mcp 1.29.0 and
  # starlette 0.49.3.
  #
  # **That co-resolution is what makes ADR 0121's one-image model possible**, so
  # this number is not a preference. 3.4.1 or above would force a second image
  # for the agent plane, and a second image cannot import `LocalKeySet`, the
  # strict request parser or the error vocabulary -- which is the argument
  # `compose.yaml` already makes for running storage from the auth image.
  # Adopting `latest` instead would mean bumping fastapi to 0.141.1, an
  # unmeasured twenty-minor-release upgrade to the AUTH service, bought inside a
  # run about MCP. That is D321's mistake with a different package (ADR 0083),
  # and it is refused here for D321's reason.
  #
  # The protocol revision this framework implements is `2025-11-25`, read from
  # `mcp.types.LATEST_PROTOCOL_VERSION` and confirmed against a RUNNING server.
  # It is not written here: the runtime reads it from the framework at startup
  # (D406), and a copy in this file would be the second authority ADR 0077
  # exists to refuse.
  FASTMCP_VERSION:
    registry: pypi
    package: fastmcp
    version: "3.4.0"
  # Session 4 targets this major deliberately (D86). The runbook's fixture was
  # written for Prisma 7 -- prisma.config.ts, DIRECT_URL as the CLI datasource,
  # no `directUrl` datasource field -- which is a different configuration model,
  # not a newer version of this one. In 6.x `directUrl` exists and is exactly
  # the mechanism two transports need: the client through the pooler, migrate
  # through the direct endpoint. Bumping to 7 would be a fixture rewrite bought
  # with no measured need. The acceptance report names the configuration model
  # it tested, and a fixture may not straddle both.
  PRISMA_VERSION:
    registry: npm
    package: prisma
    version: "6.19.1"
  # Re-pinned in Session 5 Run 9a, because the previous value named a release
  # that does not exist (D201). `@scalar/api-reference` published 1.36.2 and
  # then 1.37.0; there has never been a 1.36.4, and no Scalar image carries the
  # tag either. It sat here for four sessions because nothing built from it and
  # because the lock resolved `images:` against a registry while a `packages:`
  # entry was a string nothing dereferenced. That is what ADR 0077 changes.
  #
  # 1.64.1 is `latest` at the time of measurement, chosen over 1.36.2 -- the
  # nearest real release to the old string -- because there is no intent to
  # honour: the old number was not a decision anybody made. Both were measured
  # and behave identically for the property that matters (D202): neither ships a
  # self-contained bundle, both name `fonts.scalar.com` and `proxy.scalar.com`
  # in `dist/browser/standalone.js`, and `withDefaultFonts` defaults to true in
  # both. The configuration and the CSP are what make the page self-contained
  # (ADR 0069), not the version.
  SCALAR_VERSION:
    registry: npm
    package: "@scalar/api-reference"
    version: "1.64.1"

  # ---------------------------------------------------------------------------
  # Session 6. The auth service's dependency set.
  #
  # Every version below was resolved against PyPI in Run 2 before it was written
  # here, with a control that reports a fictional version as absent -- because
  # the runbook supplied nine exact numbers with no provenance, which is D201's
  # defect one level up. All of them turned out to exist; that is a measurement
  # with an unremarkable result, not a reason to have skipped it.
  #
  # Measured at the same time, and the reason the interpreter does not move:
  # every one of these declares `requires_python >= 3.10` or looser at the
  # pinned version. Nothing in the set requires 3.13, so the repository's locked
  # 3.12.13 stands and the runbook's interpreter bump is not taken (D240).
  #
  # Also measured: none of these needs a build toolchain in the runtime image on
  # linux/amd64. The four named distributions are pure Python; their compiled
  # dependencies -- argon2-cffi-bindings, cryptography, cffi and psycopg-binary
  # -- all publish cp312/abi3 manylinux x86_64 wheels. That is a fact about the
  # transitive set, not the named one, and the first pass of the measurement got
  # it wrong by asking the named packages.
  #
  # This note originally ended "and psycopg-binary IF THE C SPEEDUPS ARE
  # WANTED", which Run 7 measured and found false (D257): without it psycopg
  # does not import at all on the locked base image. The conclusion above was
  # right and one clause inside it was a value that looked measured and was
  # not. It is corrected here rather than deleted, because the sentence is
  # otherwise the record of what Run 2 actually did.
  PYJWT_VERSION:
    registry: pypi
    package: pyjwt
    version: "2.13.0"
  # Recorded explicitly although `PyJWT[crypto]` introduces it transitively.
  # This is the library that verifies a signature; a version this repository
  # cannot name is a version it cannot reason about.
  CRYPTOGRAPHY_VERSION:
    registry: pypi
    package: cryptography
    version: "50.0.0"
  PYDANTIC_VERSION:
    registry: pypi
    package: pydantic
    version: "2.13.4"
  PYDANTIC_SETTINGS_VERSION:
    registry: pypi
    package: pydantic-settings
    version: "2.14.2"
  PSYCOPG_VERSION:
    registry: pypi
    package: psycopg
    version: "3.3.4"
  # Two more distributions, both found by measuring in Run 7 rather than by
  # reading, and both load-bearing.
  #
  # psycopg-binary carries the pq wrapper. The Session 6 note below used to
  # call it optional -- "psycopg-binary if the C speedups are wanted" -- and
  # that is wrong in the way this repository keeps producing. Measured against
  # the locked python:3.12-slim digest: the image ships NO libpq, no pg_config
  # and no compiler, and psycopg alone installs cleanly and then raises
  # "ImportError: no pq wrapper available" on the first import. Its three
  # implementations are psycopg_c (needs a compiler), psycopg_binary (this
  # wheel) and a pure-Python path that needs a system libpq; exactly one of the
  # three is reachable in that image. Not a speedup -- the difference between a
  # service that starts and one that does not (ADR 0083).
  #
  # psycopg-binary is deliberately NOT an entry here, and the reason is the
  # measurement rather than an omission (ADR 0083). It was written as one, and
  # --update refused it:
  #
  #   PSYCOPG_BINARY_VERSION: psycopg-binary 3.3.4 publishes 0 sdists; the lock
  #   records one canonical artifact per version and cannot choose
  #
  # Measured: psycopg-binary 3.3.4 publishes 55 artifacts and no sdist -- one
  # wheel per platform and ABI. Every other package in this file publishes
  # exactly one sdist and one wheel (pyjwt 2.13.0, as the control: 2 artifacts,
  # 1 sdist, 1 wheel). ADR 0077's model met the first distribution that does
  # not fit it.
  #
  # It does not need to fit. psycopg's own metadata declares
  # `psycopg-binary==3.3.4; extra == "binary"` -- an EXACT equality -- so the
  # binary's version is not a choice anybody here makes, and an entry for it
  # would be a second authority for a value psycopg already fixes. The image
  # installs `psycopg[binary]==${PSYCOPG_VERSION}` and the extra decides.
  #
  # The pool is the opposite case and that is why it is below. psycopg declares
  # `psycopg-pool; extra == "pool"` with NO version, so the pool's version is a
  # real choice -- and it is a different number, 3.3.1 against psycopg's 3.3.4.
  # A reader who assumed PSYCOPG_VERSION covered the pool would have pinned a
  # release that does not exist for that package, which is D201 arriving a
  # second time through a different door.
  PSYCOPG_POOL_VERSION:
    registry: pypi
    package: psycopg-pool
    version: "3.3.1"
  # The password hashing wrapper, and the least established entry in this file:
  # five releases in total. Its own metadata is what pins the backend --
  # `argon2-cffi<26,>=23.1.0` under the `argon2` extra -- so the entry below is
  # inside pwdlib's declared range rather than beside it. A wrapper and a backend
  # pinned independently is two authorities for one choice.
  PWDLIB_VERSION:
    registry: pypi
    package: pwdlib
    version: "0.3.0"
  ARGON2_CFFI_VERSION:
    registry: pypi
    package: argon2-cffi
    version: "25.1.0"
  UVICORN_VERSION:
    registry: pypi
    package: uvicorn
    version: "0.50.2"

  # ---------------------------------------------------------------------------
  # Session 14, Run 3. OpenTelemetry, adopted as a TRANSPORT for correlation
  # that already exists and is proved (ADR 0166, D763).
  #
  # **Two entries and not three, and the omission is the decision.** Measured
  # from the packages' own metadata rather than assumed:
  #
  #   exporter-otlp-proto-http 1.44.0 requires proto==1.44.0 and
  #     exporter-otlp-proto-common==1.44.0 EXACTLY, and sdk~=1.44.0 -- a range,
  #     so the sdk can still float within 1.44.x and needs its own pin.
  #   sdk 1.44.0 requires api==1.44.0 and semantic-conventions==0.65b0 EXACTLY.
  #
  # So pinning these two fixes all six. `opentelemetry-api` is deliberately NOT
  # an entry, for psycopg-binary's reason: something else already declares it
  # with an exact equality, and a second pin here would be a copy that can drift
  # from the copy that is actually enforced.
  #
  # Co-resolution was measured against the locked python:3.12-slim digest, with
  # the twelve versions this service already pins, because nine individually
  # real versions can still have no solution together (Session 6, Run 7). The
  # arms: the locked set alone resolves; the locked set plus these resolves; and
  # the CONTROL -- the locked set plus `pyjwt==2.13.999` -- fails with
  # ResolutionImpossible, which is what makes the first two mean anything.
  # Installed for real, the whole set imports.
  #
  # No instrumentation package is locked, and that is ADR 0166's decision rather
  # than an omission: they attach `http.url` to client spans as a matter of
  # course, and a URL is on the redaction canary's list.
  OTEL_SDK_VERSION:
    registry: pypi
    package: opentelemetry-sdk
    version: "1.44.0"
  OTEL_EXPORTER_OTLP_HTTP_VERSION:
    registry: pypi
    package: opentelemetry-exporter-otlp-proto-http
    version: "1.44.0"

  # ---------------------------------------------------------------------------
  # Session 7. The object-storage client.
  #
  # Measured against the locked python:3.12-slim digest before either number was
  # written here, because ADR 0083 is the standing reason "it installs" and "it
  # imports" are two claims: psycopg installed cleanly at the locked version and
  # then raised `ImportError: no pq wrapper available` on the first import, in
  # this exact image. Rig A, three arms:
  #
  #   * boto3 and botocore at 1.43.72 install and import here with no compiler
  #     and no system library. The transitive set is jmespath 1.1.0,
  #     python-dateutil 2.9.0.post0, s3transfer 0.19.2, six 1.17.0 and urllib3
  #     2.7.0 -- all pure Python, unlike Session 6's set, whose four named
  #     distributions pulled in four compiled ones.
  #   * A low-level s3 client constructs with an explicit endpoint, region
  #     `auto`, `s3v4`, bounded retries and explicit timeouts, and presigns a
  #     PUT carrying X-Amz-Algorithm and X-Amz-SignedHeaders.
  #   * CONTROL: botocore==1.43.999 is refused with "Could not find a version".
  #     Without that arm, "1.43.72 resolved" is a statement about the network.
  #
  # botocore is named for D258's reason and NOT for D258's evidence, and the
  # distinction is worth the sentence. psycopg-pool was a separate distribution
  # at a genuinely different number (3.3.1 against psycopg's 3.3.4), so a reader
  # who assumed one pin covered both would have named a release that does not
  # exist. Here the two move in lockstep and boto3 alone resolves botocore to
  # exactly 1.43.72 today -- measured, arm A3. What makes the second entry
  # load-bearing is that boto3 declares a RANGE, `botocore<1.44.0,>=1.43.72`,
  # not the exact equality psycopg declares for psycopg-binary. A range is a
  # choice somebody makes, and an unnamed choice is made by whoever runs pip on
  # whatever day they run it. That is the same reason psycopg-binary is
  # deliberately absent above: its version is fixed by an `==`, so an entry
  # would be a second authority for a value already decided.
  #
  # Both publish one sdist and one wheel, so ADR 0077's one-canonical-artifact
  # model dereferences them without the psycopg-binary problem.
  BOTO3_VERSION:
    registry: pypi
    package: boto3
    version: "1.43.72"
  BOTOCORE_VERSION:
    registry: pypi
    package: botocore
    version: "1.43.72"
  # Session 10, Run 4, and the first `apt` entry in this file (ADR 0144).
  #
  # pgBackRest goes INTO the Postgres image rather than beside it, because
  # `archive_command` is run by the postmaster in its own container. Run 1
  # measured both routes: a multi-stage COPY out of the old `PGBACKREST_IMAGE`
  # builds and will not load -- `libssh2.so.1: cannot open shared object file`,
  # since the Debian 12 base does not ship it -- and the PGDG install adds
  # exactly that library beside the package, two packages and 800,863 bytes on a
  # 158,801,932-byte base.
  #
  # `registry: apt` is new, and `index:` with it. A Debian archive has no
  # per-package endpoint the way PyPI and npm do, so the entry names the suite
  # index and the lock reads the SHA256 of one .deb out of it. Measured (rig2):
  # 1.1 MB gzipped, 4,310 stanzas, under a second, and both controls refuse -- a
  # version that does not exist and a package that does not exist each resolve
  # to nothing rather than to something plausible.
  #
  # **This pin expires, and that is accepted rather than unnoticed** (D533). A
  # PGDG suite drops superseded versions, so one day this resolves to nothing
  # and `--update` blocks with D201's message. That is the acceptable half: the
  # build fails closed and produces no image, which is not what a floating tag
  # does. The index offers 2.58.0, 2.59.0 and 2.59.1 today.
  #
  # The suite is `bookworm-pgdg` because the base image is Debian 12 -- read off
  # the running image, not assumed from the tag. If POSTGRES_IMAGE moves to a
  # new Debian release this index moves with it, and the build failing closed is
  # what makes that visible.
  # **THIS PIN HAS AN END DATE, and Session 13 Run 8 is where it was written
  # down** (D533).
  #
  # PGDG drops superseded versions from the index rather than keeping them, so
  # `2.59.1-1.pgdg12+1` will one day resolve to nothing and this image will fail
  # to build with exit 100 -- the same failure Run 1's control deliberately
  # produced at `pgbackrest=0.0.0-doesnotexist`. **That is the accepted half.**
  # It is a pin rather than a floating tag, and failing closed is what a pin is
  # for.
  #
  # What was missing is anybody knowing when. The index above is the answer:
  #
  #     curl -s <the index URL below> | zcat \
  #       | grep -A1 '^Package: pgbackrest$' | grep '^Version:'
  #
  # **Check it before any session that rebuilds this image**, and move the pin
  # deliberately if it has gone. A build failing closed because an upstream index
  # rotated is a bad moment to learn the pin was undiarised for four sessions.
  PGBACKREST_APT_VERSION:
    registry: apt
    package: pgbackrest
    version: "2.59.1-1.pgdg12+1"
    index: https://apt.postgresql.org/pub/repos/apt/dists/bookworm-pgdg/main/binary-amd64/Packages.gz

  # The trust store, and the image had none at all (D590).
  #
  # Measured: `ca-certificates` is NOT INSTALLED in the base, and it is in
  # neither pgbackrest's Depends nor its Recommends -- so `--no-install-recommends`
  # is innocent and no dependency would ever have pulled it in. With no
  # `/etc/ssl/certs/ca-certificates.crt`, pgBackRest reaches R2, completes the
  # TCP connection, and refuses the certificate:
  # `[095]: unable to verify certificate presented by
  # '<account>.r2.cloudflarestorage.com:443': [20] unable to get local issuer
  # certificate`.
  #
  # **A pinned trust store is a stale trust store, and that is accepted here
  # rather than glossed.** Everything else in this image is frozen -- the base by
  # digest, pgBackRest by version-and-digest -- so a floating CA set would be the
  # one unreproducible thing in a deliberately reproducible image. Bumping it is
  # a `--packages-only` update, which is the flag that exists so an apt pin can
  # move without re-adopting three unrelated rolling image tags (D540).
  #
  # **`bookworm-security`, not `bookworm`**, and that was measured rather than
  # assumed: the lock refused the first attempt because plain bookworm carries
  # only `20230311+deb12u1`. `apt-cache policy` puts the candidate in
  # debian-security, which is D201 working -- a version that cannot be resolved
  # is not locked by writing it down.
  #
  # A security suite drops superseded versions FASTER than pgdg does, so this pin
  # expires sooner than `PGBACKREST_APT_VERSION` and in the same way (D533). The
  # build fails closed when it does, which is the accepted half; nobody has
  # diarised either.
  CA_CERTIFICATES_APT_VERSION:
    registry: apt
    package: ca-certificates
    version: "20250419~deb12u1"
    index: http://deb.debian.org/debian-security/dists/bookworm-security/main/binary-amd64/Packages.xz
