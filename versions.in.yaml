# Human-selected version candidates.
#
# This file is edited by people. `versions.env` is generated from it by
# `bin/lock-versions.sh --update`, which resolves each image reference to an
# immutable digest for the declared target platform. Never edit versions.env
# by hand.
#
# Repositories are fully qualified (docker.io/...) on purpose. An unqualified
# name resolves through the client's configured registry list, which is not a
# property of this repository, so the same lock file could mean different
# images on different machines.

lock_format: 1

# Every image is resolved for exactly this platform. If a digest cannot be
# resolved for it, the session is blocked; a floating tag is not a substitute.
target_platform: linux/amd64

python:
  # Must match .python-version. `--update` copies this through verbatim; it
  # involves no registry call.
  version: "3.12.13"

compose:
  # Expressed as a floor, not an equality. The runbook says "Compose v2"; the
  # development machine runs v5.1.3, and a literal v2 check would reject it.
  minimum_version: "2.24.0"

# First-party application images do not exist yet. Session 1 locks the base
# images and package inputs they will be built from. Their own digests become
# mandatory when those images are built, before release.
images:
  POSTGRES_IMAGE: docker.io/pgvector/pgvector:pg18
  TRAEFIK_IMAGE: docker.io/library/traefik:v3.7
  # Session 2. Traefik never mounts the Docker socket; it reads the Docker
  # provider through this proxy over the host-scoped control network, with every
  # write-capable API section explicitly disabled (ADR 0009).
  #
  # This narrows Traefik's Docker API authority. It is not an absolute host
  # boundary -- the proxy process itself still has the socket mounted -- and the
  # threat model says so rather than implying otherwise.
  DOCKER_SOCKET_PROXY_IMAGE: docker.io/tecnativa/docker-socket-proxy:0.3.0
  # Session 4 kept this candidate rather than bumping it (D85). The runbook
  # called 1.25.2 "the minimum accepted security baseline" on the strength of a
  # changelog; ADR 0019 is the standing lesson about version claims read from
  # documentation. What was measured against this digest instead:
  #
  #   PgBouncer 1.24.1, psql and pg_isready present (17.5), uid/gid 70, and a
  #   protocol-level named prepared statement reusable after an *observed*
  #   backend change with max_prepared_statements = 100 -- and unusable across
  #   the same change with 0, which is what proves the first result is the
  #   pooler working rather than the client landing on the same backend.
  #
  # Every behaviour Session 4 needs is present. Bump this when a measurement
  # asks for it, and re-measure the same three things when you do. The values
  # live in tests/contract/test_image_contracts.py, which is executable; no
  # PGBOUNCER_MINIMUM_VERSION floor is written here (D98).
  PGBOUNCER_IMAGE: docker.io/edoburu/pgbouncer:v1.24.1-p1
  # Session 5 bumped this from v13.0.4, and the reason is a measurement rather
  # than the runbook's assertion that 14.16 is required (D127). Measured against
  # both digests, on Docker 29.5.2:
  #
  #   * The image is DISTROLESS. No shell, no wget, no curl -- `docker run
  #     --entrypoint sh` fails with "executable file not found". So a Compose
  #     healthcheck can be neither CMD-SHELL nor an HTTP probe; the only thing
  #     that can look from inside the container is the postgrest binary.
  #   * `postgrest --ready` exists in 14.16 and NOT in 13.0.4, whose CLI offers
  #     only --version, --example, --dump-config and --dump-schema. On 13.0.4
  #     there is no in-container probe at all, and every alternative is worse:
  #     add a shell to the image, or publish the admin port that is bound to
  #     container loopback precisely so nothing can reach it.
  #   * The rest of the delta is ONE key: `jwt-cache-max-lifetime` becomes
  #     `jwt-cache-max-entries`. Both versions dump exactly 40 keys.
  #   * `client-error-verbosity` -- which the runbook's own required baseline
  #     sets, and which its gate asserts -- exists in NEITHER version. It
  #     arrives in 16.0. The runbook asked the version it pins for a key that
  #     version does not have, which is ADR 0019's defect exactly (D144).
  #
  # And the thing to know before trusting the bump: `--ready` returned exit 0
  # while every request to the API returned 404, because it asks the admin
  # server about the pool and the schema cache and about nothing else. It is a
  # necessary probe and not a sufficient one (D145).
  #
  # `latest` is 16.0 today. Not adopted: two majors of unmeasured configuration
  # change, bought for one key this session mitigates in the error wrapper.
  POSTGREST_IMAGE: docker.io/postgrest/postgrest:v14.16
  PGBACKREST_IMAGE: docker.io/woblerr/pgbackrest:2.55.1
  PYTHON_RUNTIME_IMAGE: docker.io/library/python:3.12-slim
  NODE_RUNTIME_IMAGE: docker.io/library/node:22-alpine
  INFISICAL_IMAGE: docker.io/infisical/cli:0.41.89
  DBMATE_IMAGE: docker.io/amacneil/dbmate:2.34.1

# Minimum versions required for a *feature*, not for an image.
#
# Each key `X_MINIMUM_VERSION` pairs with the image `X_IMAGE`: `--update`
# records the resolved semantic version as `X_VERSION`, and the offline
# `--check` asserts `X_VERSION >= X_MINIMUM_VERSION`.
#
# This is a floor, not a proof. A digest cannot tell you what a configuration
# key does -- and the previous floor here is what that costs when it goes
# unchecked: it claimed to guarantee `accessLog.fields.queryParameters`, a key
# that does not exist in any Traefik version (ADR 0019). The floor was real, the
# feature was not, and nothing offline could tell the difference.
#
# A floor is therefore only written here for behaviour that has been observed
# against the image, never for behaviour read from documentation.
feature_floors:
  # Traefik 3.5 and earlier ask the Docker daemon for API v1.24. Docker 29
  # reports minAPI 1.40 and answers 400 to anything older, so the Docker
  # provider never loads and no project route is ever discovered -- the edge
  # comes up healthy and routes nothing.
  #
  # Measured, not read: v3.5 fails and v3.6 works against a Docker 29 daemon,
  # over the socket proxy and over the raw socket alike.
  TRAEFIK_MINIMUM_VERSION: "3.6"

# Package versions, locked as version strings rather than digests because no
# first-party image exists to digest yet.
packages:
  FASTAPI_VERSION: "0.121.2"
  FASTMCP_VERSION: "2.14.1"
  # Session 4 targets this major deliberately (D86). The runbook's fixture was
  # written for Prisma 7 -- prisma.config.ts, DIRECT_URL as the CLI datasource,
  # no `directUrl` datasource field -- which is a different configuration model,
  # not a newer version of this one. In 6.x `directUrl` exists and is exactly
  # the mechanism two transports need: the client through the pooler, migrate
  # through the direct endpoint. Bumping to 7 would be a fixture rewrite bought
  # with no measured need. The acceptance report names the configuration model
  # it tested, and a fixture may not straddle both.
  PRISMA_VERSION: "6.19.1"
  # Re-pinned in Session 5 Run 9a, because the previous value named a release
  # that does not exist (D201). `@scalar/api-reference` published 1.36.2 and
  # then 1.37.0; there has never been a 1.36.4, and no Scalar image carries the
  # tag either. It sat here for four sessions because nothing built from it and
  # because `bin/verify-versions.sh` resolves `images:` against a registry while
  # a `packages:` entry is a string nothing dereferences.
  #
  # 1.64.1 is `latest` at the time of measurement, chosen over 1.36.2 -- the
  # nearest real release to the old string -- because there is no intent to
  # honour: the old number was not a decision anybody made. Both were measured
  # and behave identically for the property that matters (D202): neither ships a
  # self-contained bundle, both name `fonts.scalar.com` and `proxy.scalar.com`
  # in `dist/browser/standalone.js`, and `withDefaultFonts` defaults to true in
  # both. The configuration and the CSP are what make the page self-contained
  # (ADR 0069), not the version.
  SCALAR_VERSION: "1.64.1"
