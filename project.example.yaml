# Example project manifest.
#
# Copy to project.yaml and edit. This file contains no secret value and must
# never contain one: it is committed, and every derived identity in
# outputs.json comes from it.
#
# The fixture values are deliberately distinctive so that a scan of deployable
# source can prove no project identity was hard-coded. Together with
# project.second.example.yaml they also exercise the collision contract --
# "fixture-alpha" and "fixture-alpine" share a 12-character prefix.

# Schema version 3 (ADR 0186): `project.lifecycle` says whether a project is
# permanent or ephemeral. Version 2 (ADR 0183) replaced `mcp.max_result_rows`
# and `mcp.max_response_bytes`, two fields nothing ever read (D929), with
# `mcp.profile`. Versions 1 and 2 still load -- both host manifests are
# version 1 -- and render as permanent projects, which is what they always were.
schema_version: 3

project:
  slug: fixture-alpha
  environment: dev
  domain: fixture-alpha-dev.test
  # `permanent` outlives every release. An ephemeral project says
  # `kind: ephemeral` and carries `expires_at: <RFC 3339 UTC>`; the fleet
  # inventory reports it expired and the retirement verb refuses it before then.
  # Nothing acts on the date by itself.
  lifecycle:
    kind: permanent

database:
  # Defaults to the SQL-safe project key when omitted.
  name: fixture_alpha_dev
  pooled_public: false
  pooled_public_cidrs: []
  max_client_connections: 100
  pool_size: 20

api:
  public_base_path: /api
  max_rows: 500
  # Session 5. The whole section is optional: a manifest without it renders a
  # project that publishes no REST route, which is what every project deployed
  # before this session is.
  rest:
    enabled: true
    # Equal, so an accepted body stays in memory rather than spilling to the
    # proxy's disk.
    request_body_max_bytes: 1048576
    request_body_memory_bytes: 1048576
    # 10 + 3 reserved, plus the pooler's 20 and 5 for administration, against
    # database.max_connections (50 by default). 38 of 50.
    pool_size: 10
    pool_acquisition_timeout_seconds: 5
    pool_max_idle_seconds: 30
    pool_max_lifetime_seconds: 1800
    anonymous_access: deny_data
    # The project's own origin, because the documentation page issues its
    # requests from it. Exact origins only: no path, no wildcard, no `null`.
    allowed_cors_origins:
      - https://fixture-alpha-dev.test
    # Keyed by platform role suffix, and only roles the platform derives.
    statement_timeouts:
      anon: 2s
      authenticated: 5s

mcp:
  public_base_path: /mcp
  # This project's narrowing of the approved capability contract, keyed by tool
  # (ADR 0183). **A profile may only narrow** (D867): every value here is
  # compared against what the approved contract compiles for that tool when the
  # lock is compiled, and one that would widen any bound fails
  # `bin/mcp-contract.sh check --project project.yaml` -- at compile time, with
  # no host and no root. Nothing is clamped. The two values below are the ones
  # the version 1 fields `max_result_rows` and `max_response_bytes` carried for
  # fifteen sessions without a reader; here the lock compiler reads them, and
  # they are placed on the one tool they can honestly bound -- `run_report`
  # returns exactly one row, so a row ceiling of 100 on it would be a widening.
  profile:
    query_resource:
      max_rows: 100
      max_response_bytes: 262144

storage:
  enabled: true
  # The Cloudflare account, from which the S3 endpoint is derived (ADR 0106).
  # An IDENTIFIER rather than a credential -- it appears in the hostname of
  # every request -- so it belongs here and not in secrets.required.yaml.
  #
  # This differs from project.second.example.yaml's, and `jurisdiction` is
  # omitted here while alpine names `eu`, so the pair covers the branch that
  # inserts a jurisdiction label and the branch that does not. Two fixtures
  # agreeing on a value cannot prove the value is read (D332), and one that
  # restates a default cannot prove the default -- which is why this fixture
  # leaves `jurisdiction` out entirely rather than writing `default`.
  #
  # Not a real account: well-formed (32 lowercase hex, which is what
  # `naming.storage_endpoint_url` enforces) and belonging to nobody.
  account_id: 0123456789abcdef0123456789abcdef
  # No `bucket:` and no `prefix:`, deliberately: this fixture exercises the
  # DERIVED names while project.second.example.yaml overrides both. Until Run 3
  # both fixtures declared exactly what the derivation produced, so no fixture
  # exercised the derivation at all -- changing it would have left the whole
  # suite green. That is D332's rule, and it is why D339 was invisible to every
  # test in the repository until a live account was listed.
  #
  # Derived here: bucket `apg-fixture-alpha-dev` (ADR 0105, namespaced because a
  # bucket's collision domain is the whole Cloudflare account) and prefix
  # `objects/fixture-alpha-dev/` (not namespaced -- it lives inside a bucket we
  # already own, so there is nothing to collide with).
  upload_url_ttl_seconds: 600
  download_url_ttl_seconds: 300
  max_upload_bytes: 26214400
  # Session 7. Charged against database.max_connections as pool_size + 2
  # reserved, whether or not storage is enabled (ADR 0099). Deliberately
  # DIFFERENT from project.second.example.yaml's, so the pair proves the budget
  # is resolved per project rather than read from one place -- two fixtures
  # agreeing on every number would render identically for a reason that has
  # nothing to do with the code being right.
  pool_size: 4
  # TWO origins here against project.second.example.yaml's one, and written out
  # of order on purpose. Run 7 renders this list into a Traefik label as one
  # comma-separated value, and with a single entry everywhere `",".join(...)`
  # is indistinguishable from `origins[0]` -- a fixture pair that agreed on the
  # LENGTH would have left that green (D332). The reversed order does the same
  # job for the sort: `outputs.json` and `compose.env` both publish the sorted
  # list, and a renderer that dropped the sort would render this fixture in
  # declaration order and nothing would notice.
  allowed_cors_origins:
    - https://studio.fixture-alpha-dev.test
    - https://app.fixture-alpha-dev.test

backup:
  enabled: true
  stanza: fixture-alpha-dev
  repository_prefix: pgbackrest/fixture-alpha-dev/
  retain_full: 2
  # Session 10. The repository's own account, declared separately from
  # `storage.account_id` so a repository can live somewhere else. Nothing
  # requires the two to match and nothing requires them to differ, and this
  # fixture deliberately reuses the storage account's id: the isolation this
  # session proves is between BUCKETS and the tokens scoped to them (ADR 0145),
  # and a fixture that split the accounts too would make the bucket boundary
  # look like it depended on an account boundary it does not depend on.
  account_id: 0123456789abcdef0123456789abcdef
  # No `bucket` override on purpose -- this fixture exercises the derived
  # `apg-fixture-alpha-dev-backup`, and if both examples overrode it the
  # derivation would be rendered by neither.
