# Example project manifest.
#
# Copy to project.yaml and edit. This file contains no secret value and must
# never contain one: it is committed, and every derived identity in
# outputs.json comes from it.
#
# The fixture values are deliberately distinctive so that a scan of deployable
# source can prove no project identity was hard-coded. Together with
# project.second.example.yaml they also exercise the collision contract --
# "fixture-alpha" and "fixture-alpine" share a 12-character prefix.

schema_version: 1

project:
  slug: fixture-alpha
  environment: dev
  domain: fixture-alpha-dev.test

database:
  # Defaults to the SQL-safe project key when omitted.
  name: fixture_alpha_dev
  pooled_public: false
  pooled_public_cidrs: []
  max_client_connections: 100
  pool_size: 20

api:
  public_base_path: /api
  max_rows: 500
  # Session 5. The whole section is optional: a manifest without it renders a
  # project that publishes no REST route, which is what every project deployed
  # before this session is.
  rest:
    enabled: true
    # Equal, so an accepted body stays in memory rather than spilling to the
    # proxy's disk.
    request_body_max_bytes: 1048576
    request_body_memory_bytes: 1048576
    # 10 + 3 reserved, plus the pooler's 20 and 5 for administration, against
    # database.max_connections (50 by default). 38 of 50.
    pool_size: 10
    pool_acquisition_timeout_seconds: 5
    pool_max_idle_seconds: 30
    pool_max_lifetime_seconds: 1800
    anonymous_access: deny_data
    # The project's own origin, because the documentation page issues its
    # requests from it. Exact origins only: no path, no wildcard, no `null`.
    allowed_cors_origins:
      - https://fixture-alpha-dev.test
    # Keyed by platform role suffix, and only roles the platform derives.
    statement_timeouts:
      anon: 2s
      authenticated: 5s

mcp:
  public_base_path: /mcp
  max_result_rows: 100
  max_response_bytes: 262144

storage:
  enabled: true
  bucket: fixture-alpha-dev
  prefix: objects/fixture-alpha-dev/
  upload_url_ttl_seconds: 600
  download_url_ttl_seconds: 300
  max_upload_bytes: 26214400

backup:
  enabled: true
  stanza: fixture-alpha-dev
  repository_prefix: pgbackrest/fixture-alpha-dev/
  retain_full: 2
