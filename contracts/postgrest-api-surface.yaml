# The reviewed API surface. Hand-written, and deliberately not generated.
#
# ADR 0050: a contract produced from the thing it constrains cannot refuse it.
# This file's whole function is to disagree with the catalog when the catalog is
# wrong, which is what happened for two sessions before ADR 0048 -- four
# documents described this surface, six migrations implemented a different one,
# and every test that could have caught it was written from the code.
#
# What it describes is ADR 0003's example domain as ADR 0048 amends it. The
# migration that makes the catalog match lands in Session 5 Run 5; until then
# this file is the statement of what that migration must produce, which is the
# only order in which a contract can constrain anything.
#
# Project-neutral, because the domain is. Two projects serve the same surface and
# compare against the same file; a project that needs an object this does not
# name needs a reviewed change here, not a second contract.
schema_version: 1
contract_id: notes-tasks-v1

# One schema. `db-schemas` accepts a list, and every additional entry is a
# boundary that has to be argued about on its own.
exposed_schema: api

# The four values ADR 0003 froze, given an executable form (ADR 0058).
#
# An enum rather than a CHECK constraint because only the enum reaches the
# generated document: measured on the locked PostgREST against a table carrying
# both, the enum column publishes its values and the checked text column
# publishes `{"type":"string","format":"text"}`. And in `api` rather than `app`
# because the published `format` string is the type's schema-qualified name, so
# a type in `app` would print a forbidden schema's name in the served artifact.
#
# In `enumsortorder`. The comparison is order-sensitive: a reordering passes a
# set comparison and changes what every generated client lists first.
enums:
  task_status:
    values: [pending, in_progress, completed, cancelled]

relations:
  # Both are security-invoker views over FORCE-RLS tables (migration 0004): the
  # caller's row policy applies, so `owner_id` discloses to a caller only the id
  # it already presented. Reads only -- every write is an RPC that derives
  # ownership instead of accepting it.
  notes:
    kind: view
    methods: [GET, HEAD]
    columns: [id, owner_id, title, content, created_at, updated_at]
  tasks:
    kind: view
    methods: [GET, HEAD]
    # `note_id` is ADR 0048's one approved extension: it is additive, it breaks
    # nothing ADR 0003 states, and removing it would drop a foreign key and its
    # cascade from live data in order to tidy a document.
    columns: [id, owner_id, note_id, title, description, status, created_at, updated_at]

rpcs:
  # Argument names are the PostgreSQL parameter names, exactly, because that is
  # what a caller puts in the JSON body. The runbook's §7.2 names them without
  # the `p_` prefix the functions actually carry; the prefix is what is there.
  create_note:
    methods: [POST]
    arguments: [p_title, p_content]
  # Operation 4 of ADR 0003, and the one the shipped migrations never had. A
  # narrow transition rather than a general update, so that Session 8 has an
  # approved shape to reference from `capabilities.yaml`; `p_expected_status`
  # makes it optimistic rather than last-writer-wins.
  update_task_status:
    methods: [POST]
    arguments: [p_task_id, p_expected_status, p_new_status]

# The agent plane's own functions (ADR 0118). Reviewed here, because ADR 0050's
# invariant is that nothing exists in `api` which this file does not name --
# and deliberately NOT published, because `api_documentation` holds no EXECUTE on
# either and `openapi-mode = follow-privileges` reads the document as that role.
#
# Three rules `api_surface.py` enforces and JSON Schema cannot: an entry takes no
# arguments; a name here may not also appear in `rpcs:`; and every name here must
# be ABSENT from the approved OpenAPI snapshot. The third is the one with teeth
# -- it is checked against the generated artefact rather than against the
# intention, which is D274's whole lesson.
#
# `methods` lists GET as well as POST, and that is a statement about PostgREST
# rather than a preference: it serves `GET /rpc/...` for a STABLE function. The
# reason `rpcs:` forbids GET is that it puts arguments into a query string and
# into every log and cache between the caller and the database -- so the
# no-arguments rule above is exactly what makes GET harmless here.
agent_rpcs:
  # The calling agent's own context. No argument, so it cannot describe anybody
  # else; zero rows for a caller that is not an agent (ADR 0117).
  mcp_agent_context:
    methods: [GET, POST]
    arguments: []
  # `run_report`'s one named backing operation (docs/capability-plan.md).
  # SECURITY INVOKER, so the caller's own RLS bounds the counts. Agent-only:
  # granting it to `authenticated` would be a fifth human operation, and
  # ADR 0003's example domain is frozen.
  owner_activity_report:
    methods: [GET, POST]
    arguments: []

# The agent plane's audit functions (ADR 0135, ADR 0136). Reviewed here for the
# same reason as `agent_rpcs` -- ADR 0050's invariant is that nothing exists in
# `api` which this file does not name -- and in a section of their own because
# they take arguments, which `agent_rpcs` forbids and still should.
#
# Measured on PostgREST v14.16, and both predictions going in were wrong: a GET
# on a VOLATILE function executes it and takes the argument from the query
# string, so volatility refuses nothing. What refuses these two is that they
# WRITE, and PostgREST runs a GET in a read-only transaction -- 25006 surfaced
# as 405, no row written. The same mechanism that stops the pre-request hook
# keeping an audit row (D474).
#
# So the 405 prevents the effect and not the disclosure, and every argument is
# listed because the list is exactly what a GET would put in a URL. None of them
# is a secret: a tool name, a request id, an outcome, two counts, and a
# parameter document the runtime has already redacted per the capability lock's
# `audit.redact`. Neither function takes a principal, an owner, a role or a
# scope -- identity comes from the GUCs the hook set, which is the whole of
# SEC-PARAM-001.
agent_write_rpcs:
  agent_audit_begin:
    methods: [POST]
    arguments: [p_tool, p_request_id, p_parameters]
  agent_audit_complete:
    methods: [POST]
    arguments: [p_audit_id, p_outcome, p_elapsed_ms, p_row_count]

# Never published, under any grant. These four are the ones a misconfigured
# `db-schemas` or a `db-extra-search-path` left at its default would actually
# reach -- `public` is the default, `app` holds the base tables the views exist
# to mediate, `app_private` holds the identity row and the pre-request function,
# and `extensions` holds pgvector's operators.
forbidden_schemas:
  - public
  - app
  - app_private
  - extensions
