- id: SEC-JWT-001
  priority: P0
  target_session: 6
  test_nodeids:
    - tests/contract/test_auth_tokens.py::test_an_unpermitted_algorithm_is_refused
    - tests/contract/test_auth_tokens.py::test_an_unpermitted_typ_is_refused
    - tests/contract/test_auth_tokens.py::test_a_token_naming_an_unknown_kid_is_refused_rather_than_tried_against_every_key
    - tests/contract/test_jwt_claims.py::test_a_token_from_another_issuer_is_refused
    - tests/contract/test_jwt_claims.py::test_a_token_for_another_audience_is_refused
    - tests/contract/test_jwt_claims.py::test_expiry_is_honoured_with_the_leeway_and_not_beyond_it
    - tests/deployment/test_session6_tokens.py::test_a_token_the_service_issues_is_accepted_by_the_other_verifier
    - tests/deployment/test_session6_tokens.py::test_both_verifiers_refuse_the_same_bad_tokens
    - tests/deployment/test_session6_tokens.py::test_an_expired_token_is_refused_by_both_within_the_measured_leeway
  description: >-
    The negative matrix, asked of both verifiers. Wrong issuer, audience,
    algorithm, token type, `kid` or expiry is refused -- by the auth service,
    which signs, and by PostgREST, which verifies independently from a JWKS
    file it read at startup. The two are only two verifiers when something
    makes them read the same key set: until Run 10 nothing did, and every
    token the service issued would have been refused (D276). The expiry case
    carries the measured 30-second leeway rather than the nominal deadline
    (D241), so a token is live for 930s and not 900.

