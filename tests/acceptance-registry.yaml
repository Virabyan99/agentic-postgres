    commit in that order (D1425), so the commit a tag goes on is behind `HEAD`
    on every trip and a reading of `HEAD` is a reading of the wrong commit.

- id: CAP-COMPILE-001
  priority: P0
  target_session: 30
  test_nodeids:
    - tests/contract/test_capability_compiler.py::test_a_successful_compile_writes_the_bytes_it_would_have_streamed
    - tests/contract/test_capability_compiler.py::test_a_refused_compile_leaves_no_file_and_no_temporary
    - tests/contract/test_capability_compiler.py::test_check_and_lock_refuse_dash_dash_output
    - tests/contract/test_session12_documented_path.py::test_no_documented_compile_line_redirects_its_output
    - tests/contract/test_session12_documented_path.py::test_the_compile_scan_catches_a_synthetic_redirect
  description: >-
    `bin/mcp-contract.sh compile --output PATH` writes the candidate to PATH
    only after the compile succeeded, atomically, and leaves PATH absent with
    no temporary behind when the compile is refused. Without `--output` it
    streams to stdout unchanged, and the bytes are the same either way.
    `check` and `lock` refuse the flag: `check` writes nothing by design (ADR
    0050) and `lock` writes through `--outputs`, and a second way to produce a
    contract would be the way nothing audits. A shell `>` truncates its target
    before the command runs, so the documented compile lines used to leave a
    0-byte contract on every refusal and told the reader to delete it (D1359,
    D1540). Both documented lines now pass `--output`, and NO line in the
    documented path that names the compiler redirects -- checked over logical
    lines with their backslash continuations joined, because both are written
    over two physical lines and the redirect was on the second (D1559). ADR
    0050's reason for refusing an output path elsewhere -- that it would put
    the file's ownership in a privileged process -- does not reach this
    command, which needs no root (D1550).

- id: EVD-SHAPE-001
  priority: P0
  target_session: 30
  test_nodeids:
    - tests/contract/test_suite_shape.py::test_no_local_shadows_a_module_level_function
    - tests/contract/test_suite_shape.py::test_the_shadow_scan_catches_a_synthetic_shadow
    - tests/contract/test_suite_shape.py::test_the_shadow_scan_passes_a_differently_named_local_and_a_fixture
    - tests/contract/test_deployment_suite_shape.py::test_every_deployment_proof_is_a_node_id_of_some_requirement
    - tests/contract/test_deployment_suite_shape.py::test_the_registration_scan_catches_a_synthetic_orphan
  description: >-
    Two shapes a green suite cannot show you, each guarded against the
    DEFINITION rather than the instance that was found. No function under
    `tests/` binds a local whose name is a module-level function of the same
    module: D1509 cost a claim, because a live proof rebound `refused` and the
    offline suite -- where the module-level helper is what runs -- could not
    see it. A pytest FIXTURE is not the class and is excluded by construction:
    a fixture is reached by declaring it as a parameter and never by calling
    its name, so of fifty raw collisions in this tree forty-five are fixtures
    and five were real. The guard asserts ZERO with no exemption list. And
    every `test_` function under `tests/deployment/` is a node id of some
    registry entry or is named in a frozen list the guard compares for
    EQUALITY in both directions, so a proof that stops being an orphan must
    leave the list rather than linger in it: a deployment proof that belongs
    to no claim moves nothing when it runs and nothing notices when it does
    not (D386, D1236). Each scan is proved against a synthetic module it must
    catch and one it must pass, and the pass-control carries the exact shape
    that a scan reading a use rather than a binding, or skipping the parameter
    exclusion, would get wrong.

- id: STU-QUERY-002
  priority: P0
  target_session: 30
  test_nodeids:
    - tests/deployment/test_session24_studio.py::test_the_query_view_shows_the_human_their_own_rows_and_not_anothers
  description: >-
    On the deployment, Studio's query view forwarded as a human returns that
    human's rows and none of a second registered subject's -- and the second
    subject's row is proved to EXIST by reading it as that subject through the
    same surface, so an empty result is separated from a result the policy
    filtered (ADR 0195). PostgreSQL is the final authorization authority:
    Studio forwards a request holding the human's own token and has no policy
    of its own, and the stranger is given `notes:read` rather than no scope at
    all, which is the stronger subject -- a caller who CAN read the relation
    and still sees none of the auditor's rows says something a caller who can
    read nothing does not. This proof existed from Session 24 and belonged to
    no requirement, so all three Studio claims read `passed` while its fixture
    errored at setup on an empty scope array migration 0011 refuses and it had
    never executed (D386, D1236, D1544).
