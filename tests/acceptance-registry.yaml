- id: AGT-BUDGET-001
  priority: P0
  target_session: 8
  test_nodeids:
    - tests/contract/test_mcp_tools.py::test_the_row_ceiling_is_the_locks_and_a_caller_can_only_lower_it
    - tests/contract/test_mcp_tools.py::test_the_byte_ceiling_is_independent_of_the_row_ceiling
    - tests/contract/test_mcp_tools.py::test_a_result_inside_both_budgets_is_returned
    - tests/contract/test_mcp_tools.py::test_more_rows_than_the_ceiling_are_refused_rather_than_truncated
    - tests/contract/test_mcp_budgets.py::test_the_four_budgets_are_bounded_by_four_different_things
    - tests/contract/test_mcp_budgets.py::test_the_semaphore_bounds_how_many_run_at_once
    - tests/contract/test_mcp_budgets.py::test_a_slot_is_returned_when_the_body_raises
    - tests/deployment/test_session8_agent_plane.py::test_the_deployed_locks_row_ceiling_bounds_a_live_read
  description: >-
    Four budgets are enforced server-side and are bounded by four different
    mechanisms: rows by the lock's ceiling, which a caller's limit may only
    lower; serialized bytes by a runtime constant a caller cannot express at
    all; elapsed time by the tool's own timeout; and concurrency by a semaphore
    sized as a share of PostgREST's pool. A result exceeding a budget is refused
    rather than truncated, because a truncated page that does not say so is a
    wrong answer. Widened from two budgets to four in Run 9 (ADR 0132): Run 8
    built the other two, and a description that outlives its node ids is D175's
    failure mode in the one file that is supposed to be authoritative.

