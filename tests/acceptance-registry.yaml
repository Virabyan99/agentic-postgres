    - tests/deployment/test_session20_tenant.py::test_no_route_on_either_project_reads_unobserved_after_a_redeploy
  description: >-
    `routes.*.status` carries `unobserved` for a route the deploy did not
    observe and `unavailable` only for one it observed failing or determined is
    not published (D230's absent administrator, D326's absent credential). The
    division is by what was determined: a probe that obtained an HTTP status
    records `unavailable`, one that obtained none -- the first-deploy router
    race, a staging certificate, a timeout -- records `unobserved`. One
    function decides the word, so the printed summary and the document agree;
    every reader of the status accepts the third word; and a healthy deployment
    carries none of them after a redeploy (ADR 0199, D1048, D1047).

