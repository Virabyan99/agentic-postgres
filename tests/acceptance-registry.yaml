- id: AGT-IDEM-001
  priority: P0
  target_session: 16
  test_nodeids:
    - tests/contract/test_agent_audit_plane.py::test_a_replayed_write_performs_the_work_once_and_returns_the_same_row
    - tests/contract/test_agent_audit_plane.py::test_a_different_key_with_the_same_body_writes_twice
    - tests/contract/test_agent_audit_plane.py::test_a_replay_is_audited_as_replayed_and_records_no_rows
    - tests/contract/test_agent_audit_plane.py::test_a_key_reused_for_different_arguments_is_refused
    - tests/contract/test_agent_audit_plane.py::test_a_key_reused_for_a_different_tool_is_refused
    - tests/contract/test_agent_audit_plane.py::test_an_agent_write_without_a_key_is_refused_and_a_human_write_is_not
    - tests/contract/test_mcp_tools.py::test_a_malformed_idempotency_key_is_refused_before_any_dial
    - tests/deployment/test_session16_agent_governance.py::test_a_replayed_write_on_the_deployment_performs_the_work_once
  description: >-
    A replayed agent write carrying the same idempotency key performs the work
    once and returns the row the first call produced - re-read, not stored, so
    the plane holds no caller value - and is audited as replayed; a different
    key with the same body performs the work twice. The claim is taken inside
    the write's own transaction, because a separate claiming request cannot
    deduplicate; a key reused for different arguments or a different tool is
    refused with its own errcode; every agent write requires a key and a human
    write never carries one (ADR 0181).

