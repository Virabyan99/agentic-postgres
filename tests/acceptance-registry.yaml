    - tests/contract/test_auth_endpoints.py::test_rotation_gives_an_expired_agent_a_working_credential_again
    - tests/contract/test_auth_endpoints.py::test_a_creator_may_name_a_lifetime_and_an_impossible_one_is_refused
    - tests/contract/test_auth_endpoints.py::test_a_credential_issued_before_this_release_does_not_expire
    - tests/contract/test_auth_service_shape.py::test_every_state_check_happens_after_the_hash_comparison
    - tests/contract/test_auth_service_shape.py::test_the_agent_expiry_column_has_no_default_so_it_does_not_backfill
