    written by the deployed plane rather than by the proof reading it, a
    bounded prune against that real record is measured inside a transaction the
    proof rolls back and the record is unchanged afterwards, and the doctor's
    agent-record check reports that deployment's own numbers with no threshold
    anywhere.

