    # The live half. `claim_mode` needs one, and the reason is ADR 0065/0066:
    # a refresh that works against a fixture cluster on localhost says nothing
    # about whether the published route answers.
    - tests/deployment/test_session15_identity.py::test_login_through_the_edge_carries_a_refresh_token
