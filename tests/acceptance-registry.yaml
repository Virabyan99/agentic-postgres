  description: >-
    The agent record is removed by an operator who states a horizon, and by
    nothing else (ADR 0213). `app_private.agent_audit_prune` and
    `app_private.agent_idempotency_prune` refuse a missing horizon, a horizon
    in the future and a bound below one; each returns the count it removed and
    leaves everything newer; and both are granted to NOBODY — not to
    `auth_service`, which already reads whole audit rows, nor to any request
    role — so no reachable identity can delete a row. `agent_record_size()`
    reports four numbers and no verdict, and is granted only to the record's
    existing reader, adding no audience and no fact. Nothing in this release
    calls either prune: there is no schedule, no timer and no caller in `src/`,
    `bin/`, `services/` or the templates, so the record grows until somebody
