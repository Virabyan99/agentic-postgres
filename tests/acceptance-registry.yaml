- id: AGT-VOCAB-001
  priority: P0
  target_session: 21
  test_nodeids:
    - tests/contract/test_scope_registry.py::test_the_data_class_is_derived_from_the_reviewed_surface_and_the_classes_still_partition
    - tests/contract/test_scope_registry.py::test_a_tenant_scope_is_permitted_only_over_the_surface_that_derives_it
    - tests/contract/test_scope_vocabulary.py::test_at_schema_4_a_scope_is_a_shape_and_at_3_it_is_the_enum
    - tests/contract/test_scope_vocabulary.py::test_a_scope_the_merged_surface_derives_is_accepted_and_one_it_does_not_is_refused
    - tests/contract/test_scope_vocabulary.py::test_a_relation_named_for_an_enumerated_class_is_refused_at_load_and_at_merge
    - tests/contract/test_scope_vocabulary.py::test_the_issuers_ceiling_is_a_function_of_the_vocabulary
    - tests/contract/test_scope_vocabulary.py::test_the_auth_service_mounts_the_same_lock_the_agent_plane_does
    - tests/contract/test_scope_vocabulary.py::test_no_data_scope_literal_survives_outside_the_schema_and_the_example_manifest
    - tests/contract/test_auth_endpoints.py::test_an_agent_is_granted_a_tenant_scope_only_where_the_lock_derives_it
    - tests/deployment/test_session21_agent.py::test_an_agent_on_beta_is_issued_a_tenant_scope_and_the_same_grant_on_alpha_is_refused
  description: >-
    The data class of the scope vocabulary is derived from a reviewed surface
    by one function -- `<relation>:read` and `<relation>:write` per published
    relation, plus `meta:read` -- and the three classes partition the union for
    every surface; a relation whose derived names would collide with the
    storage or administrative class is refused at load and at merge; at
    capability schema 4 a scope is a shape the compiler approves against the
    surface, and below 4 the enum still applies; no data-scope literal exists
    in `src/` or `services/`; the issuer's ceilings are computed from the
    deployed lock's vocabulary, which the auth container mounts from the same
    file the agent plane reads, so an agent may be granted a tenant's scope on
    a deployment whose surface publishes the relation and on no other (ADR
    0200, D1125, D1126, D1135).

- id: AGT-ROSTER-001
  priority: P0
  target_session: 21
  test_nodeids:
    - tests/contract/test_lock_roster.py::test_a_five_tool_lock_loads_and_serves_five
    - tests/contract/test_lock_roster.py::test_a_tenant_write_compiled_from_a_manifest_loads_and_is_served_through_the_pipeline
