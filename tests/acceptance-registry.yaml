    - tests/contract/test_honest_readers.py::test_no_shell_derives_a_rendered_documents_path_for_itself
    - tests/contract/test_honest_readers.py::test_the_three_repaired_shells_call_the_resolver
    - tests/contract/test_honest_readers.py::test_upgrade_already_distinguished_the_two_and_still_does
    - tests/contract/test_honest_readers.py::test_the_reading_the_root_branch_makes_gives_the_same_answer
    - tests/contract/test_honest_readers.py::test_publish_and_load_rendered_name_the_owner_and_the_remedy
    - tests/contract/test_render_atomicity.py::test_a_render_under_sudo_hands_the_directory_and_the_lock_back
    - tests/contract/test_render_atomicity.py::test_publish_names_the_owner_and_the_remedy_when_it_cannot_replace
    - tests/contract/test_render_atomicity.py::test_the_directories_a_render_creates_name_the_owner_and_the_remedy
    - tests/contract/test_render_atomicity.py::test_the_owner_is_resolved_upward_when_the_path_itself_cannot_answer
    - tests/deployment/test_session20_tenant.py::test_render_as_the_checkout_owner_of_a_root_owned_directory_says_unreadable_not_absent
  description: >-
    A rendered document that exists and cannot be read is reported as
    unreadable (exit 3, naming the path, its owner and the remedy) and never as
    absent (exit 4, "the project was never deployed here"). `bin/migrate.sh`,
    `bin/db.sh` and `bin/postgres-bootstrap.sh` resolve it through one reader
    rather than testing `-f`, which answers false both for a missing file and
    for one inside a directory this user cannot traverse; no shell derives the
    path for itself; and `bin/upgrade.py`, which already distinguished the two,
    still does. The requirement names four readers of a document and not six:
    measured in Run 4, `bin/doctor.py` reads the DEPLOYED document and is
    already honest, and `bin/project-retire.py` reads none (ADR 0199, D1060).
    Session 22 widened it without moving its id or its session, because the
    guarantee is the same one two more readers now keep (D1151, D1154, D1165):
    `rendering.publish` and `evidence.load_rendered` name the owner and the
    `chown` when a directory cannot be replaced or read, resolving the owner
    upward when the path itself cannot answer, instead of crashing on a
    `PermissionError`; `render_project` hands a `sudo` render's directory and
    lock back to the invoking user itself, rather than leaving that to the one
    caller that remembered; and the out-of-process reading is exercised as far
    as an unprivileged workstation can take it, so what stays unmeasured until
    a gate runs as root is the `sudo -u` prefix alone. Session 27 widened it
    again for the same reason (D1391): the four `mkdir` sites that run BEFORE
    `publish` -- the generated root, `.staging`, `.locks` and the per-render
    staging directory -- name the owner and the `chown` too, and the remedy
    names the whole generated root because two of those directories are
    dotfiles a glob does not match.

