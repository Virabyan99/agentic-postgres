- id: OPS-READ-001
  priority: P0
  target_session: 20
  test_nodeids:
    - tests/contract/test_honest_readers.py::test_an_unreadable_document_is_unreadable_and_never_absent
    - tests/contract/test_honest_readers.py::test_an_absent_document_is_absent_and_says_never_deployed
