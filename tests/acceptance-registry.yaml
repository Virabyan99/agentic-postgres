# Acceptance registry — the single hand-authored source of requirement identity.
#
# This file is the ONLY place a requirement ID is created. Two documents are
# generated from it and drift-checked in CI:
#
#   docs/acceptance-matrix.md                       (whole file)
#   docs/product-contract.md § requirement catalog  (marker block)
#
# Hand-maintaining those alongside this file would drift, and the failure mode
# is silent: a P0 requirement listed in prose that no test covers. Generating
# them makes that structurally impossible rather than merely detectable.
#
# Every entry needs:
#   id              stable, unique, prefixed per runbook §4.2
#   priority        P0 | P1 | P2
#   target_session  1-12; the session that must make it pass
#   test_nodeids    exact Pytest node IDs, verified by real collection
#   description     what the requirement guarantees, not how it is tested
#
# A `future` marker's session and requirement must match the entry here.
# tests/contract/test_future_marker_policy.py enforces that in both directions.
#
# A node ID naming a parametrized test refers to all of its cases.

