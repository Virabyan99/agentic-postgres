- id: DX-002
  priority: P0
  target_session: 1
  test_nodeids:
    - tests/contract/test_cli_contract.py::test_help_exits_zero_and_says_something
    - tests/contract/test_cli_contract.py::test_a_verbs_help_is_a_read_and_needs_nothing
    - tests/contract/test_cli_contract.py::test_every_command_documenting_verbs_is_named_in_the_control
    - tests/contract/test_cli_contract.py::test_upgrade_usage_names_every_flag_and_class_its_parser_accepts
    - tests/contract/test_cli_contract.py::test_deploy_help_names_the_session_this_release_implements
    - tests/contract/test_cli_contract.py::test_a_command_about_to_refuse_prints_no_success_sentence
    - tests/contract/test_cli_contract.py::test_no_command_reports_an_unavailable_capability
    - tests/contract/test_cli_contract.py::test_command_works_from_another_directory
    - tests/contract/test_cli_contract.py::test_commands_do_not_echo_a_planted_environment_variable
  description: >-
    Operator commands document themselves, obey the exit-code convention, work
    from any directory, and never print the environment. A VERB documents
    itself too: `--help` anywhere in the arguments prints and exits 0 before
    the verb is dispatched, so no verb refuses to explain itself for want of
    root or of a required argument (D1395, D1402, D1405), over verbs derived
    from each command's own usage rather than from a list. `bin/upgrade.sh`'s
    usage names every flag its parser accepts and every class `--also` takes
    (D1381). `deploy.sh --help` names the session this release implements and
    where that number is read from -- the one argument whose wrong value is
    accepted silently (D1397, D59). And a command that is going to refuse
    prints no success sentence at all: a true sentence computed before a later
    half refuses is held until the whole verb has agreed, so it is never on a
    terminal that then reports a failure (D1403).

