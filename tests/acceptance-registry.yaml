# Session 2 — host, ingress, secrets — active
#
# Each requirement below names both the structural proof, which runs in any
# checkout, and the live proof, which runs only where the thing exists. Neither
# is sufficient alone: structure without measurement misses the leak that went
# around the structure, and measurement without structure passes on the day
# nobody happened to exercise the path.
#
# The live proofs are skipped by an environment gate, never by a `future`
