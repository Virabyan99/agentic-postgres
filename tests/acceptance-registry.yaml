    - tests/contract/test_client_ir.py::test_the_three_authentication_operations_are_read_from_the_app_snapshot
    - tests/contract/test_client_ir.py::test_a_snapshot_object_the_surface_does_not_name_is_refused_and_vice_versa
    - tests/contract/test_client_ir.py::test_an_unknown_column_format_is_refused_and_never_typed_any
    - tests/contract/test_client_ir.py::test_every_format_the_committed_snapshots_serve_has_a_typescript_type
    - tests/contract/test_client_ir.py::test_every_spelling_postgrest_serves_has_a_typescript_type
    - tests/contract/test_client_ir.py::test_the_pt_codes_are_scanned_from_the_release_and_the_set
    - tests/contract/test_client_ir.py::test_the_caller_facing_tokens_match_the_runtimes
    - tests/contract/test_client_ir.py::test_the_reserved_write_parameters_match_the_harnesss
    - tests/contract/test_client_ir.py::test_the_ir_carries_four_digests_and_the_rest_one_is_the_snapshots_fingerprint
    - tests/contract/test_client_ir.py::test_two_builds_are_equal
  description: >-
    `client_ir.build(...)` reads exactly four committed inputs -- the merged
    reviewed surface, the project's (or the release's) PostgREST snapshot, the
    application snapshot and the project's compiled lock -- and nothing else,
    and no live address reaches it. It carries every relation with the
    surface's columns and the snapshot's types, every reviewed RPC with its
    argument schema in parameter order, the three authentication operations,
    every tool of the lock with its arguments and scopes, the enum vocabulary,
    the capability schema's filter operators, the PT codes the release AND the
    project's own set raise, the seven caller-facing tokens, and four digests.
    A snapshot object the surface does not name is refused and so is a surface
    object the snapshot does not publish; an unknown column format is refused
    rather than typed `any`. Every spelling PostgREST serves for a type -- as a
    COLUMN and as an RPC ARGUMENT, scalars and arrays alike -- carries a
    TypeScript type, and a type's two spellings carry the SAME one. Two builds
    of one contract are equal (ADR 0204, ADR 0158).

- id: GEN-EMIT-001
  priority: P0
  target_session: 23
  test_nodeids:
    - tests/contract/test_client_typescript.py::test_the_emitter_reads_the_ir_and_nothing_else
    - tests/contract/test_client_typescript.py::test_every_emitted_file_carries_the_generated_banner
    - tests/contract/test_client_typescript.py::test_no_emitted_file_carries_a_credential_a_token_or_a_url_with_userinfo
    - tests/contract/test_client_typescript.py::test_the_digests_live_in_one_file_and_the_app_one_is_never_compared
    - tests/contract/test_client_typescript.py::test_the_package_declares_no_runtime_dependency
    - tests/contract/test_client_typescript.py::test_nothing_the_client_emits_prints_or_retries
    - tests/contract/test_client_typescript.py::test_init_reports_three_outcomes_and_never_folds_unreachable_into_stale
    - tests/contract/test_client_typescript.py::test_the_error_unions_are_the_pt_codes_and_the_seven_tokens
    - tests/contract/test_client_typescript.py::test_a_write_wrapper_requires_the_two_reserved_parameters
    - tests/contract/test_client_typescript.py::test_the_example_client_is_the_emitters_output_byte_for_byte
  description: >-
    The TypeScript emitter reads the intermediate representation and nothing
    else -- asserted over its own syntax tree, which admits `client_ir` and the
    standard library and no path under `contracts/` or `projects/`. Every
    emitted file carries the generated banner; the four digests live in one
    file; no emitted file carries a credential, a token, a password, a signing
    key or a URL with userinfo; the package declares no runtime dependency; the
    client prints nothing and retries nothing. `init()` answers `unreachable`
    separately from `stale_contract` and `listResources()` has a third answer
    for a plane that cannot say which lock it loaded (ADR 0195). The emitted
    `PtCode` union is exactly the contract's PT vocabulary and `AgentRefusal`
    exactly the seven tokens an agent may be told -- equality in both
    directions, because a superset is the failure (D433). Every write wrapper
    declares `idempotency_key` and `dry_run` REQUIRED, so a caller cannot omit
    the claim the write makes in its own transaction (ADR 0181, ADR 0182). The
    committed example client is the emitter's output byte for byte, asked by
    running the product's own `--check` (D1114).

- id: GEN-HASH-001
  priority: P0
  target_session: 23
  test_nodeids:
    - tests/contract/test_generated_client_runtime.py::test_init_accepts_the_served_surface_it_was_generated_from
    - tests/contract/test_generated_client_runtime.py::test_init_refuses_a_surface_with_another_fingerprint_naming_both
    - tests/contract/test_generated_client_runtime.py::test_init_separates_unreachable_from_a_document_it_cannot_read
    - tests/contract/test_generated_client_toolchain.py::test_the_smoke_reports_unreachable_rather_than_a_stale_contract
    - tests/deployment/test_session23_client.py::test_the_example_client_initialises_on_beta_and_refuses_alpha
  description: >-
    `init()` fetches the REST service's OpenAPI document AS THE CALLER,
    normalizes it the way the capture does -- basePath asserted, host and
    schemes substituted, residue refused -- fingerprints it in the JavaScript
    canonical form and compares it to the digest embedded in the package. A
    mismatch refuses every later call as `stale_contract` NAMING BOTH DIGESTS;
    a service that did not answer is `unreachable` and is never reported as a
    stale contract, because a client that could not reach a service knows
    nothing about its surface (ADR 0195). On a deployment, the generated
    example client accepts the project it was generated for and refuses the
    other project, whose surface is the release's alone -- the control that
    says the check discriminates rather than merely passes (ADR 0204, D1114).

- id: GEN-TYPES-001
  priority: P0
  target_session: 23
  test_nodeids:
    - tests/contract/test_generated_client_runtime.py::test_a_typed_read_returns_rows_of_the_declared_shape
    - tests/contract/test_generated_client_runtime.py::test_a_refused_write_arrives_as_the_pt_code_the_database_raised
    - tests/contract/test_generated_client_runtime.py::test_a_filter_value_is_a_value_and_never_query_syntax
    - tests/contract/test_client_typescript.py::test_a_request_names_only_reviewed_columns_operators_and_arguments
  description: >-
    Through the generated client against a surface a real PostgREST is serving:
    a typed relation read returns rows of the declared shape; a write the
    product refuses arrives as a refusal carrying the PT code the DATABASE
    raised, never as a thrown transport error; and a filter value that looks
    like query syntax stays a value, judged by what PostgREST answers rather
    than by a string this repository wrote (ADR 0127). A request the client
    cannot express cannot be sent: no `select` outside a relation's reviewed
