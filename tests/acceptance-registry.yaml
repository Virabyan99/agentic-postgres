    - tests/contract/test_container_exec.py::test_the_shell_library_and_the_module_print_the_same_sentence
    - tests/contract/test_container_exec.py::test_the_guard_library_is_not_a_command
    - tests/contract/test_container_exec.py::test_the_guard_refuses_a_terminal_on_stdout_with_only_stderr_redirected
    - tests/contract/test_database_commands.py::test_every_shell_docker_exec_closes_or_supplies_stdin
    - tests/contract/test_database_commands.py::test_docker_exec_forwards_stdin
  description: >-
    Every `docker exec` and every `bin/compose.sh run` this product performs is
    built by one function and run with stdin CLOSED unless input is supplied,
    in which case `-i` is passed and the input is fed through it (ADR 0218).
    `sudo`'s `use_pty` backgrounds a command whose streams are not all
    terminals, and a child that then reads the terminal takes SIGTTIN and
    stops -- so the hang is the MIXED shape, a terminal on stdin with output
    redirected, and it is a property of the child's stdin rather than of how
    the argv is spelled. An AST scan over the whole tree finds no `subprocess`
    call under `bin/` or `src/` that runs `docker` or `compose.sh` outside the
    helper, and it is proved against a synthetic module it must catch and the
    helper's own call it must find, so a scan that matched nothing cannot
    report the tree clean. A tty and a fed stdin are refused together, because
    they are two different stdins. `deploy.sh` still refuses the mixed
    terminal shape with the sentence it has refused it with since D972, now
    through a shell function it sources rather than a copy -- and the bytes of
    that sentence are asserted equal on both sides, so the two cannot drift.
    The guard library is sourced and is not a command: it carries no shebang
    and is mode 644. The two shell commands that exec a container directly
    close or supply stdin on the line.

