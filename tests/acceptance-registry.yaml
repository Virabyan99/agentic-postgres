  description: >-
    Every enabled capability has positive and adversarial evaluation cases.
    The derived cases are generated from the compiled contract, one adversarial
    case per frozen field, and carry an expectation - permitted, refused or
    bounded - and never a denial reason; the reasons are observed when the
    cases run, and the derived adversarial cases are asserted not to be all
    refused by the same first check. Hand-written cases are counted separately
    and bound to the capability version they were written against, so a
    capability changed without its cases fails the gate and CI. The report the
    cases are derived for carries the contract's digest, and the deployment
    publishes the same digest for the contract it serves (ADR 0184, D868).

