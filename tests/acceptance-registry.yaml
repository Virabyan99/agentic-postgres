    - tests/contract/test_capability_compiler.py::test_the_tool_takes_the_riskiest_of_its_capabilities_not_the_first
    - tests/contract/test_mcp_tools.py::test_a_version_one_lock_carrying_the_new_fields_is_refused
    - tests/deployment/test_session16_agent_governance.py::test_the_deployed_locks_risk_is_the_worst_of_what_backs_each_tool
  description: >-
    Every capability carries a risk classification from a closed, ordered
    vocabulary; the manifest refuses a metadata capability that claims more
    than low and a write that claims low; a tool backed by several capabilities
    is classified as the riskiest of them, never the first; and a lock at a
    version that requires the classification is refused at startup without it.
