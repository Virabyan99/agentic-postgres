  description: >-
    Studio holds the human's access and refresh tokens in process memory and
    nothing else -- no signing key, no database credential, no provider token,
    no SSH key -- and verifies no JWT: it is a HOLDER, not a verifier. The
    password reaches it from a TTY prompt or a `0600` file and from nowhere
    else; an argument is refused by name and no environment variable is read for
    one, proved with a password-shaped variable set. The token never reaches the
    page -- no response body, header or asset carries it -- is never printed and
    never logged: the request log is a method and a path with the query string
    and the launch key removed. An upstream refusal is relayed as a KIND of no
    and never as the upstream's body.
