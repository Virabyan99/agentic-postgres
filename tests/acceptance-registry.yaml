# tests. ADR 0040 removed the configuration that statement was about, so the
# statement was versioned rather than left standing over tests that no longer
# describe it. The replacement is stronger in the direction ADR 0017 requires:
# every input the old pair accepted -- a public pooler with a well-formed
# allowlist -- is now refused, and nothing the old pair refused is now accepted.

