    policy to consult, so project-key existence stays visible to an account
    already named in the sudoers rule -- sudo is the coarse gate, the policy is
    the fine one. Narrowed from "no distinction anywhere" by ADR 0043's
    amendment on acceptance, because the original claim was true of the broker
    and could never be true of the trampoline.

