- id: GEN-IR-001
  priority: P0
  target_session: 23
  test_nodeids:
    - tests/contract/test_client_ir.py::test_the_ir_is_built_from_the_four_inputs_and_nothing_else
    - tests/contract/test_client_ir.py::test_relations_carry_the_surfaces_columns_and_the_snapshots_types
    - tests/contract/test_client_ir.py::test_rpcs_carry_the_snapshots_argument_schema_in_parameter_order
