- id: SEC-REV-001
  priority: P0
  target_session: 9
  test_nodeids:
    - tests/contract/test_auth_endpoints.py::test_a_revoked_agents_existing_token_stops_at_the_authoritative_check
    - tests/contract/test_auth_endpoints.py::test_a_revoked_agent_cannot_exchange_its_secret_for_a_fresh_token
    - tests/security/test_session9_revocation.py::test_a_revoked_agents_context_cannot_be_resolved
    - tests/security/test_session9_revocation.py::test_both_a_read_and_a_write_lose_their_context_together
    - tests/security/test_session9_revocation.py::test_no_upstream_status_becomes_a_degraded_mode
    - tests/deployment/test_session9_agent_writes.py::test_the_admin_audit_endpoint_refuses_an_administrator_without_the_scope
  description: >-
    A token issued before revocation is denied on its next read and write
    through both MCP and PostgREST. Session 9 PROVES this rather than building
    it: migration 0018's agent_claims_are_current is the authoritative check and
    PATCH /admin/agents/{agent_id} is the revocation route, both since earlier
    sessions (D471, D472). The proof takes the product's own route -- the claims
    are captured while the agent is active and replayed unchanged after the
    PATCH -- and the positive arm runs first, so a hook that refused everything
    cannot pass. Both doors are asserted: the existing token stops, and the
    unchanged secret cannot be exchanged for a fresh one.

- id: SEC-PARAM-001
  priority: P0
  target_session: 9
  test_nodeids:
    - tests/security/test_session9_revocation.py::test_no_write_tool_declares_an_argument_that_could_name_a_principal
    - tests/security/test_session9_revocation.py::test_the_audit_functions_take_no_identity_argument
    - tests/security/test_session9_revocation.py::test_the_admin_audit_endpoints_filters_are_not_a_counterexample
    - tests/contract/test_agent_audit_plane.py::test_the_audit_identity_comes_from_the_guc_and_not_from_a_parameter
    - tests/contract/test_agent_audit_plane.py::test_an_agent_cannot_close_another_agents_record
    - tests/deployment/test_session9_agent_writes.py::test_the_audit_functions_take_no_principal_on_the_deployed_cluster
  description: >-
    Tool parameters cannot override agent identity, role, or scope -- and the
    guarantee is STRUCTURAL rather than validated (D473, ADR 0135). Identity
    comes from the app.agent_id and app.user_id GUCs the pre-request hook sets
    from the token, and neither audit function declares a principal, an owner, a
    role or a scope, so there is no argument for a caller to lie in. Asserted as
    an absence: a validated form would be a list of forbidden names, which is a
    list that silently stops being complete.

- id: AGT-WRITE-001
  priority: P0
  target_session: 9
  test_nodeids:
    - tests/contract/test_mcp_tools.py::test_a_write_name_is_hidden_from_a_caller_without_its_scope
    - tests/contract/test_mcp_tools.py::test_a_write_the_caller_holds_no_scope_for_is_refused_before_any_dial
    - tests/contract/test_mcp_tools.py::test_holding_one_write_scope_does_not_carry_the_other
    - tests/contract/test_mcp_tools.py::test_a_visible_name_can_still_hide_a_resource_behind_it
    - tests/contract/test_mcp_tools.py::test_a_write_tool_exposes_the_locks_own_argument_names_in_order
    - tests/deployment/test_session9_agent_writes.py::test_a_write_agent_creates_one_note_through_the_agent_plane
    - tests/deployment/test_session9_agent_writes.py::test_a_denied_write_is_recorded_and_never_reaches_the_database
  description: >-
    A read-only agent can neither discover nor invoke a write, and the two are
    proved SEPARATELY because hiding a name is not a boundary (ADR 0140).
    Discovery filtering is disclosure control -- measured: a hidden tool is still
    callable by name and runs -- so the boundary is the call-time scope check,
    and both levels are asserted. Holding one write scope does not carry the
    other. The positive arm writes a real row under the agent's OWNER's identity
    (ADR 0117), without which every refusal below could be a broken credential.

- id: AGT-AUDIT-001
  priority: P0
  target_session: 9
  test_nodeids:
    - tests/contract/test_mcp_tools.py::test_the_record_is_opened_before_the_work_and_closed_after
    - tests/contract/test_mcp_tools.py::test_the_records_parameters_are_redacted_per_the_lock
    - tests/contract/test_mcp_tools.py::test_a_denied_call_is_recorded_as_refused
    - tests/contract/test_mcp_tools.py::test_a_metadata_tool_opens_no_record_at_all
    - tests/contract/test_mcp_tools.py::test_redaction_does_not_invent_a_parameter_the_caller_never_sent
    - tests/deployment/test_session9_agent_writes.py::test_one_agent_write_leaves_both_records_and_they_agree
    - tests/deployment/test_session9_agent_writes.py::test_the_recorded_parameters_are_redacted_per_the_lock
    - tests/deployment/test_session9_agent_writes.py::test_the_admin_audit_endpoint_serves_what_the_table_holds
  description: >-
    Read, write, denied and failed attempts are audited with redaction, and ONE
    MCP write leaves TWO records that agree (D480, ADR 0135). An agent_plane row
    records what was attempted -- including a denial that never reached the
    database -- and a database row records what actually changed, including a
    write that reached PostgREST without going near the agent plane. A database
    row can only ever say `committed`, because a row written inside the
    transaction it describes is rolled back with it (D489). Metadata is not
    audited at all, which keeps discovery from depending on the audit table.
    Redaction is the capability lock's and the record stores what it is given.

- id: AGT-AUDITFAIL-001
  priority: P0
  target_session: 9
  test_nodeids:
    - tests/contract/test_mcp_tools.py::test_a_write_whose_record_cannot_be_opened_does_not_happen
    - tests/contract/test_mcp_tools.py::test_a_read_whose_record_cannot_be_opened_still_answers
    - tests/contract/test_mcp_tools.py::test_a_failing_complete_never_changes_the_outcome
    - tests/deployment/test_session9_agent_writes.py::test_a_write_whose_audit_record_cannot_be_opened_does_not_happen
    - tests/deployment/test_session9_agent_writes.py::test_a_read_survives_the_same_audit_failure
  description: >-
    A write fails closed when its audit record cannot be created, and a read
    does NOT -- the asymmetry is the decision rather than an omission (ADR 0141,
    D483). Failing a read closed would couple every agent read's availability to
    the audit table. On the deployment the failure is arranged by withdrawing a
    real grant, so the write path fails through the real transport, the real
    function and the real privilege; "did not happen" is asserted against
    app.notes rather than against the shape of the refusal, because a tool that
    errored after committing would satisfy any assertion about the response.
    A failing `complete` never changes an outcome that already happened.

