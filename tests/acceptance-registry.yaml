    - tests/deployment/test_session16_agent_governance.py::test_the_deployed_lock_is_the_one_the_installed_manifests_profile_produced
  description: >-
    A project profile may only narrow the compiled contract, in the seven
    bounds the runtime reads from the lock and nothing else. A profile that
    would widen any bound, name a tool the contract does not compile, bound a
