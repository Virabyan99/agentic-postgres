    - tests/contract/test_lock_roster.py::test_the_runtime_digests_a_tool_list_exactly_as_the_compiler_does
    - tests/contract/test_lock_roster.py::test_a_tenant_write_registered_from_the_lock_is_audited_before_its_scope_is_checked
    - tests/contract/test_lock_roster.py::test_a_read_over_an_rpc_with_arguments_and_a_metadata_capability_outside_the_pair_are_refused
    - tests/contract/test_mcp_tools.py::test_a_five_tool_lock_loads_and_serves_five
    - tests/contract/test_mcp_tools.py::test_a_lock_missing_a_metadata_tool_is_refused
    - tests/contract/test_mcp_tools.py::test_a_metadata_tool_by_another_name_is_refused
    - tests/contract/test_mcp_tools.py::test_the_registered_roster_is_the_locks_roster
    - tests/contract/test_api_migrations.py::test_retiring_the_task_tools_is_no_longer_blocked_by_the_roster
    - tests/deployment/test_session21_agent.py::test_alpha_serves_six_beta_seven_and_a_reader_can_neither_see_nor_call_the_tenant_write
  description: >-
    The runtime registers its tools from the deployed lock by kind and shape,
    never by name: the metadata pair is the runtime's own and required in every
    lock; a read is a query over published relations or one argument-free RPC;
    a write is the lock's argument list plus the two reserved parameters. A
    lock with fewer tools than the release's contract loads (D933 closed); a
    lock missing either metadata tool, carrying a metadata tool under another
    name, a read over an RPC with arguments, or a `tools_sha256` the compiler
    did not write is refused at startup; the call-time scope check and the
    audit order (`begin` before the check, ADR 0141) hold for a tool the
    runtime had never seen; and retiring the task tools is no longer blocked by
    the roster (ADR 0200, D1124, D1129, D1130, D1140).

