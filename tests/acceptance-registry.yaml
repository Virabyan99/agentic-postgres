  description: >-
    A project whose reviewed surface or approved snapshot has not been captured
    yet is refused as a CONTRACT failure and not as invalid operator input: the
    manifest is well formed and the artefact is the project's own review, so
    both raise sites raise `CapabilityContractError` and every command that
    meets them exits 5 -- `compile`, `check`, `generate` and the evaluation
    report alike, which last exited 2 on the same sentence until D1360. A
    manifest that is genuinely invalid still exits 2.
    A project manifest at schema 6 may name a capability manifest under
    `projects/<slug>/`, beside its migration set; it is compiled against the
    merged surface and the project's own snapshot into the project's contract,
    whose id derives from the project's surface; `mcp-contract.sh check
