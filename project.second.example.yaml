# Second example project manifest.
#
# Exists to prove isolation, not to demonstrate a different feature set. The
# slug is deliberately similar to project.example.yaml's -- "fixture-alpha"
# and "fixture-alpine" share the first 12 characters -- so that a naive
# prefix-based derivation would collide here and a correct one will not.
#
# Every project-scoped identity rendered from this file must differ from the
# one rendered from project.example.yaml. See runbook §8 and
# tests/contract/test_render_isolation.py.

schema_version: 2

project:
  slug: fixture-alpine
  environment: dev
  domain: fixture-alpine-dev.test

database:
  name: fixture_alpine_dev
  pooled_public: false
  pooled_public_cidrs: []
  max_client_connections: 100
  # Sixteen, against the alpha fixture's twenty. The difference exists so that
  # `database.pooler_pool_size` in the rendered document can be told apart from
  # a constant: Run 1's mutation battery replaced the field with a hard-coded
  # 20 and every test stayed green, because both fixtures said 20. A pair of
  # fixtures that agree on a value cannot prove the value is read.
  pool_size: 16

api:
  public_base_path: /api
  max_rows: 500
  rest:
    enabled: true
    request_body_max_bytes: 1048576
    request_body_memory_bytes: 1048576
    pool_size: 10
    pool_acquisition_timeout_seconds: 5
    pool_max_idle_seconds: 30
    pool_max_lifetime_seconds: 1800
    anonymous_access: deny_data
    # This project's own origin, and only it. The two fixtures share a base path
    # and differ in domain, so a CORS list copied between them is a list that
    # names the other project -- which is the isolation failure this pair exists
    # to catch.
    allowed_cors_origins:
      - https://fixture-alpine-dev.test
    statement_timeouts:
      anon: 2s
      authenticated: 5s

mcp:
  public_base_path: /mcp
  # A DIFFERENT narrowing from project.example.yaml's, for the reason
  # `database.pool_size` above differs: a pair of fixtures that agree on a value
  # cannot prove the value is read (D884). This one narrows a write as well as a
  # read, and in both boolean directions -- a permission withdrawn and a
  # restriction added -- so that the polarity split ADR 0183 fixes is exercised
  # by a shipped manifest rather than only by a test.
  profile:
    query_resource:
      max_rows: 50
      max_response_bytes: 131072
      timeout_ms: 3000
    run_report:
      timeout_ms: 2000
    create_note:
      supports_dry_run: false
    update_task_status:
      requires_approval: true

storage:
  enabled: true
  bucket: fixture-alpine-dev
  prefix: objects/fixture-alpine-dev/
  # A different account from alpha's, and a NAMED jurisdiction where alpha omits
  # the field (ADR 0106). The two together are what make the endpoint derivation
  # measurable: alpha proves the default branch, this one proves the branch that
  # inserts a jurisdiction label, and a renderer ignoring either input would
  # fail one of them. `eu` is the only non-default value with a documented
  # endpoint form; nothing here has ever dialled it, and the schema's comment
  # says so rather than implying all three jurisdictions are proved.
  account_id: fedcba9876543210fedcba9876543210
  jurisdiction: eu
  # Every one of these differs from the alpha fixture's, and that is D332's rule
  # applied on the day the fields are published rather than a run later: two
  # fixtures that agree on a value cannot prove the value is read. A hard-coded
  # constant in the renderer would leave the whole suite green for as long as
  # both projects happened to want 600.
  upload_url_ttl_seconds: 900
  download_url_ttl_seconds: 120
  max_upload_bytes: 10485760
  # 256 against alpha's 384 -- and alpha declares none at all, so the pair also
  # exercises the default rather than only the override. Provisional on both
  # sides: a second application container's memory floor is listed as "must be
  # measured" and cannot be until there is an adapter to measure it.
  memory_limit_mb: 256
  # Two, against the alpha fixture's four, and the difference is the point:
  # the pair is what proves the connection budget is resolved per project
  # (ADR 0099). It also puts this project's storage budget at 4 and alpha's at
  # 6, so a document that carried one project's figure for the other would show
  # up as a wrong number rather than as an identical one.
  pool_size: 2
  allowed_cors_origins:
    - https://app.fixture-alpine-dev.test

backup:
  enabled: true
  stanza: fixture-alpine-dev
  repository_prefix: pgbackrest/fixture-alpine-dev/
  retain_full: 2
  account_id: fedcba9876543210fedcba9876543210
  # This one DOES override the bucket, and the asymmetry with the alpha fixture
  # is the point: between them the two examples render both the derived name
  # and a verbatim override, so ADR 0105's "an override is not prefixed" is
  # exercised by a real render rather than by a unit test alone. The value is
  # deliberately not `apg-`-shaped, because an override that happened to look
  # derived would pass whether or not the prefixing branch was taken.
  bucket: alpine-dev-repository
  # `retain_full: 2` above is also the default, and that is not redundant here:
  # a fixture that omitted it would leave the default resolution unrendered,
  # which is precisely the state D519 found this field in for nine sessions.
